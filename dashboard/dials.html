<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gray &mdash; dials</title>
<link rel="stylesheet" href="/page.css">
<style>
/* Two rules, and both are about fitting a drawing into a table cell.

   Everything else on this page - the block, the table, the dimension line, the
   chips - is a shared component. The dimension line moved into page.css when
   /summary and this page both started drawing one.

   The page used to carry 18 rules of its own, including a second `.track` that
   collided with page.css's distance-to-bar axis and a whole colour legend for a
   distinction that is now the page's structure instead. */

/* The range column. Wide enough that a dimension line has room for its value in
   the middle without the arrowheads touching it, and it is the only column that
   should take the slack. */
td.range { width:42%; min-width:250px; }

/* The mix, as one stacked bar. It is a DISTRIBUTION - three shares of one
   whole - which is a different claim from every other drawing on this page, so
   it is drawn differently on purpose. It sat in the middle of the ranges looking
   like one of them. */
.share { display:flex; height:10px; border-radius:var(--r-pill); overflow:hidden;
  background:var(--line); margin:var(--sp-2) 0 var(--sp-3); }
.share i { display:block; height:100%; }
.share i + i { box-shadow:inset 2px 0 0 var(--surface); }
</style>
</head>
<body>
<div id="nav"></div>
<div class="sheet" id="sheet"><div class="empty">Loading&hellip;</div></div>

<script src="/page.js"></script>
<script>
/* Dials. What varies during training, how far, and does the robot know.

   That last clause is the page. There are two kinds of dial here and they are
   not two flavours of one thing - they are opposites:

     the robot is TOLD    forward, sideways, turn, height, pitch, roll.
                          Handed to the policy every step. Set one and it obeys.
     the robot is NOT     foot grip, mass, where the weight sits, servo strength,
                          gearbox drag. Rolled fresh at the start of every
                          attempt and never mentioned. It finds out through its
                          feet.

   The old page put all eleven in one list and carried that distinction in a
   colour and a legend, under two paragraphs explaining the taxonomy before
   showing any of it. The split is the page's structure now. The colours stayed,
   because a difference worth making is worth making twice, but nothing depends
   on them alone.

   Every range is a DIMENSION LINE and not a bar. A bar means "how much",
   measured from zero; a range is an interval, and the question is which part of
   the scale it covers. `forward` is the whole reason that matters: its span does
   not contain zero, and a bar cannot show a gap. */

get("/api/dials").then(s => {
mountNav("/dials", navState(s.nav));

const command = s.command || [];
const world = s.world || [];
const mix = s.mix || {};
const shove = s.shove || {};

/* Decimal places come from the DIAL, not from each value, so one row never
   prints "0.800 to 1.20". A sign is only shown where the dial has two sides: a
   "+" on a friction coefficient reads as a change, not a value. */
const dp = (d) => {
  const a = Math.max(Math.abs(d.lo), Math.abs(d.hi));
  return a >= 100 ? 0 : a >= 10 ? 1 : a >= 1 ? 2 : 3;
};
const num = (v, d) => {
  if (v === null || v === undefined) return "—";
  const places = typeof d === "object" ? dp(d) : 3;
  const signed = typeof d === "object" ? d.lo < 0 : true;
  return (v > 0 && signed ? "+" : "") + Number(v).toFixed(places);
};

/* ------------------------------------------------------------ the drawing -- */

/* One dimension line. `world` picks the second colour; everything else is the
   same drawing making the same claim. */
function dim(d, world) {
  const a = d.full_lo, b = d.full_hi;
  const pc = (v) => b === a ? 0 : 100 * (v - a) / (b - a);
  const lo = pc(d.lo), hi = pc(d.hi);
  const zero = (a < 0 && b > 0)
    ? `<div class="zero" style="left:${pc(0).toFixed(2)}%"><b>0</b></div>` : "";
  /* A real-world value that has been measured, drawn where it falls. Red when it
     is outside the swept span, because that is the case the robot has no answer
     for; grey when it is inside, because then it is just a reassurance. */
  const pins = (d.refs || []).map(r => {
    const inside = d.lo <= r.at && r.at <= d.hi;
    return `<div class="pin ${inside ? "inside" : ""}" style="left:${pc(r.at).toFixed(2)}%"
      title="${esc(r.what)} — ${num(r.at, d)} ${esc(d.unit || "")}${
      inside ? ", inside the swept range" : ", OUTSIDE the swept range"}"></div>`;
  }).join("");
  return `<div class="dim ${world ? "world" : ""}">
    <div class="ground"></div>${zero}
    <div class="wit" style="left:${lo.toFixed(2)}%"></div>
    <div class="wit" style="left:${hi.toFixed(2)}%"></div>
    <div class="ext" style="left:${lo.toFixed(2)}%;width:${Math.max(hi - lo, 0.4).toFixed(2)}%"></div>
    <div class="val" style="left:${((lo + hi) / 2).toFixed(2)}%">${
      num(d.lo, d)} to ${num(d.hi, d)}${d.unit ? " " + esc(d.unit) : ""}</div>
    ${pins}
    <div class="ends"><span>${num(a, d)}</span><span>${num(b, d)}</span></div>
  </div>`;
}

/* One row per dial. The `note` column is where a dial says the one thing that is
   true only of it - that its ends are a measured mechanical limit rather than a
   choice, or that a real value falls outside what was ever swept. */
function row(d, world) {
  const outside = (d.outside || []);
  const note = outside.length
    ? `<span style="color:var(--crit)">${outside.map(r =>
        `${esc(r.what)} is ${num(r.at, d)}`).join(", ")} — never swept</span>`
    : d.measured_limit
    ? esc(d.limit_note || "the ends are a measured limit, not a choice")
    : "";
  return `<tr>
    <td class="k">${esc(d.name)}${d.units_note
      ? `<div class="faint" style="font-size:var(--t-cap)">${esc(d.units_note)}</div>` : ""}</td>
    <td class="why">${esc(d.what)}</td>
    <td class="range">${dim(d, world)}</td>
    <td class="why">${note}</td></tr>`;
}

const table = (rows, world) => `
  <table class="t">
    <tr><th>dial</th><th>what it means</th>
        <th class="range">swept range, against everything it could be set to</th>
        <th>worth knowing</th></tr>
    ${rows.map(d => row(d, world)).join("")}
  </table>`;

/* ------------------------------------------------------------- the shares -- */

/* How the three command dials are drawn. Not a range - three shares of one
   whole - so it gets the one stacked bar on the page and its own block. */
function shares() {
  const stop = mix.standing, straight = mix.forward_only;
  if (stop == null || straight == null)
    return blk("How the three are drawn", null,
      `<div style="padding:11px">${empty("Could not read the mix from "
       + "gray/tasks/walk_env_cfg.py. The banner above names the constant.")}</div>`);
  const full = Math.max(0, 1 - stop - straight);
  const pct = (v) => (100 * v).toFixed(0);
  const bar = [[stop, "var(--muted)"], [straight, "var(--s1)"],
               [full, "var(--s4)"]];
  return blk("How the three are drawn", null, `
    <div style="padding:11px">
      <div class="share">${bar.map(([v, c]) =>
        `<i style="width:${(100 * v).toFixed(1)}%;background:${c}"></i>`).join("")}</div>
      <table class="t">
        <tr><th>share</th><th class="n">of draws</th><th>what it means</th></tr>
        <tr><td class="k"><span class="sw" style="background:var(--muted)"></span>a full stop</td>
          <td class="n">${pct(stop)}%</td>
          <td class="why">all three set to zero. About 1 attempt in ${
            Math.round(1 / stop)}. Without them the policy never learns that zero
            means stand still</td></tr>
        <tr><td class="k"><span class="sw" style="background:var(--s1)"></span>straight, nothing else</td>
          <td class="n">${pct(straight)}%</td>
          <td class="why">sideways and turn forced to zero, forward speed as
            drawn — backward included</td></tr>
        <tr><td class="k"><span class="sw" style="background:var(--s4)"></span>the full draw</td>
          <td class="n">${pct(full)}%</td>
          <td class="why">the only share that ever gets a turn or a lean. This is
            why a pure sideways step has almost never happened</td></tr>
        <tr><td class="k">held for</td>
          <td class="n">${mix.hold_lo == null ? "—" : `${mix.hold_lo}–${mix.hold_hi} s`}</td>
          <td class="why">then re-rolled, mid-stride, so it has to change its mind
            rather than settle into one command</td></tr>
      </table>
    </div>`);
}

/* -------------------------------------------------------------- the shove -- */

/* An event, not a dial, and last because of it. Nothing about it is a range the
   robot is swept across; something hits the robot and it has to stay up. */
function theShove() {
  const pair = (p, unit) => (Array.isArray(p) && p[0] != null)
    ? `${p[0]}–${p[1]} ${unit}` : "—";
  return blk("The shove", null, `
    <div style="padding:11px">
      <div class="note ${shove.on_in_walk ? "key" : ""}" style="margin-bottom:var(--sp-3)">
        <b>${shove.on_in_walk ? "On in the walk task." : "Off in the walk task, on in push."}</b>
        ${shove.on_in_walk ? "" : `A first walk has enough to deal with, so
        <code>cfg.events.pop("shove")</code> switches it off. The five dials above
        stay on.`}</div>
      <table class="t">
        <tr><th>what</th><th class="n">how much</th><th>why it is not a dial</th></tr>
        <tr><td class="k">shove speed</td><td class="n">${pair(shove.speed, "m/s")}</td>
          <td class="why">a sideways kick to the trunk, from a random angle</td></tr>
        <tr><td class="k">shove spin</td>
          <td class="n">${Array.isArray(shove.spin) && shove.spin[1] != null
            ? `±${shove.spin[1]} rad/s` : "—"}</td>
          <td class="why">and it sets the robot turning at the same time</td></tr>
        <tr><td class="k">how often</td><td class="n">${pair(shove.every, "s")}</td>
          <td class="why">an interval between events, not a range it is swept over</td></tr>
      </table>
    </div>`);
}

/* ---------------------------------------------------------------- the page -- */

$("#sheet").innerHTML = `
  ${titleblock([
    { k: "sheet", v: "Dials" },
    { k: "subject", v: "everything that gets varied" },
    { k: "told to the robot", v: `${command.length} dials` },
    { k: "never told", v: `${world.length} dials` },
    { k: "could not read", v: (s.missing || []).length ? `${s.missing.length}` : "none" },
    { k: "read from", html: `<span class="mono">gray/tasks/</span>, live` },
  ])}

  ${(s.missing || []).length ? `<div class="banner bad"><div>
    <b>Could not read ${s.missing.length} of them.</b> ${esc(s.missing.join("; "))}.
    Those rows are blank rather than guessed.</div></div>` : ""}

  <p class="lede">Two kinds, and the difference is the only thing to hold on to:
    <b>the robot reads one kind and not the other</b>. Every number below is read
    out of the task files as this page loads, so none of it can go stale.</p>

  <div class="grid wide">
    ${blk("What you can ask for", command.length, table(command, false),
      `<span class="mono">walk_env_cfg.py</span>`)}
  </div>

  <p class="note key" style="margin:var(--sp-4) 0">
    <b>Set one of those and it obeys, as well as it can.</b> They arrive in the
    policy's inputs every single step, alongside which way is down and where its
    joints are. They are the whole of what you can ASK for.</p>

  <div class="grid wide">
    ${blk("What it has to cope with", world.length, table(world, true),
      `<span class="mono">push_env_cfg.py</span>`)}
  </div>

  <p class="note" style="margin:var(--sp-4) 0">
    <b>You cannot ask it to be lighter.</b> These are rolled fresh at the start of
    every attempt and never told to the robot — it finds out through its feet.
    Inside the range that was swept, it copes. Outside it, it guesses: never sweep
    foot grip below 0.4 and ice is a stranger. None of it is a new skill, either.
    The policy never sees the word gravel; it sees the same numbers arriving in a
    different pattern.</p>

  <div class="grid wide">${shares()}${theShove()}</div>`;
}).catch(e => fail(e, "#sheet"));
</script>
</body>
</html>

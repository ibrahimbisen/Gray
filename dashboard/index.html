<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gray &mdash; project summary</title>
<link rel="stylesheet" href="/page.css">
</head>
<body>
<div class="top" id="top"></div>
<div class="shell">
  <div class="side"></div>
  <div class="main"></div>
</div>

<script src="/page.js"></script>
<script>
document.getElementById("top").innerHTML = topbar("/summary", "Project summary");

/* Stage 1 is amber rather than green on purpose: eleven of eleven checks passing
   says the model is self-consistent, not that it is the robot. */
const CLS  = { "provisional": "later", "in progress": "now", "start now": "now" };
const CHIP = { "provisional": "warn",  "in progress": "now", "start now": "now" };

function rewardTable(t) {
  if (t.error) {
    return `<div class="card"><h3>${esc(t.title)}</h3>
      <div class="risk small"><b>Could not build this config.</b> ${esc(t.error)}</div>
    </div>`;
  }
  const earn = t.terms.filter(x => x.sign === "+");
  const lose = t.terms.filter(x => x.sign === "-");
  const rows = (list) => list.map(r => `<tr>
      <td class="n" style="color:${r.sign === "+" ? "var(--ok)" : "var(--bad)"};
          font-size:17px;font-weight:700">${r.sign}</td>
      <td><b>${esc(r.label)}</b>
        <div class="dim" style="margin-top:2px">${
          r.described ? esc(r.note)
            : `<i>No written explanation. It is in the code and not on this page
               &mdash; that gap is shown rather than hidden.</i>`}</div></td>
      <td class="n dim" style="text-align:right">${r.weight}</td>
    </tr>`).join("");
  return `<div class="card">
    <h3>${esc(t.title)}
      <span class="chip">${t.terms.length} terms</span>
      ${t.undescribed ? `<span class="chip warn">${t.undescribed} unexplained</span>` : ""}</h3>
    <p class="why small">${esc(t.note)}</p>
    <div class="tw scroller"><table>
      <tr><th class="n"></th><th>What it measures</th><th class="n">weight</th></tr>
      ${rows(earn)}${rows(lose)}
    </table></div>
    <div class="note small" style="margin-top:12px"><b>Ceiling:</b> the rewards are
      capped at 1.0 each, so the most this run can score is
      <b>${t.ceiling}</b> per step before penalties.</div>
  </div>`;
}

fetch("/api/state").then(r => r.json()).then(s => shell([

  { id: "stages", label: "The project, in three stages", html: () => `
    <div class="eyebrow">Gray</div>
    <h1>${esc(s.goal.one_line)}</h1>
    <p class="lede">Three stages, and they are a loop rather than a line. Stage 1
      is provisional &mdash; three of its numbers have no datasheet. Stage 2 is
      where the project lives for a long time. Stage 3 measures what stage 1 is
      guessing, which is why it starts now instead of last.</p>
    <div class="cols tight">
      ${s.project.map(p => `
        <div class="stagecard ${CLS[p.state] || ""}">
          <div class="num">${p.n}</div>
          <h3>${esc(p.name)}</h3>
          <p class="small" style="margin-bottom:10px">${esc(p.one_line)}
            <span class="chip ${CHIP[p.state] || "warn"}">${esc(p.state)}</span></p>
          <p class="why small">${esc(p.summary)}</p>
          <div class="grow"></div>
          <div class="note small" style="margin:8px 0 12px"><b>Where it stands:</b>
            ${esc(p.headline)}</div>
          <a class="plain small" href="${esc(p.page)}">Open stage ${p.n} &rarr;</a>
        </div>`).join("")}
    </div>` },

  { id: "loop", label: "Why it is a loop", count: s.loop.edges.length, html: () => `
    <div class="eyebrow">Stage 3 &rarr; Stage 1</div>
    <h1>Why it is a loop, not a line</h1>
    <p class="lede">${esc(s.loop.one_line)}</p>
    <div class="card">
      <div class="tw"><table>
        <tr><th class="n">From</th><th>What it measures</th><th>Why it cannot be
          settled any other way</th></tr>
        ${s.loop.edges.map(e => `<tr>
          <td class="n"><span class="chip" style="font-family:ui-monospace">${
            esc(e.from)}</span></td>
          <td><b>${esc(e.what)}</b>
            <div class="dim small">feeds ${esc(e.to)}</div></td>
          <td class="dim">${esc(e.why)}</td></tr>`).join("")}
      </table></div>
      <div class="note key small" style="margin-top:14px"><b>What the loop costs:</b>
        ${esc(s.loop.cost)}</div>
    </div>` },

  { id: "goal", label: "What we are training for", html: () => `
    <div class="eyebrow">Gray</div>
    <h1>What we are training for</h1>
    <p class="lede">${esc(s.goal.one_line)}</p>
    <div class="cols">
      ${s.goal.paragraphs.map(p => `<div class="card">
        <p class="small">${esc(p)}</p></div>`).join("")}
    </div>
    <div class="note key" style="margin-top:18px"><b>Done looks like:</b>
      ${esc(s.goal.success)}</div>` },

  { id: "model", label: "Model status",
    count: s.model && s.model.total ? `${s.model.passed}/${s.model.total}` : null,
    html: () => `
    <div class="eyebrow">Stage 1 output</div>
    <h1>Model status</h1>
    <p class="lede">The simulator's robot, checked against the real one. Run
      live on every page load. These checks say the model is self-consistent
      &mdash; they cannot say it is the robot.</p>
    <div class="card">${modelBlock(s.model)}</div>` },

  { id: "scoring", label: "Reward function",
    count: (s.rewards.tasks || []).length, html: () => `
    <div class="eyebrow">How points are given</div>
    <h1>Reward function</h1>
    <p class="lede">${esc(s.scoring_intro[0])}</p>
    ${s.rewards.error ? `<div class="card"><div class="risk small">
      <b>Not shown.</b> ${esc(s.rewards.error)}</div></div>` : ""}
    <div class="cols">
      <div class="card">
        <h3>How it works</h3>
        ${s.scoring_intro.slice(1).map(p => `<p class="why small">${esc(p)}</p>`).join("")}
        <div class="note key small" style="margin-top:12px"><b>Source:</b>
          <code>${esc(s.rewards.source)}</code>. Nothing on this page is a copy
          &mdash; an earlier hand-written list drifted and named four terms that
          no longer existed while missing four that did.</div>
      </div>
      ${(s.rewards.tasks || []).map(rewardTable).join("")}
    </div>` },

  { id: "feasibility", label: "Can this machine train it", html: () => `
    <div class="eyebrow">Measured, not assumed</div>
    <h1>Can this machine train it</h1>
    <p class="lede">${esc(s.feasibility.verdict)}</p>
    ${facts(s.feasibility.facts)}
    <div class="cols tight">
      ${s.feasibility.risks.map(r => `<div class="card">
        <h3>${esc(r.risk)}<span class="lv ${esc(r.level)}">${esc(r.level)}</span></h3>
        <p class="why small">${esc(r.detail)}</p></div>`).join("")}
    </div>` },

])).catch(fail);
</script>
</body>
</html>

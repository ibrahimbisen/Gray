<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gray &mdash; how the whole thing works</title>
<link rel="stylesheet" href="/page.css">
<style>
/* ---------------------------------------------------------------------------
   This page is a schematic sheet, not an article.

   The subject is a control system explained to the engineer who built the
   machine, and the native vernacular for that is the block diagram: boxes,
   labelled wires, a controller, a plant. So the identity is drawn rather than
   written - the diagrams carry the argument and the prose annotates them.

   Two rules hold it together. Accent blue is reserved for a LIVE SIGNAL and
   appears nowhere else, so a blue line always means numbers are moving along
   it. And every label ON a diagram is monospaced while every sentence ABOUT one
   is not, which is how a real drawing separates the thing from the note about
   the thing.

   Tokens come from page.css so this page belongs with the rest of the
   dashboard; only the diagram layer is added here.
   --------------------------------------------------------------------------- */
:root{
  --wire:#2b323d;                     /* drawn hairline, warmer than --line */
  --plate:#13161c;                    /* the diagram field, under the cards */
  --sig:var(--accent);                /* a live signal. Never used for anything else. */
}
@media (prefers-color-scheme: light){
  :root{ --wire:#ccd2dd; --plate:#eef1f5; }
}
:root[data-theme="dark"]{ --wire:#2b323d; --plate:#13161c; }
:root[data-theme="light"]{ --wire:#ccd2dd; --plate:#eef1f5; }

body{ overflow:auto; display:block; }
.sheet{ max-width:1120px; margin:0 auto; padding:0 28px 120px; }

/* ---------- masthead ---------- */
.mast{ padding:60px 0 44px; border-bottom:1px solid var(--wire); }
.mast .kicker{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--sig); margin-bottom:16px; }
.mast h1{ font-size:clamp(30px,5vw,50px); line-height:1.04; letter-spacing:-.035em;
  font-weight:800; max-width:16ch; text-wrap:balance; margin:0 0 18px; }
.mast p{ font-size:18px; line-height:1.6; color:var(--dim); max-width:62ch; margin:0; }
.mast .meta{ display:flex; flex-wrap:wrap; gap:26px; margin-top:30px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; }
.mast .meta b{ display:block; font-size:20px; font-weight:700; color:var(--ink);
  font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
.mast .meta span{ color:var(--faint); text-transform:uppercase; letter-spacing:.1em;
  font-size:10.5px; }

/* ---------- plates ---------- */
.plate{ padding:64px 0; border-bottom:1px solid var(--wire); }
.plate:last-child{ border-bottom:0; }
.plate > header{ display:grid; grid-template-columns:auto 1fr; gap:18px;
  align-items:start; margin-bottom:26px; }
.pnum{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px;
  font-weight:700; color:var(--sig); border:1px solid var(--wire);
  border-radius:6px; padding:5px 9px; letter-spacing:.06em; margin-top:5px; }
.plate h2{ font-size:clamp(22px,3.2vw,32px); line-height:1.12; letter-spacing:-.028em;
  font-weight:750; margin:0 0 8px; max-width:22ch; text-wrap:balance; }
.plate header p{ font-size:16.5px; line-height:1.6; color:var(--dim);
  max-width:62ch; margin:0; }
.plate .prose{ max-width:62ch; }
.plate .prose p{ font-size:15.5px; line-height:1.68; margin:0 0 14px; }
.plate .prose p:last-child{ margin-bottom:0; }
.plate .prose b{ color:var(--ink); }

.split{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:36px; align-items:start; }
@media (max-width:900px){ .split{ grid-template-columns:1fr; gap:28px; } }

/* ---------- the drawing layer ---------- */
.dwg{ background:var(--plate); border:1px solid var(--wire); border-radius:14px;
  padding:26px 24px; overflow-x:auto; }
.dwg .cap{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10.5px;
  letter-spacing:.13em; text-transform:uppercase; color:var(--faint);
  margin-bottom:18px; }
.dwg .foot{ font-size:12.5px; color:var(--dim); margin-top:18px; line-height:1.55; }

/* Every label on a drawing is monospaced. Every sentence about one is not. */
.mono{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-variant-numeric:tabular-nums; }

/* -- the signal chain: sensors -> policy -> joints -- */
.chain{ display:grid; grid-template-columns:1fr auto 1fr auto 1fr; gap:0;
  align-items:center; min-width:660px; }
.blk{ border:1px solid var(--wire); border-radius:10px; background:var(--panel);
  padding:14px 16px; }
.blk.core{ border-color:var(--sig); border-width:2px; padding:20px 18px;
  box-shadow:0 0 0 5px color-mix(in srgb,var(--sig) 9%,transparent); }
.blk h4{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10.5px;
  letter-spacing:.13em; text-transform:uppercase; color:var(--faint);
  margin:0 0 10px; font-weight:600; }
.blk .big{ font-size:30px; font-weight:750; letter-spacing:-.03em; line-height:1;
  font-variant-numeric:tabular-nums; }
.blk .big small{ font-size:12px; font-weight:500; color:var(--dim); letter-spacing:0;
  margin-left:6px; }
.io{ list-style:none; margin:0; padding:0; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12px; font-variant-numeric:tabular-nums; }
.io li{ display:flex; gap:10px; padding:3px 0; color:var(--dim); }
.io li b{ color:var(--ink); width:26px; text-align:right; flex:0 0 auto; }
.io li.sum{ border-top:1px solid var(--wire); margin-top:7px; padding-top:7px;
  color:var(--ink); font-weight:700; }

/* A wire carries numbers. Blue, and only ever blue. */
.wire{ position:relative; height:2px; background:var(--sig); min-width:56px; }
.wire::after{ content:""; position:absolute; right:-1px; top:-4px;
  border-left:9px solid var(--sig); border-top:5px solid transparent;
  border-bottom:5px solid transparent; }
.wire em{ position:absolute; top:-26px; left:50%; transform:translateX(-50%);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--sig);
  font-style:normal; white-space:nowrap; }

/* Decided, not yet fitted. Dashed and unlit on purpose: blue means a live
   signal on this page, so drawing a solid wire to a sensor nobody has soldered
   would be a lie in the page's own language. */
.planned{ margin-top:20px; border:1px dashed var(--wire); border-radius:10px;
  padding:15px 17px; }
.planned .io li{ color:var(--faint); }
.planned .io li b{ color:var(--dim); }
.planned .tot{ display:flex; justify-content:space-between; align-items:baseline;
  gap:12px; border-top:1px solid var(--wire); margin-top:10px; padding-top:10px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px;
  color:var(--faint); font-variant-numeric:tabular-nums; }
.planned .tot b{ font-size:19px; font-weight:750; color:var(--ink);
  letter-spacing:-.02em; }

/* -- the sampled box: one track per axis -- */
.axis{ margin-bottom:22px; }
.axis:last-child{ margin-bottom:0; }
.axis .hd{ display:flex; align-items:baseline; gap:10px; margin-bottom:9px; }
.axis .hd b{ font-size:14px; }
.axis .hd span{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11px; color:var(--faint); }
.track{ position:relative; height:26px; border-radius:5px;
  background:repeating-linear-gradient(90deg,var(--wire) 0 1px,transparent 1px 9px);
  border:1px solid var(--wire); }
.track .span{ position:absolute; top:-1px; bottom:-1px; border-radius:5px;
  background:color-mix(in srgb,var(--sig) 26%,transparent);
  border:1px solid var(--sig); }
.track .zero{ position:absolute; top:-5px; bottom:-5px; width:1px;
  background:var(--faint); }
.track .pin{ position:absolute; top:50%; width:9px; height:9px; margin:-5px 0 0 -5px;
  border-radius:50%; background:var(--bad); box-shadow:0 0 0 3px var(--plate); }
.axis .ends{ display:flex; justify-content:space-between; margin-top:6px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10.5px;
  color:var(--faint); font-variant-numeric:tabular-nums; }

/* -- sim | real, one file spanning the divide -- */
.mirror{ position:relative; display:grid; grid-template-columns:1fr 1fr; gap:0;
  border:1px solid var(--wire); border-radius:12px; overflow:hidden;
  min-width:600px; }
.mirror > div{ padding:22px 20px 78px; }
.mirror > div + div{ border-left:1px dashed var(--wire); }
.mirror h4{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10.5px;
  letter-spacing:.13em; text-transform:uppercase; margin:0 0 14px; font-weight:600; }
.mirror .l{ color:var(--faint); }
.mirror .bridge{ position:absolute; left:50%; bottom:16px; transform:translateX(-50%);
  background:var(--panel); border:2px solid var(--sig); border-radius:10px;
  padding:12px 22px; text-align:center; white-space:nowrap;
  box-shadow:0 0 0 6px color-mix(in srgb,var(--sig) 10%,transparent); }
.mirror .bridge b{ display:block; font-size:15px; letter-spacing:-.01em; }
.mirror .bridge span{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:10.5px; color:var(--sig); letter-spacing:.1em; text-transform:uppercase; }

/* -- bars against their bar -- */
.bar{ margin-bottom:16px; }
.bar:last-child{ margin-bottom:0; }
.bar .hd{ display:flex; align-items:baseline; gap:8px; margin-bottom:7px; }
.bar .hd b{ font-size:14px; flex:1; }
.bar .hd .v{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px;
  font-variant-numeric:tabular-nums; font-weight:700; }
.bar .rail{ height:8px; border-radius:99px; background:var(--wire); overflow:hidden; }
.bar .rail i{ display:block; height:100%; border-radius:99px; }
.bar .note{ font-size:11.5px; color:var(--faint); margin-top:5px; }

.pill{ display:inline-block; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; padding:3px 9px;
  border-radius:99px; border:1px solid var(--wire); color:var(--dim); }
.pill.go{ color:var(--ok); border-color:color-mix(in srgb,var(--ok) 45%,transparent); }
.pill.no{ color:var(--bad); border-color:color-mix(in srgb,var(--bad) 45%,transparent); }
.pill.now{ color:var(--sig); border-color:color-mix(in srgb,var(--sig) 45%,transparent); }

.callout{ border-left:2px solid var(--sig); padding:4px 0 4px 16px; margin:20px 0 0;
  max-width:62ch; }
.callout b{ display:block; margin-bottom:4px; }
.callout p{ font-size:14.5px; line-height:1.6; color:var(--dim); margin:0; }
.callout.warn{ border-color:var(--bad); }

.files{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px; }
.file{ border:1px solid var(--wire); border-radius:11px; padding:16px 17px;
  background:var(--panel); }
.file .id{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px;
  font-weight:700; color:var(--sig); }
.file h4{ margin:6px 0 4px; font-size:16px; letter-spacing:-.015em; }
.file p{ font-size:12.5px; color:var(--dim); margin:0 0 10px; line-height:1.5; }

.notfiles{ list-style:none; margin:14px 0 0; padding:0; }
.notfiles li{ display:grid; grid-template-columns:46px 1fr; gap:12px;
  padding:9px 0; border-top:1px solid var(--wire); font-size:13.5px; }
.notfiles li .k{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11px; color:var(--faint); padding-top:2px; }
.notfiles li span{ color:var(--dim); }
.notfiles li b{ color:var(--ink); }

table.pts{ width:100%; border-collapse:collapse; font-size:13px; }
table.pts td{ padding:6px 10px 6px 0; border-bottom:1px solid var(--wire);
  vertical-align:top; }
table.pts tr:last-child td{ border-bottom:0; }
table.pts .s{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; width:16px;
  font-weight:700; font-size:15px; }
table.pts .w{ text-align:right; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-variant-numeric:tabular-nums; color:var(--faint); white-space:nowrap; }

@media (prefers-reduced-motion:no-preference){
  .plate{ animation:rise .5s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes rise{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:none; } }
}
a.plain:focus-visible, .thumb:focus-visible{ outline:2px solid var(--sig);
  outline-offset:2px; border-radius:4px; }
</style>
</head>
<body>
<div class="top" id="top"></div>
<div class="sheet" id="sheet"><p class="muted" style="padding:60px 0">Loading&hellip;</p></div>

<script src="/page.js"></script>
<script>
document.getElementById("top").innerHTML = topbar("/summary", "How the whole thing works");

const n = (x, d = 0) => (x == null || !isFinite(x)) ? "&mdash;"
  : Number(x).toLocaleString(undefined, {minimumFractionDigits: d, maximumFractionDigits: d});

fetch("/api/state").then(r => r.json()).then(s => {

const obs   = s.observation || {};
const axes  = (s.sampling || {}).axes || [];
const cmds  = ((s.sampling || {}).headline || {}).commands || "—";
const envs  = ((s.sampling || {}).headline || {}).envs || "—";
const lib   = s.library || {};
const rt    = lib.run_totals || {};
const drive = s.driven || {};
const batch = s.batch || {};
const walk  = ((s.rewards || {}).tasks || []).find(t => t.key === "walk") || {terms: []};
const status = s.status || {};
const head  = status.headline || {};
const r1    = (status.tasks || []).find(t => t.id === "R1");

/* A page that white-screens because one field is missing is worse than a page
   with a gap in it. This one is served by summary_state(), and server.py is NOT
   in the dashboard's hot-reload list - so an older server process answers with
   an older shape and every new plate reads undefined. Say that, rather than
   throwing. */
const stale = !s.observation || !s.status || !s.sampling;

/* ------------------------------------------------------------------ 1 ---- */
const chain = () => `
  <div class="dwg">
    <div class="cap">the policy &middot; one file</div>
    <div class="chain">
      <div class="blk">
        <h4>what it senses</h4>
        <ul class="io">
          ${(obs.terms || []).map(t =>
            `<li><b>${t.n}</b> ${esc(t.note)}</li>`).join("")}
          <li class="sum"><b>${obs.total || 0}</b> numbers in</li>
        </ul>
      </div>
      <div class="wire"><em>in</em></div>
      <div class="blk core">
        <h4>the policy</h4>
        <div class="big">${obs.total || 0} &rarr; 12</div>
        <p class="mono" style="font-size:11.5px;color:var(--dim);margin:10px 0 0">
          ~300 KB of numbers.<br>No motion library.<br>No inverse kinematics.</p>
      </div>
      <div class="wire"><em>out</em></div>
      <div class="blk">
        <h4>what it moves</h4>
        <div class="big">12<small>joint angles</small></div>
        <p class="mono" style="font-size:11.5px;color:var(--dim);margin:10px 0 0">
          one set every 20 ms.<br>The servo PWM period<br>sets that limit.</p>
      </div>
    </div>
    ${batch.added ? `<div class="planned">
      <div class="cap">decided, not yet fitted &middot; gray/config/sensors.yaml</div>
      <ul class="io">
        ${(batch.rows || []).map(r =>
          `<li><b>+${r.adds}</b> ${esc(r.name)}</li>`).join("")}
      </ul>
      <div class="tot">
        <span>${obs.total || 0} now &nbsp;+&nbsp; ${batch.added} from
          ${batch.sensors} sensors &nbsp;=</span>
        <b>${batch.after} inputs</b></div>
    </div>
    <div class="foot">The dashed block is not in any trained policy. Adding it
      changes how many inputs the file takes, which makes it a different file,
      so all ${batch.sensors} go in together in one retrain rather than one at a
      time. <a class="plain" href="/stage2#sensors">The full sensor list
      &rarr;</a></div>` : ""}
    <div class="foot">These exact inputs have not occurred before. Section 4
      covers why that still works.</div>
  </div>`;

/* ------------------------------------------------------------------ 2 ---- */
const earn = walk.terms.filter(t => t.sign === "+");
const lose = walk.terms.filter(t => t.sign === "-");
const ptrow = (t) => `<tr>
  <td class="s" style="color:${t.sign === "+" ? "var(--ok)" : "var(--bad)"}">${t.sign}</td>
  <td><b>${esc(t.label)}</b></td>
  <td class="w">${t.weight}</td></tr>`;

/* ------------------------------------------------------------------ 4 ---- */
const track = (a) => {
  // Domain is symmetric and wider than the sampled span, so an axis that never
  // goes negative LOOKS like one. That asymmetry is the finding.
  const dom = Math.max(Math.abs(a.lo), Math.abs(a.hi)) * 1.6;
  const pc  = (v) => (50 + 50 * v / dom).toFixed(2) + "%";
  const asked = drive.cases ? drive.cases
    .filter(c => c.went_nowhere && a.axis === "forward")
    .map(c => c.commanded.vx) : [];
  return `<div class="axis">
    <div class="hd"><b>${esc(a.axis)}</b>
      <span>${esc(a.const)} = (${a.lo}, ${a.hi}) ${esc(a.unit)}</span></div>
    <div class="track">
      <div class="zero" style="left:50%"></div>
      <div class="span" style="left:${pc(a.lo)};right:${(100 - parseFloat(pc(a.hi))).toFixed(2)}%"></div>
      ${asked.map(v => `<div class="pin" style="left:${pc(v)}" title="asked for ${v}, stood still"></div>`).join("")}
    </div>
    <div class="ends"><span>${(-dom).toFixed(2)}</span>
      <span style="color:var(--sig)">sampled ${a.lo} to ${a.hi}</span>
      <span>+${dom.toFixed(2)}</span></div>
  </div>`;
};

/* ------------------------------------------------------------------ 6 ---- */
const barRow = (c) => {
  const better = c.better === "lower";
  const best = c.best;
  if (best == null) return "";
  // Fraction of the way to passing, capped. For a lower-is-better criterion
  // that is bar/best, which goes to zero as the miss grows - which is honest:
  // drift at 2125 against a 100 bar should look like almost nothing done, not
  // like 95% of the way there.
  const frac = better ? Math.min(1, c.bar / best) : Math.min(1, best / c.bar);
  const met  = better ? best <= c.bar : best >= c.bar;
  const col  = met ? "var(--ok)" : frac > 0.5 ? "var(--warn)" : "var(--bad)";
  const dp   = c.bar < 1 ? 2 : 1;
  return `<div class="bar">
    <div class="hd"><b>${esc(c.name)}</b>
      <span class="v" style="color:${col}">${n(best, dp)}</span>
      <span class="mono" style="font-size:11px;color:var(--faint)">
        ${better ? "≤" : "≥"} ${n(c.bar, dp)} ${esc(c.unit || "")}</span></div>
    <div class="rail"><i style="width:${(frac * 100).toFixed(1)}%;background:${col}"></i></div>
    ${!met ? `<div class="note">${better
        ? `${(best / c.bar).toFixed(1)}&times; over the bar`
        : `${(best / c.bar * 100).toFixed(0)}% of the bar`}</div>` : ""}
  </div>`;
};

/* ------------------------------------------------------------------------ */
document.getElementById("sheet").innerHTML = `

${stale ? `<div class="callout warn" style="max-width:none;margin:26px 0 0">
  <b>This page is being served by an old dashboard process.</b>
  <p>Everything below that needs a live measurement is blank, because the server
    answering is running code from before this page existed. <code>server.py</code>
    is not hot-reloaded &mdash; the data modules are, the server is not. Stop
    every dashboard process and start one:
    <span class="mono">run.bat</span></p></div>` : ""}

<header class="mast">
  <div class="kicker mono">Gray &middot; 12-joint quadruped</div>
  <h1>How the training works</h1>
  <p>${esc(s.goal.one_line)} Six sections: what gets deployed, how it is trained,
    why there are three files, the command range, what runs on the real robot,
    and current status.</p>
  <div class="meta">
    <div><b>${obs.total || 0}</b><span>numbers in${
      batch.added ? `, ${batch.after} decided` : ""}</span></div>
    <div><b>12</b><span>joint angles out</span></div>
    <div><b>50 Hz</b><span>control rate</span></div>
    <div><b>${lib.total || 0}</b><span>skills in the library</span></div>
    <div><b>${(lib.runs || []).length}</b><span>files</span></div>
    <div><b>${cmds}</b><span>commands per run</span></div>
  </div>
</header>

<section class="plate">
  <header><div class="pnum">01</div><div>
    <h2>What gets deployed</h2>
    <p>One file. ${obs.total || 0} numbers in, 12 joint angles out, 50 times a
      second. Everything else in the project exists to produce that file and
      check it. ${batch.added ? `${batch.sensors} more sensors are decided and
      not yet fitted; they would make it ${batch.after} in.` : ""}</p>
  </div></header>
  ${chain()}
  <div class="callout"><b>It is not a stored motion.</b>
    <p>No library of movements, no keyframes, no inverse kinematics at runtime.
      It computes 12 angles from ${obs.total || 0} inputs, every step.</p></div>
</section>

<section class="plate">
  <header><div class="pnum">02</div><div>
    <h2>How it is trained</h2>
    <p>Joint angles cannot be written by hand for every situation. Instead the
      <b>reward</b> is written by hand: ${walk.terms.length} terms, each scoring
      one thing about the step just taken. They are added up.</p>
  </div></header>
  <div class="split">
    <div class="dwg">
      <div class="cap">R1 reward &middot; read from gray/tasks/</div>
      <div class="split" style="gap:22px">
        <table class="pts"><tbody>${earn.map(ptrow).join("")}</tbody></table>
        <table class="pts"><tbody>${lose.map(ptrow).join("")}</tbody></table>
      </div>
      <div class="foot"><span class="mono">ceiling ${walk.ceiling}</span> per step
        before penalties. ${earn.length} terms add, ${lose.length} subtract.</div>
    </div>
    <div class="prose">
      <p>${envs} robots run at once, each with its own random command and its own
        randomised world. The scores rank the attempts. The function is adjusted
        toward the higher-scoring ones. This repeats 3,000 times.</p>
      <p>All ${envs} robots feed one update to one function.</p>
      <div class="callout warn"><b>Training does not change the reward.</b>
        <p>The reward is an input. It changes when someone edits the file and at
          no other time. A behaviour not in the table will not appear. A
          behaviour that scores well by accident will.</p></div>
    </div>
  </div>
</section>

<section class="plate">
  <header><div class="pnum">03</div><div>
    <h2>Why there are three files</h2>
    <p>Two skills share a file if they share a reward function. Walking sideways
      is the same equation with a different setpoint, so it shares one. Getting
      up has no commanded velocity, so every tracking term is meaningless and it
      needs its own. That test applied to ${lib.total || 0} rows gives three.</p>
  </div></header>
  <div class="split">
    <div>
      <div class="files">
        ${(lib.runs || []).map(r => `<div class="file">
          <div class="id">${esc(r.id)}</div>
          <h4>${esc(r.name)}</h4>
          <p>${esc(r.rule)}</p>
          <span class="pill ${/progress/.test(r.state) ? "now" : ""}">${esc(r.state)}</span>
          <span class="pill">${r.count} rows</span>
        </div>`).join("")}
      </div>
      <div class="callout"><b>Runtime.</b>
        <p>Power on into <span class="mono">R2</span>. Once upright,
          <span class="mono">R1</span> takes over and you steer. On a fall,
          <span class="mono">R2</span> takes over again. A rule does the
          handover, not a third file.</p></div>
    </div>
    <div class="dwg">
      <div class="cap">the other kinds &middot; not files</div>
      <ul class="notfiles">
        ${(lib.kinds || []).filter(k => k.key !== "run").map(k => `<li>
          <span class="k">${esc(k.items.join(" "))}</span>
          <span><b>${esc(k.name)}</b> &mdash; ${k.count} rows</span></li>`).join("")}
      </ul>
      <div class="foot"><b style="color:var(--ink)">D1 is randomisation, not
        skills.</b> Ground friction, mass, centre of mass and servo stiffness
        change on every attempt during R1&rsquo;s training. The policy does not
        see the word gravel. It sees the same ${obs.total || 0} numbers in a
        different pattern.</div>
    </div>
  </div>
</section>

<section class="plate">
  <header><div class="pnum">04</div><div>
    <h2>The command range</h2>
    <p><b>${esc((s.box || {}).lede || "")}</b>
      The command is three numbers, each with a range. Every attempt draws a
      random point inside that range. After ${cmds} draws, points inside work,
      including ones never drawn exactly. Points outside do not.</p>
  </div></header>
  <div class="split">
    <div class="dwg">
      <div class="cap">R1 command range &middot; read from walk_env_cfg.py</div>
      ${axes.map(track).join("")}
      <div class="foot">Blue is the sampled range. Grey is zero.
        ${drive.cases && drive.cases.some(c => c.went_nowhere)
          ? `Red is a command that was given and produced
             <b style="color:var(--bad)">no movement</b>. It sits outside the
             range.` : ""}</div>
    </div>
    <div class="prose">
      ${((s.box || {}).paras || []).slice(1).map(p => `<p>${esc(p)}</p>`).join("")}
      ${drive.exists ? `<div class="callout warn"><b>Measured on run #${drive.number}.</b>
        <p>${drive.robots} robots, one command held throughout. 45&deg; diagonal
        asked, 26&deg; walked. Backward asked, 0.00 m in 8 seconds. Both are
        outside the range above.
        <a class="plain" href="/stage2#measured">Full table &rarr;</a></p></div>` : ""}
    </div>
  </div>
</section>

<section class="plate">
  <header><div class="pnum">05</div><div>
    <h2>Running on the real robot</h2>
    <p>The same file is copied onto the Pi. Nothing is converted, compiled or
      rewritten, and there is no inverse kinematics step. The
      ${obs.total || 0} inputs come from sensors instead of the simulator.</p>
  </div></header>
  <div class="dwg">
    <div class="cap">same file, both sides</div>
    <div class="mirror">
      <div>
        <h4 class="l">in simulation</h4>
        <ul class="io">
          <li><b>&rarr;</b> MuJoCo computes the physics</li>
          <li><b>&rarr;</b> perfect joint angles, perfect gravity</li>
          <li><b>&rarr;</b> ${envs} robots at once</li>
          <li><b>&larr;</b> twelve angles go to simulated joints</li>
        </ul>
      </div>
      <div>
        <h4 style="color:var(--ok)">on the real robot</h4>
        <ul class="io">
          <li><b>&rarr;</b> three IMUs on the trunk</li>
          <li><b>&rarr;</b> twelve potentiometers through an ADC</li>
          <li><b>&rarr;</b> one robot, one battery</li>
          <li><b>&larr;</b> twelve angles go to the PCA9685</li>
        </ul>
      </div>
      <div class="bridge">
        <span>unchanged</span>
        <b>the policy file</b>
      </div>
    </div>
    <div class="foot">The box spans both sides because it is the same file.</div>
  </div>
  <div class="callout warn"><b>The policy cannot detect the difference.</b>
    <p>If a simulated number was wrong &mdash; mass, joint limits, a sensor the
      real robot does not have &mdash; it fails on the floor, and nothing
      indicates which number. The previous attempt failed this way: the policy
      read joint angles the hardware could not measure.</p></div>
</section>

<section class="plate">
  <header><div class="pnum">06</div><div>
    <h2>Current status</h2>
    <p>Standing and taking a push pass their bars. Walking fails on two of six
      criteria: sideways drift and speed tracking.</p>
  </div></header>
  <div class="split">
    <div class="dwg">
      <div class="cap">R1 &middot; best of ${status.runs_total || 0} runs</div>
      ${r1 ? r1.criteria.map(barRow).join("") : `<p class="muted">Not measured yet.</p>`}
      <div class="foot">Green has passed. Bar length is the fraction of the way
        to passing, so drift at ${n(head.best, 0)} mm against a
        ${n(head.bar, 0)} mm bar reads near zero.</div>
    </div>
    <div class="prose">
      <p>Driven with a held command over 64 robots, the average obeys: left when
        told left, right when told right. The spread is the problem. Straight
        ahead ranges from &minus;7&deg; to +18&deg; for the identical command.</p>
      <p>At 5 m, a 4&deg; heading error is 350 mm. The bar is 100 mm.</p>
      <p>Next: reduce the spread, then R2, then the sensor batch
        (+${(s.batch || {}).added || 0} inputs, one retrain for all of them),
        then the real robot.</p>
      <div class="callout"><b>Stage 3 runs in parallel.</b>
        <p>It measures three numbers stage 1 is currently guessing. Running it
          now means one policy depends on those guesses instead of three.
          <a class="plain" href="/stage3">Stage 3 &rarr;</a></p></div>
    </div>
  </div>
</section>

<section class="plate">
  <header><div class="pnum">&rarr;</div><div>
    <h2>Pages</h2>
  </div></header>
  <div class="files">
    ${s.project.map(p => `<div class="file">
      <div class="id">stage ${p.n}</div>
      <h4>${esc(p.name)}</h4>
      <p>${esc(p.one_line)}</p>
      <span class="pill ${p.state === "in progress" ? "now" : p.state === "provisional" ? "" : "now"}">${esc(p.state)}</span>
      <div style="margin-top:12px"><a class="plain" href="${esc(p.page)}">Open &rarr;</a></div>
    </div>`).join("")}
    <div class="file">
      <div class="id">live</div>
      <h4>Training centre</h4>
      <p>Queue runs, watch curves, score a policy against its bar.</p>
      <span class="pill now">running</span>
      <div style="margin-top:12px"><a class="plain" href="/runs">Open &rarr;</a></div>
    </div>
  </div>
</section>
`;

}).catch(err => {
  document.getElementById("sheet").innerHTML =
    `<div style="padding:60px 0"><h2>Could not load</h2>
     <p class="muted">${esc(err)}</p></div>`;
});
</script>
</body>
</html>

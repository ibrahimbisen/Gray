<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gray — training</title>
<style>
  :root{
    --bg:#0d0f13; --panel:#14171d; --panel2:#191d24; --line:#242932; --ink:#e8eaef; --dim:#939bab;
    --ok:#4ade80; --bad:#f87171; --warn:#fbbf24; --accent:#60a5fa; --run:#38bdf8;
    --sidebar:280px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:inherit}
  h1,h2,h3{margin:0}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}

  /* ---------- layout ---------- */
  .app{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100vh}
  aside{border-right:1px solid var(--line);background:var(--panel);
        position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 16px}
  main{padding:28px 32px 96px;max-width:1180px}
  @media (max-width:900px){
    .app{grid-template-columns:1fr}
    aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  }

  /* ---------- sidebar ---------- */
  .brand{font-size:20px;font-weight:600;letter-spacing:-.01em;margin-bottom:2px}
  .brand small{display:block;font-size:12px;color:var(--dim);font-weight:400;letter-spacing:.04em;
               text-transform:uppercase;margin-top:3px}
  .side-h{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);
          margin:26px 0 10px;font-weight:600}
  .runcard{display:block;text-decoration:none;background:var(--panel2);border:1px solid var(--line);
           border-radius:9px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
  .runcard:hover{border-color:#39414f}
  .runcard.sel{border-color:var(--accent);background:#1b2330}
  .runcard .top{display:flex;align-items:center;gap:7px;margin-bottom:3px}
  .runcard .nm{font-weight:600;font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .runcard .pp{font-size:12px;color:var(--dim);line-height:1.4;
               display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .runcard .ft{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:6px}
  .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .dot.running{background:var(--run);box-shadow:0 0 0 3px rgba(56,189,248,.18)}
  .dot.done{background:var(--ok)} .dot.failed{background:var(--bad)}
  .dot.stopped{background:var(--dim)} .dot.unknown{background:var(--dim)}
  .empty{font-size:13px;color:var(--dim);border:1px dashed var(--line);border-radius:9px;padding:14px}

  /* ---------- header ---------- */
  .hdr{display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:8px}
  .hdr h1{font-size:30px;letter-spacing:-.02em}
  .pill{font-size:11px;text-transform:uppercase;letter-spacing:.09em;padding:3px 10px;
        border-radius:99px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
  .pill.running{color:var(--run);border-color:rgba(56,189,248,.45)}
  .pill.done{color:var(--ok);border-color:rgba(74,222,128,.45)}
  .pill.failed{color:var(--bad);border-color:rgba(248,113,113,.45)}
  .grow{flex:1}
  .btn{font-size:13px;text-decoration:none;color:var(--dim);border:1px solid var(--line);
       border-radius:8px;padding:7px 13px;white-space:nowrap;background:var(--panel)}
  .btn:hover{color:var(--ink);border-color:#39414f}

  .bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin:16px 0 6px}
  .bar i{display:block;height:100%;background:var(--run);transition:width .4s}
  .barlab{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}

  /* ---------- generic ---------- */
  section{margin-top:40px}
  h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);
         font-weight:600;margin-bottom:14px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
  .grid{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);
        border-radius:11px;overflow:hidden;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .cell{background:var(--panel);padding:13px 15px}
  .cell .k{font-size:12px;color:var(--dim)}
  .cell .v{font-size:22px;font-weight:600;margin-top:1px}
  .cell .v.small{font-size:16px}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;
     color:var(--dim);font-weight:600;padding:0 12px 9px;border-bottom:1px solid var(--line)}
  td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:0}
  tr.now td{background:rgba(56,189,248,.07)}
  tr.done td .st{color:var(--ok)} tr.now td .st{color:var(--run)}
  .num{width:34px;color:var(--dim)}
  .wrap-x{overflow-x:auto}
  .sub{font-size:13px;color:var(--dim);margin-top:3px}
  .chip{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);
        color:var(--dim);white-space:nowrap;display:inline-block;margin:2px 3px 0 0}
  .chip.pos{color:var(--ok);border-color:rgba(74,222,128,.35)}
  .chip.neg{color:var(--bad);border-color:rgba(248,113,113,.35)}

  /* ---------- videos ---------- */
  .films{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
  .film{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .film video{width:100%;display:block;background:#000;aspect-ratio:16/10;object-fit:contain}
  .film .cap{padding:8px 11px;font-size:12px;color:var(--dim);display:flex;justify-content:space-between}

  /* ---------- chart ---------- */
  svg.spark{width:100%;height:120px;display:block}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-top:8px}
  .legend b{font-weight:500}
</style>
</head>
<body>
<div class="app">

  <aside>
    <div class="brand">Gray<small>training monitor</small></div>
    <a class="btn" style="display:block;text-align:center;margin-top:14px" href="/summary">
      Project summary &rarr;
    </a>
    <div class="side-h">Runs</div>
    <div id="runlist"></div>
  </aside>

  <main>
    <div id="head"></div>
    <div id="body"></div>
  </main>

</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const n2 = v => (v === undefined || v === null || v === "") ? "—"
  : (Math.abs(v) >= 100 ? Math.round(v).toLocaleString() : (+v).toFixed(2));

let STATE = null, SELECTED = null;

/* ---------------- sidebar ---------------- */

function renderRuns(runs){
  if(!runs.length){
    $("#runlist").innerHTML =
      `<div class="empty">No runs yet.<br><br>The first one appears here the moment
       training writes <span class="mono">progress/runs/</span>.</div>`;
    return;
  }
  $("#runlist").innerHTML = runs.map(r => `
    <a class="runcard ${r.id === SELECTED ? "sel" : ""}" data-id="${esc(r.id)}">
      <div class="top">
        <span class="dot ${esc(r.status)}"></span>
        <span class="nm">${esc(r.name)}</span>
      </div>
      ${r.purpose ? `<div class="pp">${esc(r.purpose)}</div>` : ""}
      <div class="ft">
        <span>${r.stage !== null && r.stage !== undefined ? "Stage " + r.stage : esc(r.status)}</span>
        <span>${esc(r.started_age)}</span>
      </div>
    </a>`).join("");
  document.querySelectorAll(".runcard").forEach(el =>
    el.onclick = () => { SELECTED = el.dataset.id; draw(); });
}

/* ---------------- header ---------------- */

function renderHead(run, model){
  if(!run){
    $("#head").innerHTML = `
      <div class="hdr">
        <div>
          <h1>Nothing training yet</h1>
          <div class="sub">The model is ready. Below is what happens next.</div>
        </div>
        <div class="grow"></div>
        <span class="pill ${model.passed === model.total ? "done" : "failed"}">
          model ${model.passed}/${model.total}
        </span>
      </div>`;
    return;
  }
  const pct = Math.round(100 * (run.progress || 0));
  $("#head").innerHTML = `
    <div class="hdr">
      <div>
        <h1>${esc(run.name)}</h1>
        ${run.purpose ? `<div class="sub">${esc(run.purpose)}</div>` : ""}
      </div>
      <div class="grow"></div>
      <span class="pill ${esc(run.status)}">${esc(run.status)}</span>
      ${run.stage !== null ? `<span class="pill">stage ${run.stage}</span>` : ""}
      ${run.task ? `<span class="pill mono">${esc(run.task)}</span>` : ""}
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="barlab">
      <span class="mono">${run.iterations_done.toLocaleString()} /
        ${(run.iterations_target || 0).toLocaleString()} iterations</span>
      <span>${pct}%</span>
    </div>`;
}

/* ---------------- pieces ---------------- */

function metricGrid(run){
  const L = run.latest || {};
  const keys = (run.metric_columns || []).filter(k => k !== "iteration").slice(0, 6);
  if(!keys.length) return "";
  return `<section><h2 class="sec">Latest</h2><div class="grid">${
    keys.map(k => `<div class="cell"><div class="k">${esc(k.replace(/_/g," "))}</div>
      <div class="v mono">${n2(L[k])}</div></div>`).join("")
  }</div></section>`;
}

function chart(run){
  const rows = run.metrics || [];
  const keys = (run.metric_columns || []).filter(k => k !== "iteration").slice(0, 3);
  if(rows.length < 2 || !keys.length) return "";
  const W = 1000, H = 120, P = 6;
  const xs = rows.map(r => r.iteration ?? 0);
  const x0 = Math.min(...xs), x1 = Math.max(...xs) || 1;
  const cols = ["var(--run)", "var(--ok)", "var(--warn)"];
  const paths = keys.map((k, i) => {
    const ys = rows.map(r => +r[k] || 0);
    const lo = Math.min(...ys), hi = Math.max(...ys);
    const span = (hi - lo) || 1;
    const d = rows.map((r, j) => {
      const x = P + (W - 2*P) * ((xs[j] - x0) / ((x1 - x0) || 1));
      const y = H - P - (H - 2*P) * ((ys[j] - lo) / span);
      return `${j ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`;
    }).join("");
    return {d, c: cols[i % cols.length], k, lo, hi};
  });
  return `<section><h2 class="sec">Progress</h2><div class="panel">
    <svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      ${paths.map(p => `<path d="${p.d}" fill="none" stroke="${p.c}" stroke-width="2"
        vector-effect="non-scaling-stroke"/>`).join("")}
    </svg>
    <div class="legend">${paths.map(p =>
      `<span><b style="color:${p.c}">&#9632;</b> ${esc(p.k.replace(/_/g," "))}
       <span class="mono">${n2(p.lo)} &rarr; ${n2(p.hi)}</span></span>`).join("")}</div>
  </div></section>`;
}

function films(run){
  const v = run.videos || [];
  if(!v.length){
    return `<section><h2 class="sec">Checkpoints</h2>
      <div class="empty">No videos yet. One is filmed automatically every time
      training saves a checkpoint.</div></section>`;
  }
  return `<section><h2 class="sec">Checkpoints &mdash; ${v.length} filmed</h2>
    <div class="films">${v.map(f => `
      <div class="film">
        <video src="${esc(f.file)}" controls preload="metadata" muted loop playsinline></video>
        <div class="cap"><span class="mono">iteration ${f.iteration ?? "?"}</span></div>
      </div>`).join("")}</div></section>`;
}

function curriculum(stages, currentStage, rewards){
  const byKey = Object.fromEntries((rewards||[]).map(r => [r.key, r]));
  return `<section><h2 class="sec">What gets taught, in order</h2>
    <div class="panel wrap-x"><table>
      <tr><th class="num"></th><th>Stage</th><th>Scored on</th><th>Passes when</th><th></th></tr>
      ${stages.map(s => {
        const state = currentStage === null ? "" :
          (s.n < currentStage ? "done" : s.n === currentStage ? "now" : "");
        return `<tr class="${state}">
          <td class="num mono">${s.n}</td>
          <td><b>${esc(s.name)}</b><div class="sub">${esc(s.goal)}</div></td>
          <td>${(s.rewarded||[]).map(k => {
                const r = byKey[k];
                return `<span class="chip ${r && r.sign === "-" ? "neg" : "pos"}">${
                  r ? esc(r.sign + " " + r.name) : esc(k)}</span>`;
              }).join("") || '<span class="sub">—</span>'}</td>
          <td class="sub">${esc(s.bar)}</td>
          <td class="st sub">${state === "done" ? "done" : state === "now" ? "training" : ""}</td>
        </tr>`;
      }).join("")}
    </table></div>
    <div style="margin-top:10px"><a class="btn" href="/summary">
      Every scoring term, and why each one exists &rarr;</a></div>
  </section>`;
}

function phases(ph){
  const label = {done:"done", next:"next", later:"later", blocked:"needs the robot"};
  return `<section><h2 class="sec">The plan</h2>
    <div class="panel wrap-x"><table>
      <tr><th class="num"></th><th>Phase</th><th></th><th>State</th></tr>
      ${ph.map(p => `<tr class="${p.state === "next" ? "now" : p.state === "done" ? "done" : ""}">
        <td class="num mono">${p.n}</td>
        <td><b>${esc(p.name)}</b><div class="sub">${esc(p.one_line)}</div></td>
        <td class="sub">${esc(p.detail)}</td>
        <td class="st sub">${esc(label[p.state] || p.state)}</td>
      </tr>`).join("")}
    </table></div></section>`;
}

function nextUp(nx){
  return `<section><h2 class="sec">Next up &mdash; ${esc(nx.title)}</h2>
    <div class="panel">
      <div style="font-size:17px;margin-bottom:16px">${esc(nx.why)}</div>
      <table>
        <tr><th>Before it can start</th><th></th></tr>
        ${nx.before.map(b => `<tr><td><b>${esc(b.task)}</b></td>
          <td class="sub">${esc(b.note)}</td></tr>`).join("")}
      </table>
      <div class="sub" style="margin-top:18px;padding-top:14px;border-top:1px solid var(--line)">
        <b style="color:var(--ink)">Known and unresolved</b>
        ${nx.open.map(o => `<div style="margin-top:7px">${esc(o.q)}
          <span style="opacity:.75">${esc(o.note)}</span></div>`).join("")}
      </div>
    </div></section>`;
}

function modelPanel(m){
  const good = m.passed === m.total;
  return `<section><h2 class="sec">Model</h2><div class="grid">
    <div class="cell"><div class="k">checks</div>
      <div class="v mono" style="color:${good ? "var(--ok)" : "var(--bad)"}">${m.passed}/${m.total}</div></div>
    ${(m.checks||[]).filter(c => !c.passed).slice(0,3).map(c =>
      `<div class="cell"><div class="k">failing</div>
       <div class="v small">${esc(c.title)}</div></div>`).join("")}
  </div></section>`;
}

/* ---------------- draw ---------------- */

function draw(){
  const s = STATE;
  const runs = s.runs || [];
  if(SELECTED === null) SELECTED = (s.active && s.active.id) || null;
  const run = runs.find(r => r.id === SELECTED) || s.active || null;

  renderRuns(runs);
  renderHead(run, s.model);

  const stage = run && run.stage !== undefined ? run.stage : null;
  $("#body").innerHTML = [
    run ? metricGrid(run) : "",
    run ? chart(run) : "",
    run ? films(run) : "",
    phases(s.phases),
    nextUp(s.next_up),
    curriculum(s.stages, stage, s.rewards),
    modelPanel(s.model),
  ].join("");
}

function load(){
  fetch("/api/monitor").then(r => r.json()).then(s => { STATE = s; draw(); })
    .catch(e => { $("#head").innerHTML = `<h1>Could not load</h1><div class="sub">${esc(e)}</div>`; });
}
load();
// Cheap poll. The page is local and the payload is small; this is what makes it
// a monitor rather than a snapshot.
setInterval(load, 10000);
</script>
</body>
</html>

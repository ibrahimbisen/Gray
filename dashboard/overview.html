<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gray — overview</title>
<style>
  :root{
    --plane:#0d0f13; --surface:#16181d; --surface2:#1b1e25;
    --line:#252932; --grid:#1f232b;
    --ink:#f2f3f5; --ink2:#a8adb8; --muted:#787f8c;
    /* Status, not identity. Everything on this page encodes a STATE - met,
       failing, unknown, blocked - so it uses the reserved status colours and
       never the five categorical slots, which mean "which run" on the Runs
       page and must keep meaning only that. */
    --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --live:#3987e5;
    --accent:#3987e5;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--plane);color:var(--ink);
       font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:inherit;text-decoration:none}
  .tnum{font-variant-numeric:tabular-nums}
  main{padding:0 22px 90px;max-width:1680px;margin:0 auto}

  /* ---- top bar ---- */
  .nav{display:flex;align-items:center;gap:2px;padding:11px 22px;
       border-bottom:1px solid var(--line);background:var(--surface);
       position:sticky;top:0;z-index:20;flex-wrap:wrap;
       max-width:1680px;margin:0 auto}
  .nav .brand{font-weight:650;font-size:16px;letter-spacing:-.01em;margin-right:14px}
  .nav a{padding:5px 10px;border-radius:7px;font-size:12.5px;color:var(--ink2)}
  .nav a:hover{color:var(--ink);background:var(--surface2)}
  .nav a.on{color:var(--ink);background:var(--surface2);
            box-shadow:inset 0 -2px 0 var(--accent)}
  .nav .sp{flex:1}

  /* ---- instrument rail ---- */
  .rail{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);
        border-radius:11px;overflow:hidden;margin:18px 0 0;
        grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .gauge{background:var(--surface);padding:11px 14px 12px}
  .gauge .k{font-size:10px;text-transform:uppercase;letter-spacing:.1em;
            color:var(--muted);display:flex;align-items:center;gap:6px}
  .gauge .v{font-size:23px;font-weight:600;line-height:1.15;margin-top:5px;
            letter-spacing:-.02em}
  .gauge .d{font-size:11.5px;color:var(--muted);margin-top:2px}
  .lamp{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:var(--muted)}
  .lamp.on{background:var(--live);animation:pulse 1.8s ease-in-out infinite}
  .lamp.ok{background:var(--good)} .lamp.bad{background:var(--crit)}
  .lamp.warn{background:var(--warn)}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(57,135,229,.55)}
                   50%{box-shadow:0 0 0 5px rgba(57,135,229,0)}}

  /* ---- hero ---- */
  .hero{display:grid;gap:14px;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);
        margin-top:14px}
  @media (max-width:1000px){.hero{grid-template-columns:1fr}}
  .huge{font-size:44px;font-weight:650;letter-spacing:-.035em;line-height:1.05;
        margin:6px 0 4px}
  .huge.bad{color:var(--crit)} .huge.ok{color:var(--good)}
  .sub{color:var(--ink2);font-size:13.5px;max-width:70ch}

  section{margin-top:30px}
  .sech{display:flex;align-items:baseline;gap:11px;margin-bottom:11px}
  .sech h2{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.15em;
           color:var(--muted);font-weight:600}
  .sech .note{font-size:11.5px;color:var(--muted)}
  .grow{flex:1}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:11px;
        padding:13px 14px}
  .cols{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  .cols3{display:grid;gap:12px;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
  @media (max-width:1000px){.cols3{grid-template-columns:1fr}}
  h3{margin:0 0 9px;font-size:12.5px;font-weight:600}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.09em;
     color:var(--muted);font-weight:600;padding:0 9px 7px;
     border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:7px 9px;border-bottom:1px solid var(--grid);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  tr.click{cursor:pointer}
  tr.click:hover td{background:rgba(255,255,255,.035)}
  .wrapx{overflow-x:auto}
  .dim{color:var(--ink2)} .faint{color:var(--muted)}
  .small{font-size:11.5px}

  .chip{font-size:10.5px;padding:1.5px 7px;border-radius:99px;
        border:1px solid var(--line);color:var(--muted);display:inline-block;
        white-space:nowrap}
  .chip.ok{color:var(--good);border-color:rgba(12,163,12,.45)}
  .chip.bad{color:var(--crit);border-color:rgba(208,59,59,.45)}
  .chip.warn{color:var(--warn);border-color:rgba(250,178,25,.45)}
  .chip.live{color:var(--live);border-color:rgba(57,135,229,.5)}

  /* Distance to bar. Log scale, fixed 0.1x - 100x domain, so the bar tick sits
     at the same x in every row and rows are comparable at a glance. A linear
     "percent of bar" would put something at 4% of target near a full-looking
     bar's left edge, which is the lie this exists to avoid. */
  .track{position:relative;height:15px;min-width:132px}
  .track .ax{position:absolute;left:0;right:0;top:7px;height:1px;background:var(--line)}
  .track .tick{position:absolute;top:1px;width:1px;height:13px;background:var(--accent)}
  .track .dot{position:absolute;top:2.5px;width:10px;height:10px;border-radius:50%;
              margin-left:-5px}
  .track .dot.ok{background:var(--good)} .track .dot.bad{background:var(--crit)}
  .track .dot.drift{outline:1.5px dashed var(--warn);outline-offset:1.5px}
  .track .ghost{position:absolute;top:3.5px;width:8px;height:8px;border-radius:50%;
                margin-left:-4px;border:1.5px solid var(--muted)}
  .scalerow{display:flex;justify-content:space-between;font-size:9.5px;
            color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0}

  .spark{display:block;width:100%;height:38px}
  .prog{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
  .prog i{display:block;height:100%;background:var(--live)}
  .empty{font-size:12px;color:var(--muted);border:1px dashed var(--line);
         border-radius:9px;padding:13px}
  .kv{display:flex;gap:8px;font-size:11.5px;color:var(--muted);margin-top:3px}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
       color:var(--ink2);background:var(--surface2);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<div class="nav" id="nav"></div>
<main id="body"><div class="empty" style="margin-top:24px">Loading…</div></main>

<script>
const S = {};
const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const n2 = (v, dp) => (v === null || v === undefined || isNaN(v))
  ? "—" : (+v).toFixed(dp === undefined ? 1 : dp);

function value(v, unit){
  if(v === null || v === undefined) return "—";
  if(unit === "fraction") return (v * 100).toFixed(0) + "%";
  if(unit === "ratio")    return (+v).toFixed(4);
  if(unit === "mm")       return (+v).toFixed(1) + " mm";
  if(unit === "m")        return (+v).toFixed(2) + " m";
  if(unit === "m/s")      return (+v).toFixed(3) + " m/s";
  return String(v);
}
/* ratio is 1.0 at the bar and above 1.0 passing, in both directions.
   So a failing criterion is 1/ratio times over. */
const timesOver = c => (!c.ratio || c.ratio <= 0 || c.ratio >= 1) ? null : 1 / c.ratio;
const trackPos = r => (!r || r <= 0) ? null
  : Math.max(0, Math.min(100, ((Math.log10(r) + 1) / 3) * 100));

function track(c){
  const best = trackPos(c.ratio), latest = trackPos(c.latest_ratio);
  if(best === null) return `<span class="faint small">no scale</span>`;
  const at = latest === null ? best : latest;
  const ghost = (latest !== null && Math.abs(latest - best) > 1.5)
    ? `<span class="ghost" style="left:${best}%" title="best ever seen"></span>` : "";
  return `<div class="track"><div class="ax"></div>
    <div class="tick" style="left:33.3%"></div>${ghost}
    <span class="dot ${c.passes_current_bar ? "ok" : "bad"}${
      c.drifted_runs ? " drift" : ""}" style="left:${at}%"></span></div>`;
}

/* ---------------- top bar + rail ---------------- */

function nav(){
  const links = [["/","Overview"],["/runs","Runs"],["/summary","Summary"],
                 ["/stage1","1 · Prepare"],["/stage2","2 · Train"],
                 ["/stage3","3 · Deploy"],["/pose","Pose editor"]];
  const h = S.progress.headline;
  document.getElementById("nav").innerHTML =
    `<div class="brand">Gray</div>` +
    links.map(([href, label]) =>
      `<a href="${href}" class="${href === "/" ? "on" : ""}">${esc(label)}</a>`).join("") +
    `<div class="sp"></div>` +
    (h ? `<span class="chip bad">${esc(h.name)} ${n2(h.times_over)}× over bar</span>`
       : `<span class="chip">nothing measured yet</span>`);
  document.title = h
    ? `Gray — ${h.name} ${n2(h.times_over)}× over bar`
    : "Gray — overview";
}

function rail(){
  const q = S.queue, r = S.running, m = S.model, p = S.progress;
  const met = p.subsections.reduce((a, s) => a + s.met, 0);
  const fail = p.subsections.reduce((a, s) => a + s.failing, 0);
  const never = p.subsections.reduce((a, s) => a + s.never_measured, 0);
  const g = (k, v, d, lamp) => `<div class="gauge">
    <div class="k">${lamp ? `<span class="lamp ${lamp}"></span>` : ""}${esc(k)}</div>
    <div class="v">${v}</div><div class="d">${d}</div></div>`;
  return `<div class="rail">
    ${g("runner", q.runner.alive ? "up" : "DOWN",
        q.paused ? "queue paused" : "queue live",
        q.runner.alive ? (q.paused ? "warn" : "ok") : "bad")}
    ${g("training", r ? esc(r.variant) : "idle",
        r ? `${r.iterations_done.toLocaleString()} / ${(r.iterations_target||0).toLocaleString()} iter`
          : `${q.queued.length} queued`, r ? "on" : "")}
    ${g("queued", q.queued.length, q.queued.length ? esc(q.queued[0].name) + " next" : "nothing waiting")}
    ${g("criteria met", met, `${fail} failing · ${never} never measured`,
        fail ? "bad" : (met ? "ok" : "warn"))}
    ${g("runs", p.runs_total, `${p.runs_verified} verified · ${p.runs_passed} passed`)}
    ${g("model", `${m.passed}/${m.total}`, "checks, re-run live",
        m.passed === m.total ? "ok" : "bad")}
  </div>`;
}

/* ---------------- hero ---------------- */

function hero(){
  const p = S.progress, h = p.headline;
  const left = h
    ? `<div class="faint small">${esc(h.sub)} · ${esc(h.sub_name)} · worst criterion</div>
       <div class="huge bad">${n2(h.times_over)}× over</div>
       <div class="sub"><b>${esc(h.name)}</b> measured
         <b>${value(h.latest, h.unit)}</b> against a bar of
         <b>${value(h.bar, h.unit)}</b>, on
         <a href="/runs#run=${encodeURIComponent(h.latest_run)}"
            style="color:var(--live)">${esc(h.latest_label)}</a>.
         ${h.n > 1 ? `${h.n} runs have measured it.` : ""}</div>`
    : `<div class="faint small">Stage 2</div>
       <div class="huge">Nothing comparable yet</div>
       <div class="sub">Every existing verdict predates the structured format, so it
         can be read but not compared or charted. The next run to finish produces
         the first numbers this page can work with.</div>`;

  const done = p.subsections.filter(s => s.kind === "run");
  return `<div class="hero">
    <div class="card">${left}
      <div class="prog" style="margin-top:14px"><i style="width:${
        h ? Math.max(2, Math.min(100, 100 / (h.times_over || 1))) : 0}%"></i></div>
      <div class="kv"><span>the bar</span><div class="grow"></div>
        <span>${h ? n2(h.times_over) + "× away" : "unknown"}</span></div>
    </div>
    <div class="card">
      <h3>The three training runs</h3>
      <div class="wrapx"><table>
        <tr><th></th><th>Run</th><th>State</th><th class="n">met</th>
            <th class="n">failing</th><th class="n">unknown</th></tr>
        ${done.map(s => `<tr>
          <td><span class="chip">${esc(s.id)}</span></td>
          <td><b>${esc(s.name)}</b></td>
          <td class="dim small">${esc(s.state)}</td>
          <td class="n" style="color:var(--good)">${s.met || "—"}</td>
          <td class="n" style="color:${s.failing ? "var(--crit)" : "var(--muted)"}">${s.failing || "—"}</td>
          <td class="n faint">${s.never_measured || "—"}</td>
        </tr>`).join("")}
      </table></div>
      <div class="small faint" style="margin-top:10px">Three numbers, never one.
        A single percentage would let a criterion ${h ? n2(h.times_over, 0) + "×" : "many times"}
        over its bar disappear into an average.</div>
    </div>
  </div>`;
}

/* ---------------- bar board ---------------- */

function board(){
  const rows = [];
  for(const s of S.progress.subsections)
    for(const c of s.criteria) rows.push({...c, sub: s.id});
  if(!rows.length) return `<section><div class="sech"><h2>The bar board</h2></div>
    <div class="empty">No run has produced a structured verdict yet. Every
    criterion below fills in the moment one does.</div></section>`;
  rows.sort((a, b) => (a.ratio ?? 99) - (b.ratio ?? 99));
  const drift = rows.some(r => r.drifted_runs);
  return `<section>
    <div class="sech"><h2>The bar board</h2>
      <span class="note">every criterion measured, worst first · distance as a
        multiple of the bar, never a percentage</span></div>
    <div class="card wrapx"><table>
      <tr><th>Criterion</th><th>Task</th><th class="n">Measured</th><th class="n">Bar</th>
          <th class="n">Worst robot</th>
          <th style="min-width:150px">Distance
            <div class="scalerow"><span>0.1×</span>
              <span style="color:var(--accent)">bar</span><span>100×</span></div></th>
          <th>From</th><th></th></tr>
      ${rows.map(c => {
        const over = timesOver(c);
        return `<tr>
          <td><b>${esc(c.name)}</b>${c.n > 1
            ? `<div class="faint small">${c.n} measurements</div>` : ""}</td>
          <td class="faint small">${esc((c.task || "").replace("Gray-", ""))}</td>
          <td class="n">${value(c.latest, c.unit)}</td>
          <td class="n dim">${value(c.bar, c.unit)}</td>
          <td class="n faint">${value(c.worst_seen, c.unit)}</td>
          <td>${track(c)}</td>
          <td class="small"><a href="/runs#run=${encodeURIComponent(c.latest_run)}"
              style="color:var(--live)">${esc(c.latest_label)}</a></td>
          <td>${c.passes_current_bar ? `<span class="chip ok">met</span>`
              : `<span class="chip bad">${over ? n2(over) + "× over" : "failing"}</span>`}
              ${c.stale ? `<span class="chip warn">bar moved</span>` : ""}
              ${c.drifted_runs ? `<span class="chip warn">task drifted</span>` : ""}</td>
        </tr>`;}).join("")}
    </table>
    <div class="small faint" style="margin-top:11px"><b>These came from different
      policies.</b> Standing, being shoved and walking were each measured on a
      different policy file. R1's bar asks one policy to meet all of them, and no
      single policy has been measured against all of them yet.</div>
    ${drift ? `<div class="small" style="color:var(--warn);margin-top:6px">A dashed
      ring marks a run scored against a task that changed after it trained. Its
      numbers answer a different question.</div>` : ""}
    </div></section>`;
}

/* ---------------- gap closing ---------------- */

function trend(){
  const cs = [];
  for(const s of S.progress.subsections)
    for(const c of s.criteria) if(c.n >= 2) cs.push(c);
  if(!cs.length) return `<section><div class="sech"><h2>Is the gap closing</h2></div>
    <div class="empty">Needs two structured verdicts for the same criterion.
    ${S.progress.runs_structured} exist so far.</div></section>`;
  return `<section>
    <div class="sech"><h2>Is the gap closing</h2>
      <span class="note">one panel per criterion, in the order runs were verified ·
        the dashed line is the bar</span></div>
    <div class="cols">${cs.map(c => {
      const pts = c.history.filter(p => typeof p.value === "number");
      const rs = pts.map(p => {
        const r = c.better === "higher" ? p.value / p.bar : p.bar / p.value;
        return (isFinite(r) && r > 0) ? r : null;
      });
      const ok = rs.filter(r => r !== null);
      if(ok.length < 2) return "";
      const W = 320, H = 38, P = 5;
      const xs = pts.map((_, i) => P + (W - 2 * P) * (i / (pts.length - 1)));
      const lo = Math.log10(Math.min(...ok, 1) * 0.7);
      const hi = Math.log10(Math.max(...ok, 1) * 1.4);
      const y = r => P + (H - 2 * P) * (1 - (Math.log10(r) - lo) / ((hi - lo) || 1));
      const d = rs.map((r, i) => r === null ? null
        : `${i ? "L" : "M"}${xs[i].toFixed(1)},${y(r).toFixed(1)}`).filter(Boolean).join("");
      const over = timesOver(c);
      return `<div class="card">
        <h3>${esc(c.name)}<span class="grow"></span>
          <span class="chip ${c.passes_current_bar ? "ok" : "bad"}">${
            c.passes_current_bar ? "met" : n2(over) + "× over"}</span></h3>
        <svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
             aria-label="${esc(c.name)} against its bar across ${pts.length} runs">
          <line x1="0" x2="${W}" y1="${y(1).toFixed(1)}" y2="${y(1).toFixed(1)}"
                stroke="var(--accent)" stroke-width="1" stroke-dasharray="3 3"
                vector-effect="non-scaling-stroke"/>
          <path d="${d}" fill="none" stroke="var(--ink2)" stroke-width="2"
                stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
          ${rs.map((r, i) => r === null ? "" : `<circle cx="${xs[i].toFixed(1)}"
            cy="${y(r).toFixed(1)}" r="3.4" fill="${
            pts[i].passed ? "var(--good)" : "var(--crit)"}"/>`).join("")}
        </svg>
        <div class="wrapx"><table>
          <tr><th>Run</th><th class="n">Measured</th><th class="n">Bar</th><th></th></tr>
          ${pts.map(p => `<tr class="click" data-run="${esc(p.run)}">
            <td>${esc(p.label)}</td><td class="n">${value(p.value, c.unit)}</td>
            <td class="n faint">${value(p.bar, c.unit)}</td>
            <td>${p.passed ? `<span class="chip ok">met</span>`
                            : `<span class="chip bad">failing</span>`}</td></tr>`).join("")}
        </table></div>
      </div>`;}).join("")}</div>
    <div class="small faint" style="margin-top:10px">No trend line is fitted. With a
      handful of points whose spread is wider than the bar itself, a slope would be
      a claim the data cannot support.</div>
  </section>`;
}

/* ---------------- runs ---------------- */

function runsPanel(){
  const rs = S.runs.slice(0, 14);
  return `<section>
    <div class="sech"><h2>Runs</h2>
      <span class="note">click any row to open its curves, films and reward table</span>
      <div class="grow"></div><a href="/runs" class="chip live">all ${S.runs.length} →</a></div>
    <div class="card wrapx"><table>
      <tr><th class="n">#</th><th>Run</th><th>Task</th><th>Status</th><th>Verdict</th>
          <th class="n">Iterations</th><th class="n">Reward</th>
          <th class="n">Films</th><th>Took</th><th>Started</th></tr>
      ${rs.map(r => `<tr class="click" data-run="${esc(r.id)}">
        <td><b>${esc(r.variant)}</b></td>
        <td class="faint small">${esc((r.task || "").replace("Gray-", ""))}</td>
        <td>${r.status === "running"
              ? `<span class="chip live">training</span>`
              : `<span class="chip ${/finish|target/.test(r.status) ? "ok"
                  : /fail/.test(r.status) ? "bad" : "warn"}">${esc(r.status)}</span>`}</td>
        <td>${r.verdict ? `<span class="chip ${r.verdict === "passed" ? "ok" : "bad"}">${
              esc(r.verdict)}</span>${r.verdict_structured ? "" :
              `<span class="chip" title="prose only - cannot be compared">text</span>`}`
            : `<span class="faint small">—</span>`}</td>
        <td class="n">${(r.iterations_done || 0).toLocaleString()}${
          r.iterations_target ? `<span class="faint"> / ${r.iterations_target.toLocaleString()}</span>` : ""}</td>
        <td class="n">${n2(r.reward)}</td>
        <td class="n faint">${r.videos || 0}</td>
        <td class="faint small">${esc(r.duration || "")}</td>
        <td class="faint small">${esc(r.started_age || "")}</td>
      </tr>`).join("")}
    </table>
    <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--grid)">
      <div class="small"><b>Every run above started from a random, untrained
        robot.</b> None of them continued from another. <code>walk_g</code> did not
        begin where <code>walk_a</code> ended.</div>
      <div class="faint small" style="margin-top:6px">That is deliberate while the
        reward is still being debugged: if a run inherited 3000 iterations of prior
        training AND a changed number, there would be no way to tell which produced
        the improvement. From scratch is the only clean comparison.</div>
      <div class="faint small" style="margin-top:6px"><b style="color:var(--warn)">To
        add later - stacking.</b> Once the reward function is settled and the goal
        is simply a better walker rather than a better answer, runs should warm-start
        from the last good policy instead of from noise. Same reward, more training,
        far less wall-clock per attempt. Not yet: it would hide which change did
        what, and the numbers are still moving.</div>
    </div></div></section>`;
}

/* ---------------- what each stage trains for ---------------- */

const COVER = {
  command:   ["set a command", "var(--good)"],
  condition: ["a dial in the scene", "var(--live)"],
  emerges:   ["falls out of the reward", "var(--good)"],
  pilot:     ["the pilot does it", "#a78bfa"],
  measured:  ["measured, not trained", "var(--muted)"],
  blocked:   ["not by reward alone", "var(--crit)"],
};

function stages(){
  const subs = S.progress.subsections;
  return `<section>
    <div class="sech"><h2>What each stage trains for</h2>
      <span class="note">the skill rows are the checklist · the reward terms are
        what is actually written and tuned</span></div>
    <div class="cols">${subs.map(s => {
      const cov = s.coverage || {};
      const total = Object.values(cov).reduce((a,b) => a+b, 0) || 1;
      const tw = s.trains_with || {};
      const bars = Object.entries(cov)
        .sort((a,b) => b[1]-a[1])
        .map(([k,v]) => `<div style="display:flex;align-items:center;gap:7px;padding:2px 0">
            <span style="width:9px;height:9px;border-radius:2px;flex:0 0 auto;
              background:${(COVER[k]||["",""])[1]}"></span>
            <span class="small" style="flex:1">${esc((COVER[k]||[k])[0])}</span>
            <b class="small tnum">${v}</b>
          </div>`).join("");
      const stack = Object.entries(cov).sort((a,b) => b[1]-a[1]).map(([k,v]) =>
        `<span style="display:block;height:100%;float:left;width:${100*v/total}%;
           background:${(COVER[k]||["",""])[1]}"></span>`).join("");
      return `<div class="card">
        <h3><span class="chip">${esc(s.id)}</span>&nbsp;${esc(s.name)}
          <span class="grow"></span>
          <span class="chip ${s.kind === "run" ? "live" : ""}">${esc(s.kind)}</span></h3>
        <div class="faint small" style="margin-bottom:9px">${esc(s.what || s.rule)}</div>

        <div class="faint small">${s.skill_count} skill rows, by how they are covered</div>
        <div style="height:7px;border-radius:99px;overflow:hidden;background:var(--line);
             margin:5px 0 7px">${stack}</div>
        ${bars}

        ${tw.exists ? `<div style="margin-top:11px;padding-top:9px;
            border-top:1px solid var(--grid)">
            <div class="faint small">actually written and tuned</div>
            <div style="font-size:19px;font-weight:600;margin-top:3px">
              ${tw.terms.length} reward terms</div>
            <div class="faint small">${tw.paid} paid for · ${tw.fined} fined ·
              ${tw.commands.length} command sliders</div>
            <div class="small" style="margin-top:6px">${tw.commands.map(c =>
              `<code>${esc(c.name)} ${c.range[0]} to ${c.range[1]} ${esc(c.unit)}</code>`
              ).join(" ")}</div>
          </div>`
          : `<div style="margin-top:11px;padding-top:9px;border-top:1px solid var(--grid)"
                class="faint small">${esc(tw.note || "")}</div>`}

        ${s.verifiable ? `<div style="margin-top:9px" class="small">
            <span style="color:var(--good)">${s.met} met</span> ·
            <span style="color:${s.failing ? "var(--crit)" : "var(--muted)"}">${s.failing} failing</span> ·
            <span class="faint">${s.never_measured} never measured</span></div>`
          : `<div style="margin-top:9px" class="faint small">no verifier - progress
             cannot be measured for this</div>`}
      </div>`;}).join("")}</div>

    ${blockedPanel()}
  </section>`;
}

function blockedPanel(){
  // Grouped by the capability each row waits on, not listed flat. Fifty-odd
  // blocked rows reads as fifty problems; five missing capabilities reads as
  // five decisions - and that is what it actually is.
  const need = new Map();
  const rows = [];
  for(const s of S.progress.subsections){
    for(const g of (s.blocked_needs || [])){
      const e = need.get(g.key) || {...g, count: 0, subs: new Set()};
      e.count += g.count; e.subs.add(s.id); need.set(g.key, e);
    }
    for(const b of (s.blocked_skills || []))
      rows.push({sub: s.id, n: b.n, name: b.name, needs: b.needs,
                 why: b.coverage_why || ""});
  }
  if(!rows.length) return "";
  const groups = [...need.values()].sort((a,b) => b.count - a.count);
  const label = Object.fromEntries(groups.map(g => [g.key, g.label]));
  rows.sort((a,b) => a.n - b.n);
  return `<div class="card" style="margin-top:12px">
    <h3>Rows no reward can reach<span class="grow"></span>
      <span class="chip bad">${rows.length}</span></h3>
    <div class="faint small" style="margin-bottom:9px">No weight in the current
      reward reaches these. Not impossible &mdash; they need a new INPUT, a new
      COMMAND, or their own run, and <a class="plain" href="/stage2#blocked">stage 2
      section 5</a> says which for every row. Listed so none is quietly counted as
      work in progress.</div>
    <div class="wrapx"><table>
      <tr><th>Missing</th><th class="n">Rows</th><th>Where</th><th>Why nothing reaches them</th></tr>
      ${groups.map(g => `<tr><td><b>${esc(g.label)}</b></td>
        <td class="n"><b>${g.count}</b></td>
        <td class="faint small">${[...g.subs].join(" ")}</td>
        <td class="faint small">${esc(g.why)}</td></tr>`).join("")}
    </table></div>
    <div class="wrapx" style="margin-top:12px"><table>
      <tr><th></th><th class="n">#</th><th>Skill</th><th>Waiting on</th><th>Note</th></tr>
      ${rows.map(r => `<tr><td><span class="chip">${esc(r.sub)}</span></td>
        <td class="n faint">${r.n}</td><td>${esc(r.name)}</td>
        <td class="faint small">${esc(label[r.needs] || r.needs || "—")}</td>
        <td class="faint small">${esc(r.why)}</td></tr>`).join("")}
    </table></div></div>`;
}

/* ---------------- what is left ---------------- */

function left(){
  const order = {run:0, axis:1, constraint:2, test:3, parked:4};
  const subs = [...S.progress.subsections].sort((a,b) => order[a.kind]-order[b.kind]);
  return `<section>
    <div class="sech"><h2>What is left</h2>
      <span class="note">the unit of work is a training run, and there are three ·
        counts per kind are never summed</span></div>
    <div class="cols3">
      <div class="card wrapx"><table>
        <tr><th></th><th>Item</th><th>Kind</th><th>State</th><th>Blocked by</th></tr>
        ${subs.map(s => `<tr>
          <td><span class="chip">${esc(s.id)}</span></td>
          <td><b>${esc(s.name)}</b>
            <div class="faint small">${esc(s.rule)}</div>
            ${s.trigger ? `<div class="small" style="color:var(--warn)">un-parks when:
              ${esc(s.trigger)}</div>` : ""}</td>
          <td class="faint small">${esc(s.kind)}</td>
          <td class="dim small">${esc(s.state)}</td>
          <td class="small ${/nothing/.test(S.blockers[s.key]||"") ? "" : "faint"}"
              style="${/nothing/.test(S.blockers[s.key]||"") ? "color:var(--good)" : ""}">${
            esc(S.blockers[s.key] || "")}</td>
        </tr>`).join("")}
      </table></div>
      <div>
        <div class="card">
          <h3>Startable today</h3>
          ${S.startable.map(x => `<div style="padding:7px 0;border-bottom:1px solid var(--grid)">
            <b class="small">${esc(x.what)}</b>
            <div class="faint small">${esc(x.why)}</div></div>`).join("")}
        </div>
        <div class="card" style="margin-top:12px">
          <h3>Stage 3 measures what stage 1 guesses</h3>
          ${S.loop.edges.map(e => `<div style="padding:6px 0;border-bottom:1px solid var(--grid)">
            <span class="chip">${esc(e.from)}</span>
            <b class="small"> ${esc(e.what)}</b></div>`).join("")}
          <div class="faint small" style="margin-top:9px">${esc(S.loop.cost)}</div>
        </div>
      </div>
    </div></section>`;
}

/* ---------------- not known ---------------- */

function unknown(){
  const b = S.progress.blind_spots || [];
  return `<section>
    <div class="sech"><h2>Blind spots</h2>
      <span class="note">what cannot be answered right now, and the one thing that
        would fix each</span></div>
    <div class="cols">${b.map(x => `<div class="card">
      <h3 style="color:var(--warn)">${esc(x.what)}</h3>
      <div class="small" style="margin-bottom:7px">${esc(x.detail)}</div>
      <div class="faint small" style="margin-bottom:9px">${esc(x.why)}</div>
      <div style="border-top:1px solid var(--grid);padding-top:8px">
        <div class="faint small">what fixes it</div>
        <div class="small" style="color:var(--good)">${esc(x.fix)}</div>
      </div>
    </div>`).join("")}</div>
    <div class="faint small" style="margin-top:10px">Grouped by remedy, not listed
      one per gap. Listed individually this was twenty-six rows, eight of which
      said the same thing and twelve of which claimed criteria were never measured
      when three runs had measured them - just not in a comparable format.</div>
  </section>`;
}

/* ---------------- draw ---------------- */

function draw(){
  nav();
  document.getElementById("body").innerHTML =
    rail() + hero() + board() + trend() + stages() + runsPanel() + left() + unknown();
  document.querySelectorAll("[data-run]").forEach(el =>
    el.onclick = () => { location.href = "/runs#run=" + encodeURIComponent(el.dataset.run); });
}

function load(){
  fetch("/api/overview").then(r => r.json()).then(s => {
    Object.assign(S, s);
    draw();
  }).catch(e => {
    document.getElementById("body").innerHTML =
      `<div class="empty" style="margin-top:24px">Could not load: ${esc(e)}</div>`;
  });
}
load();
setInterval(load, 15000);   // nothing here changes faster than a run finishing
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gray &mdash; the plan</title>
<link rel="stylesheet" href="/page.css">
<style>
/* The plan is a sequence of gates, so it is drawn as one: a rail down the left
   with a marker per phase and the current one lit. Uses page.css's tokens -
   same dashboard, not a separate thing. */
.phase{ display:grid; grid-template-columns:44px 1fr; gap:0 18px; }
.phase .rail{ position:relative; display:flex; flex-direction:column;
  align-items:center; }
.phase .dot{ width:30px; height:30px; border-radius:9px; border:1px solid var(--line);
  display:grid; place-items:center; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:13px; font-weight:700; color:var(--faint); background:var(--panel);
  flex:0 0 auto; }
.phase .line{ flex:1; width:1px; background:var(--line); margin:6px 0; min-height:18px; }
.phase:last-child .line{ display:none; }
.phase.now .dot{ border-color:var(--accent); color:var(--accent);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 12%,transparent); }
.phase.doing .dot{ border-color:var(--warn); color:var(--warn); }
.phase .body{ padding-bottom:26px; min-width:0; }
.phase h3{ margin:4px 0 4px; font-size:19px; letter-spacing:-.02em; }
.phase .what{ color:var(--dim); font-size:14px; line-height:1.6; margin:0 0 12px;
  max-width:70ch; }
.gate{ border:1px solid var(--line); border-left:3px solid var(--ok);
  border-radius:9px; padding:11px 14px; margin-bottom:12px; background:var(--panel); }
.gate .lbl{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px;
  letter-spacing:.13em; text-transform:uppercase; color:var(--faint); }
.gate p{ margin:3px 0 0; font-size:14px; }
.steps{ list-style:none; margin:0 0 12px; padding:0; }
.steps li{ display:grid; grid-template-columns:16px 1fr; gap:10px; padding:4px 0;
  font-size:13.5px; color:var(--dim); }
.steps li::before{ content:""; width:6px; height:6px; border-radius:50%;
  background:var(--line); margin-top:8px; margin-left:5px; }
.steps li.done{ color:var(--faint); }
.steps li.done::before{ background:var(--ok); }
.pmeta{ display:flex; flex-wrap:wrap; gap:8px 18px; font-size:12.5px;
  color:var(--faint); margin-bottom:10px; }
.pmeta b{ color:var(--dim); font-weight:600; }
.blocked{ border-left:2px solid var(--warn); padding:3px 0 3px 12px;
  font-size:13px; color:var(--dim); margin-bottom:10px; }
.loopband{ border:1px dashed var(--accent); border-radius:12px; padding:16px 20px;
  margin-top:8px; }
.loopband b{ display:block; margin-bottom:5px; }
.loopband p{ margin:0; color:var(--dim); font-size:14px; line-height:1.6; }
.jobs{ width:100%; border-collapse:collapse; font-size:12.5px; }
.jobs th{ text-align:left; font-size:10px; text-transform:uppercase;
  letter-spacing:.1em; color:var(--faint); padding:0 10px 7px 0;
  border-bottom:1px solid var(--line); font-weight:600; }
.jobs td{ padding:7px 10px 7px 0; border-bottom:1px solid var(--line);
  vertical-align:top; }
.jobs tr:last-child td{ border-bottom:0; }
.jobs .nm, .jobs .cmd{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
.jobs .cmd{ font-size:11px; color:var(--faint); word-break:break-all; }
.st{ font-size:10px; text-transform:uppercase; letter-spacing:.09em; padding:2px 8px;
  border-radius:99px; border:1px solid var(--line); color:var(--dim);
  white-space:nowrap; display:inline-block; }
.st.running{ color:var(--accent); border-color:color-mix(in srgb,var(--accent) 45%,transparent); }
.st.done{ color:var(--ok); border-color:color-mix(in srgb,var(--ok) 40%,transparent); }
.st.failed,.st.cancelled{ color:var(--bad);
  border-color:color-mix(in srgb,var(--bad) 40%,transparent); }
.st.notqueued{ color:var(--faint); border-style:dashed; }
.banner{ border:1px solid var(--line); border-left-width:3px; border-radius:10px;
  padding:14px 18px; margin-bottom:20px; background:var(--panel); }
.banner.go{ border-left-color:var(--ok); }
.banner.stop{ border-left-color:var(--bad); }
.banner b{ display:block; margin-bottom:3px; }
.banner p{ margin:0; color:var(--dim); font-size:13.5px; }
</style>
</head>
<body>
<div class="top" id="top"></div>
<div class="shell">
  <div class="side"></div>
  <div class="main"></div>
</div>

<script src="/page.js"></script>
<script>
document.getElementById("top").innerHTML = topbar("/plan", "The plan");

fetch("/api/week").then(r => r.json()).then(s => {

const F = s.forward, W = s.week;
const STATE = { "now": "now", "should be running": "doing" };

const phaseBlock = (p) => `
  <div class="phase ${STATE[p.state] || ""}">
    <div class="rail"><div class="dot">${esc(p.id)}</div><div class="line"></div></div>
    <div class="body">
      <h3>${esc(p.name)}
        <span class="chip ${p.state === "now" ? "now"
          : p.state === "should be running" ? "warn" : ""}"
          style="vertical-align:3px;margin-left:6px">${esc(p.state)}</span></h3>
      <p class="what">${esc(p.what)}</p>
      <div class="gate">
        <div class="lbl">Over when</div>
        <p>${esc(p.gate)}</p>
      </div>
      <ul class="steps">
        ${p.steps.map(x => `<li class="${/- done/.test(x) ? "done" : ""}">${esc(x)}</li>`).join("")}
      </ul>
      <div class="pmeta"><span><b>Cost:</b> ${esc(p.cost)}</span></div>
      ${p.blocked_by ? `<div class="blocked"><b>Waits on:</b> ${esc(p.blocked_by)}</div>` : ""}
      ${p.note ? `<p class="why small" style="max-width:70ch;margin:0">${esc(p.note)}</p>` : ""}
    </div>
  </div>`;

const jobRow = (j) => `<tr>
  <td class="nm">${j.number ? `<a class="plain" href="/runs#${esc(j.run_id)}">#${j.number}</a> ` : ""}${esc(j.name)}</td>
  <td><span class="st ${esc(j.status || "notqueued")}">${esc(j.status || "not queued")}</span></td>
  <td class="dim">${j.seed ? `seed ${j.seed}` : ""}</td>
  <td class="dim">${j.verdict ? esc(j.verdict)
    : j.iterations_done ? `${j.iterations_done.toLocaleString()} iterations` : "&mdash;"}</td>
  <td class="cmd">${esc((j.command || "").replace("python scripts/train.py Gray-Walk ", ""))}</td>
</tr>`;

shell([

  { id: "phases", label: "The plan", count: F.phases.length, html: () => `
    <div class="eyebrow">Gray</div>
    <h1>${esc(F.one_line)}</h1>
    <p class="lede">${esc(F.lede)}</p>
    <div class="cols" style="margin-bottom:26px">
      ${F.shape.map(p => `<div class="card"><p class="why small">${esc(p)}</p></div>`).join("")}
    </div>
    ${F.phases.map(phaseBlock).join("")}
    <div class="loopband"><b>And then it starts again.</b>
      <p>${esc(F.loop)}</p></div>` },

  { id: "now", label: "What is running", count: W.rounds.reduce((a, r) => a + r.runs, 0),
    html: () => `
    <div class="eyebrow">Phase A</div>
    <h1>What is running now</h1>
    <p class="lede">${esc(W.lede)}</p>
    ${!s.runner_up ? `<div class="banner stop"><b>The runner is not running.</b>
      <p>Nothing will start, however much is queued. Start it in a second
        terminal: <code>run.bat --runner</code></p></div>`
      : s.paused ? `<div class="banner stop"><b>The queue is paused.</b>
      <p>The runner is up but will not claim anything until it is unpaused.</p></div>`
      : `<div class="banner go"><b>Running.</b>
      <p>${s.running ? `${esc(s.running.variant || s.running.name)} &mdash;
          ${(s.running.iterations_done || 0).toLocaleString()} of
          ${(s.running.iterations_target || 0).toLocaleString()} iterations.`
        : "Nothing in flight."}
        ${s.queued_total} job${s.queued_total === 1 ? "" : "s"} waiting.</p></div>`}
    ${facts(W.at_a_glance)}
    <div class="cols" style="margin-bottom:22px">
      <div class="card">
        <h3>Why a matrix and not one long run</h3>
        ${W.why.map(p => `<p class="why small">${esc(p)}</p>`).join("")}
      </div>
      <div class="card">
        <h3>Rules while it runs</h3>
        ${W.rules.map(p => `<div class="risk small">${esc(p)}</div>`).join("")}
      </div>
    </div>
    ${W.rounds.map(r => `<div class="card" style="margin-bottom:14px">
      <h3><span class="chip">${esc(r.id)}</span> &nbsp;${esc(r.name)}</h3>
      <p class="why small"><b>Asks:</b> ${esc(r.asks)}<br>
        <b>Design:</b> ${esc(r.design)}<br>
        <b>Reads:</b> ${esc(r.reads)}</p>
      ${r.jobs.length ? `<div class="tw"><table class="jobs">
        <tr><th>Run</th><th>State</th><th>Seed</th><th>Result</th><th>What varies</th></tr>
        ${r.jobs.map(jobRow).join("")}
      </table></div>`
      : `<div class="note small"><b>${r.runs} runs, ~${r.hours} h &mdash; not queued yet.</b>
          ${r.id === "R3" ? " Designed from the rounds above it."
            : " Run <code>run.bat scripts/queue_week.py</code> to add it."}</div>`}
    </div>`).join("")}` },

  { id: "bars", label: "What it has to beat", html: () => {
    const r1 = (s.status.tasks || []).find(t => t.id === "R1");
    return `
    <div class="eyebrow">Phase A</div>
    <h1>What it has to beat</h1>
    <p class="lede">R1&rsquo;s bar, and the best any run has managed. Two of six
      are failing, and every run is scored on all six.</p>
    <div class="card"><div class="tw"><table>
      <tr><th>Criterion</th><th class="n">Bar</th><th class="n">Best so far</th>
          <th>State</th></tr>
      ${r1 ? r1.criteria.map(c => {
        const better = c.better === "lower";
        const met = c.best == null ? null : better ? c.best <= c.bar : c.best >= c.bar;
        const dp = c.bar < 1 ? 2 : 1;
        return `<tr>
          <td><b>${esc(c.name)}</b></td>
          <td class="n dim">${better ? "&le;" : "&ge;"} ${c.bar.toFixed(dp)} ${esc(c.unit || "")}</td>
          <td class="n" style="color:${met ? "var(--ok)" : "var(--bad)"}">
            ${c.best == null ? "&mdash;" : c.best.toFixed(dp)}</td>
          <td>${met === null ? `<span class="chip">not measured</span>`
              : met ? `<span class="chip ok">passing</span>`
              : `<span class="chip warn">${(better ? c.best / c.bar : c.bar / c.best).toFixed(1)}&times; off</span>`}
          </td></tr>`;
      }).join("") : `<tr><td colspan="4" class="dim">Not measured yet.</td></tr>`}
    </table></div></div>` } },

  { id: "notdoing", label: "Deferred and parked",
    count: W.not_doing.length + F.parked.length, html: () => `
    <div class="eyebrow">Gray</div>
    <h1>Deferred and parked</h1>
    <p class="lede">Decided against on purpose, with the reason, so none of it
      looks forgotten later.</p>
    <h3 style="margin-top:20px">Deferred &mdash; not now, but on the plan</h3>
    <div class="cols tight">
      ${W.not_doing.map(x => `<div class="card">
        <h3>${esc(x.what)}</h3>
        <p class="why small">${esc(x.why)}</p></div>`).join("")}
    </div>
    <h3 style="margin-top:26px">Parked &mdash; each one names its trigger</h3>
    <div class="cols tight">
      ${F.parked.map(x => `<div class="card">
        <h3>${esc(x.what)}</h3>
        <p class="why small">${esc(x.why)}</p></div>`).join("")}
    </div>` },

]);

}).catch(fail);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gray &mdash; plan</title>
<link rel="stylesheet" href="/page.css">
<style>
/* The plan is a sequence of gates, so it is drawn as one: a rail down the left
   with a marker per step and the current one lit. Only the rail and the gate
   card live here - everything else on this page is a page.css component. */
.step { display:grid; grid-template-columns:40px 1fr; gap:0 16px; }
.step .rail { position:relative; display:flex; flex-direction:column; align-items:center; }
.step .pip { width:28px; height:28px; border-radius:9px; border:1px solid var(--line);
  display:grid; place-items:center; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:13px; font-weight:700; color:var(--muted); background:var(--surface);
  flex:0 0 auto; }
.step .line { flex:1; width:1px; background:var(--line); margin:6px 0; min-height:18px; }
.step:last-child .line { display:none; }
.step.now .pip { border-color:var(--s1); color:var(--s1);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--s1) 12%,transparent); }
.step .body { padding-bottom:26px; min-width:0; }
.step h3 { margin:3px 0 6px; font-size:17px; letter-spacing:-.02em; }

/* The gate is the whole point of a step, so it gets a border of its own rather
   than being one more line of prose. Green edge = a number you can pass. */
/* The goal is what the step is FOR; `produces` is what it leaves behind once
   its runs are finished and its policy has been thrown away. Those artifacts -
   the observation list, the weights, the bars, the noise floor - are what the
   next step is built on, and they were only ever recoverable by reading this
   file. The gate says when a step is done; these say what it was worth. */
.goal { margin:0 0 8px; font-size:13px; max-width:72ch; }
/* The link to what a finished step produced. Deliberately a block rather than a
   pill in the toolbar: it is the whole output of a step, it only exists for
   steps that are DONE, and it belongs beside that step rather than in a global
   nav where it would sit there being wrong for every step that has not closed
   yet. Sized so it reads as a destination, not a footnote. */
.carry { display:flex; align-items:center; gap:14px; text-decoration:none;
  border:1px solid var(--line); border-left:3px solid var(--good);
  border-radius:9px; padding:11px 14px; margin:0 0 10px; max-width:72ch;
  background:var(--surface); color:var(--ink); transition:border-color .12s; }
.carry:hover { border-color:var(--good); }
.carry b { font-size:14px; font-weight:650; white-space:nowrap; }
.carry span { font-size:11.5px; color:var(--ink2); line-height:1.4; }
.carry i { margin-left:auto; font-style:normal; font-size:17px; color:var(--good); }
@media (max-width:620px){ .carry { flex-wrap:wrap; gap:4px; } .carry i { display:none; } }
/* Two lines per numbered item: what it is FOR, and what it leaves behind. The
   gate says when a step is finished; these say what it was worth. Kept to one
   sentence each on purpose - a paragraph here is a paragraph nobody reads. */
.io { display:block; margin:3px 0 0; max-width:66ch; }
.io span { display:block; font-size:12px; color:var(--muted); }
.io b { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px;
  letter-spacing:.06em; text-transform:uppercase; color:var(--s1);
  margin-right:5px; }
.gate { border:1px solid var(--line); border-left:3px solid var(--good);
  border-radius:9px; padding:10px 13px; margin:0 0 12px; background:var(--surface); }
.gate.none { border-left-color:var(--muted); }
.gate .lbl { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px;
  letter-spacing:.13em; text-transform:uppercase; color:var(--muted); }
.gate p { margin:3px 0 0; font-size:13px; }

/* Substep list. A done item gets a filled marker; the one the project is on gets
   a ring, so "where are we" is answerable without reading a word. */
.items { list-style:none; margin:0 0 10px; padding:0; }
.items li { display:grid; grid-template-columns:14px 1fr; gap:10px; padding:3px 0;
  font-size:12.5px; color:var(--ink2); }
.items li::before { content:""; width:6px; height:6px; border-radius:50%;
  background:var(--line); margin-top:7px; margin-left:4px; }
.items li.done { color:var(--muted); }
.items li.done::before { background:var(--good); }
.items li.now { color:var(--ink); }
.items li.now::before { background:var(--s1);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--s1) 25%,transparent); }
.items .tag { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--muted);
  margin-right:6px; }
</style>
</head>
<body>
<div id="nav"></div>
<div class="app">
  <aside class="side"></aside>
  <main></main>
</div>

<script src="/page.js"></script>
<script>
get("/api/week").then(s => {
mountNav("/plan", navState(s.nav));

const F = s.forward, W = s.week, SH = s.shelved || null;
const HERE = F.here || "";

/* An item is done, current, or ahead. `state` comes from plan.py; `here` is the
   one substep the project is actually on. */
const itemClass = (it) =>
  it.state === "done" ? "done" : (it.id === HERE || it.state === "now") ? "now" : "";

/* A finished substep folds away. The page is nine substeps long and eight of
   them are history - 1.1 and 1.2 together are most of its height, and every one
   of their items reads "done". Scrolling past them to reach the one substep the
   project is actually on is the page failing at its own job.
   OPEN IS DECIDED BY `here`, not by a state field, so the fold can never
   disagree with the "where we are" chip beside it. */
/* The batch plan for a substep: what each batch changes, how many runs it is,
   what it asks, and WHERE YOU HAVE TO STOP AND DECIDE. The stop rows are the
   point of the table. A plan that lists only the work reads as if it runs
   itself, and this one does not - it has nine places where somebody has to look
   at a number and choose. Batches with no stop row after them run straight on,
   because what they do is already settled by the batch before. */
const batchTable = (sub) => {
  const rows = sub.batches || [];
  if (!rows.length) return "";
  const stops = rows.filter(r => r.stop).length;
  return `<div class="note" style="margin-top:12px">
    <div class="lbl">The batches &mdash; ${rows.filter(r => !r.stop).length}
      of them, and ${stops} places you decide</div>
    <div class="wrapx"><table class="t" style="margin-top:6px">
      <tr><th></th><th>stage</th><th>what the code does</th>
          <th class="n">runs</th><th>asks</th></tr>
      ${rows.map(r => r.stop
        ? `<tr style="background:var(--surface2)"><td></td>
             <td colspan="4"><b>&larr; you decide</b>
               <span class="why"> &nbsp;${esc(r.stop)}</span></td></tr>`
        : `<tr><td class="k">${esc(r.n || "")}</td><td class="k">${esc(r.stage || "")}</td>
             <td class="why">${esc(r.code || "")}</td>
             <td class="n">${esc(r.runs || "")}</td>
             <td class="why">${esc(r.asks || "")}</td></tr>${
           /* A batch that has run carries its ANSWER on the row below it. The
              table asked eleven questions and showed no answers, so a batch
              that had already been decided read exactly like one that had not
              started - and the whole point of the stop rows is to say which
              decisions are still open. */
           r.done ? `<tr><td></td><td colspan="4" class="why">
             <b style="color:var(--s1)">answered</b> &nbsp;${esc(r.done)}</td></tr>` : ""}`).join("")}
    </table></div>
    ${sub.batches_note ? `<p class="why small" style="margin:8px 0 0;max-width:78ch">${
      esc(sub.batches_note)}</p>` : ""}
  </div>`;
};

const isOpen = (sub) => (sub.items || []).some(it => it.id === HERE)
  || (sub.items || []).some(it => it.state === "now");

const doneCount = (sub) =>
  (sub.items || []).filter(it => it.state === "done").length;

const subBlock = (sub) => `
  <details style="margin-bottom:18px" ${isOpen(sub) ? "open" : ""}>
    <summary style="cursor:pointer;list-style:none">
    <h3 style="font-size:14px;margin:0 0 6px;display:inline">
      <span class="tag mono" style="color:var(--s1)">${esc(sub.id)}</span>${esc(sub.name)}</h3>
    ${!isOpen(sub) ? `<span class="chip ok" style="margin-left:8px">${
      doneCount(sub)}/${(sub.items || []).length} done</span>` : ""}
    </summary>
    ${sub.goal ? `<p class="goal">${esc(sub.goal)}</p>` : ""}
    ${sub.carry ? `<a class="carry" href="${esc(sub.carry)}">
       <b>What ${esc(sub.id)} left behind</b>
       <span>the settings it produced, and what turned out to be true &mdash;
         reward weights, tolerances, inputs, and every experiment that failed</span>
       <i>&rarr;</i></a>` : ""}
    ${sub.gate
      ? `<div class="gate"><div class="lbl">Gate</div><p>${esc(sub.gate)}</p></div>`
      : `<div class="gate none"><div class="lbl">No gate</div>
           <p>Numbers written down, nothing trained.</p></div>`}
    <ul class="items">
      ${(sub.items || []).map(it => `<li class="${itemClass(it)}">
        <span><span class="tag">${esc(it.id)}</span>${esc(it.what)}${
          it.id === HERE ? ` &nbsp;<span class="chip now">where we are</span>` : ""}
          ${it.goal || it.gets ? `<span class="io">
            ${it.goal ? `<span><b>Goal</b> ${esc(it.goal)}</span>` : ""}
            ${it.gets ? `<span><b>Gets</b> ${esc(it.gets)}</span>` : ""}
          </span>` : ""}</span>
      </li>`).join("")}
    </ul>
    ${sub.why ? `<p class="why small" style="max-width:72ch;margin:0">${esc(sub.why)}</p>` : ""}
    ${batchTable(sub)}
  </details>`;

const stepBlock = (p) => `
  <div class="step ${p.state === "now" ? "now" : ""}">
    <div class="rail"><div class="pip">${esc(p.id)}</div><div class="line"></div></div>
    <div class="body">
      <h3>${esc(p.name)}
        <span class="chip ${cls(p.state)}" style="vertical-align:3px;margin-left:6px">${
          esc(p.state)}</span></h3>
      <p class="why" style="max-width:72ch;margin:0 0 14px">${esc(p.what)}</p>
      ${(p.subs || []).length
        ? p.subs.map(subBlock).join("")
        : `<div class="gate"><div class="lbl">Gate</div><p>${esc(p.gate)}</p></div>
           <ul class="items">${(p.steps || []).map(x =>
             `<li>${esc(x)}</li>`).join("")}</ul>`}
      ${p.cost ? `<div class="note small"><b>Cost:</b> ${esc(p.cost)}</div>` : ""}
      ${p.blocked_by ? `<div class="note small"><b>Waits on:</b> ${esc(p.blocked_by)}</div>` : ""}
      ${p.note ? `<p class="why small" style="max-width:72ch;margin:6px 0 0">${esc(p.note)}</p>` : ""}
    </div>
  </div>`;

const jobRow = (j) => `<tr>
  <td class="mono">${j.number
      ? `<a class="plain" href="/runs#run=${esc(j.run_id)}">#${j.number}</a> ` : ""}${esc(j.name)}</td>
  <td><span class="chip ${cls(j.status || "")}">${esc(j.status || "not queued")}</span></td>
  <td class="dim">${j.seed ? `seed ${j.seed}` : ""}</td>
  <td class="dim">${j.verdict ? esc(j.verdict)
    : j.iterations_done ? `${j.iterations_done.toLocaleString()} iterations` : "&mdash;"}</td>
  <td class="dim mono small" style="word-break:break-all">${
    esc((j.command || "").replace("python scripts/train.py Gray-Walk ", ""))}</td>
</tr>`;

paper([

  { id: "here", lead: true, label: "Where we are", html: () => `
    <div class="eyebrow">The plan</div>
    <h1>${esc(F.one_line)}</h1>
    <p class="lede">${esc(F.lede)}</p>
    ${facts([
      { k: "Where we are", v: HERE || "—", n: (F.phases.find(p => p.state === "now") || {}).name || "" },
      { k: "Steps", v: String(F.phases.length), n: "each ends on a number, not a date" },
      { k: "Training runs", v: "2", n: "locomotion, and getting up" },
      { k: "Shelved", v: String((SH && SH.rows || F.parked || []).length),
        n: "each one names its trigger" },
    ])}
    <div class="cols">
      ${F.shape.map(p => `<div class="card"><p class="why small">${esc(p)}</p></div>`).join("")}
    </div>
    <div class="note key" style="margin-top:18px"><b>Source:</b>
      <code>PLAN.md</code> in the repo root, agreed 3 Aug 2026, transcribed into
      <code>dashboard/plan.py</code>. If the two ever disagree, PLAN.md is right
      and this page is stale.</div>` },

  { id: "steps", label: "The five steps", count: F.phases.length, html: () => `
    <p class="lede">One pattern, applied twice: train it, harden it, measure it.
      Locomotion first, then getting up, then join them, then the sensors twice
      &mdash; once to keep what you had, once to use them.</p>
    ${F.phases.map(stepBlock).join("")}
    <div class="note key"><b>And then it starts again.</b> ${esc(F.loop)}</div>` },

  { id: "week", label: "What is running", count: W.rounds.length, html: () => `
    <div class="eyebrow">PLAN ${esc(W.step || "1.1")}</div>
    <h2>The rounds inside ${esc(W.step || "1.1")}</h2>
    <p class="lede">${esc(W.lede)}</p>
    ${!s.runner_up ? `<div class="banner bad"><div><b>The runner is not running.</b>
        Nothing will start, however much is queued. Start it in a second terminal:
        <code>run.bat --runner</code></div></div>`
      : s.paused ? `<div class="banner bad"><div><b>The queue is paused.</b>
        The runner is up but will not claim anything until it is unpaused.</div></div>`
      : `<div class="banner ok"><div><b>Running.</b>
        ${s.running ? `${esc(s.running.variant || s.running.name)} &mdash;
            ${(s.running.iterations_done || 0).toLocaleString()} of
            ${(s.running.iterations_target || 0).toLocaleString()} iterations.`
          : "Nothing in flight."}
          ${s.queued_total} job${s.queued_total === 1 ? "" : "s"} waiting.</div></div>`}
    ${facts(W.at_a_glance)}
    <div class="cols" style="margin-bottom:20px">
      <div class="card">
        <h3>Why a matrix and not one long run</h3>
        ${W.why.map(p => `<p class="why small">${esc(p)}</p>`).join("")}
      </div>
      <div class="card">
        <h3>Rules while it runs</h3>
        ${W.rules.map(p => `<div class="risk small">${esc(p)}</div>`).join("")}
      </div>
    </div>
    ${W.rounds.map(r => `<div class="card" style="margin-bottom:12px">
      <h3><span class="chip">${esc(r.id)}</span>
        <span class="mono small" style="color:var(--muted)">${esc(r.step || "")}</span>
        &nbsp;${esc(r.name)}</h3>
      <p class="why small"><b>Asks:</b> ${esc(r.asks)}<br>
        <b>Design:</b> ${esc(r.design)}<br>
        <b>Reads:</b> ${esc(r.reads)}</p>
      ${r.jobs && r.jobs.length ? `<div class="tw"><table>
        <tr><th>Run</th><th>State</th><th>Seed</th><th>Result</th><th>What varies</th></tr>
        ${r.jobs.map(jobRow).join("")}
      </table></div>`
      : `<div class="note small"><b>${r.runs} runs, ~${r.hours} h &mdash; not queued yet.</b>
          ${r.id === "R3" ? " Designed from the rounds above it."
            : " Run <code>run.bat scripts/queue_week.py</code> to add it."}</div>`}
    </div>`).join("")}` },

  { id: "bars", label: "What it has to beat", html: () => {
    const r1 = (s.status && s.status.tasks || []).find(t => t.id === "R1");
    if (!r1) return `<p class="muted">No verified run yet, so there is nothing to
      score against the bar.</p>`;
    const failing = r1.criteria.filter(c =>
      c.best != null && (c.better === "lower" ? c.best > c.bar : c.best < c.bar)).length;
    return `
    <p class="lede">R1&rsquo;s bar, and the best any run has managed.
      ${failing} of ${r1.criteria.length} failing, and every run is scored on all
      ${r1.criteria.length}.</p>
    <div class="card"><div class="tw"><table>
      <tr><th>Criterion</th><th class="n">Bar</th><th class="n">Best so far</th>
          <th>State</th></tr>
      ${r1.criteria.map(c => {
        const better = c.better === "lower";
        const met = c.best == null ? null : better ? c.best <= c.bar : c.best >= c.bar;
        return `<tr>
          <td><b>${esc(c.name)}</b></td>
          <td class="n dim">${better ? "&le;" : "&ge;"} ${esc(value(c.bar, c.unit))}</td>
          <td class="n" style="color:${met ? "var(--good)" : "var(--crit)"}">
            ${c.best == null ? "&mdash;" : esc(value(c.best, c.unit))}</td>
          <td>${met === null ? `<span class="chip">not measured</span>`
              : met ? `<span class="chip ok">passing</span>`
              : `<span class="chip warn">${
                  (better ? c.best / c.bar : c.bar / c.best).toFixed(1)}&times; off</span>`}
          </td></tr>`;
      }).join("")}
    </table></div></div>` } },

  { id: "shelved", label: "Shelved",
    count: (SH && SH.rows || F.parked || []).length, html: () => `
    <p class="lede">${esc((SH && SH.lede) || "Decided against for now, with the reason, so none of it looks forgotten later.")}</p>
    <div class="tw"><table>
      <tr><th style="width:34%">What</th><th>Trigger to un-shelve</th></tr>
      ${(SH ? SH.rows : (F.parked || []).map(x => ({ what: x.what, trigger: x.why })))
        .map(x => `<tr>
          <td><b>${esc(x.what)}</b></td>
          <td class="dim">${esc(x.trigger)}</td></tr>`).join("")}
    </table></div>
    ${(SH && SH.cost) || F.shelved_cost
      ? `<div class="note key" style="margin-top:16px">${
          esc((SH && SH.cost) || F.shelved_cost)}</div>` : ""}
    ${(W.not_doing || []).length ? `
      <h3 style="margin-top:26px">Deferred &mdash; not now, but on the plan</h3>
      <div class="cols tight">
        ${W.not_doing.map(x => `<div class="card">
          <h3>${esc(x.what)}</h3>
          <p class="why small">${esc(x.why)}</p></div>`).join("")}
      </div>` : ""}` },

]);

}).catch(fail);
</script>
</body>
</html>

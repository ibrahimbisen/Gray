<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gray &mdash; robot</title>
<link rel="stylesheet" href="/page.css">
<style>
/* The documented exception. page.css has no component for a server-rendered
   image you orbit by dragging, and none for a dial row - nothing else in the
   dashboard has either. Everything else on this page is page.css. */
.stage { position:relative; cursor:grab; user-select:none; touch-action:none; }
.stage.drag { cursor:grabbing; }
.stage img { display:block; width:100%; background:#000; pointer-events:none; }
.stage.busy img { opacity:.65; }
/* The hero. Same idea as .stage - a server-rendered image - but with the axes
   drawn over it as SVG rather than baked in, so the text stays sharp at any
   width and the picture itself is one cached render. */
.heroblock { margin-bottom:var(--sp-5); }
/* CAPPED, and scaled rather than cropped. The render is nearly square, so across
   a 1500px sheet it came out 900px tall and pushed every block on the page below
   the fold - the drawing became the page instead of leading it.
   `object-fit:cover` is not available here: the axes are an SVG laid over the
   image in the RENDER's own coordinates, so cropping one would slide the labels
   off the robot. Capping the block scales the image and its overlay together. */
.hero { position:relative; border:1px solid var(--line); border-radius:var(--r);
        overflow:hidden; background:#000; max-width:920px; margin:0 auto; }
.hero img { display:block; width:100%; }
.hero svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
/* Two sizes that are not on the shared scale, and cannot be: these sit ON a
   black render, not on the page, and they need to hold up at any width the
   block is scaled to. The stroke behind them is the same near-black. */
.hero text { font-size:15px; font-weight:600; paint-order:stroke;
             stroke:rgba(6,7,10,.85); stroke-width:4px; stroke-linejoin:round; }
.hero text.turn { font-size:13.5px; font-weight:500; font-style:italic; }
.row { display:grid; grid-template-columns:44px 30px minmax(0,1fr) 68px; gap:7px;
       align-items:center; margin-bottom:7px; }
.row input { width:100%; accent-color:var(--s1); padding:4px 6px; text-align:right; }
.limrow { display:grid; grid-template-columns:52px 1fr 1fr; gap:8px; align-items:center;
          margin-bottom:7px; }
.limrow input { width:100%; padding:4px 6px; text-align:right; }
</style>
</head>
<body>
<div id="nav"></div>
<main id="body"><div class="empty">Loading&hellip;</div></main>

<script src="/page.js"></script>
<script>
/* One page about the physical machine. It merges what used to be three:
   stage1.html (is the digital model right), pose.html (the tool the owner
   measures the real robot with) and stage3.html (the real robot itself).
   They were always the same subject read three ways. */

const LEGNAME = { fr: "front right", fl: "front left",
                  br: "back right", bl: "back left" };

let S1 = null, S3 = null, CFG = null, CFGP = null;
const ANG = {}, INV = {};
let LINK = true, AZ = 125, EL = -12, ZOOM = 1.05, PENDING = false, AGAIN = false;

const key = (leg, seg) => leg + "_" + seg;

/* ================================================================== model === */

/* The hero: the robot standing, with its own six directions drawn on it.
   Everything the policy reads or writes is in this frame - which way is down,
   which way it is turning, which way it was told to walk - and nothing else on
   the dashboard says which way is which. The picture and the arrow positions
   both come from /api/robot/frame, so the arrows are the model's real axes
   projected through the same camera, not a drawing that has to be kept in step.

   FRAME holds the answer once it lands, because the Model tab is redrawn every
   time it is switched to and the render is not worth repeating. */
let FRAME = null;

const heroBlock = () => `
  <div class="heroblock">
    <div class="hero" id="hero">
      <div class="empty" style="border:0;margin:0">Drawing the robot&hellip;</div>
    </div>
    <div class="legend" id="herokey" style="margin:10px 0 0"></div>
    <div class="note small" style="margin-top:8px">
      The axes are fixed to the trunk and move with it &mdash; forward means where
      the nose points now, not north. They start at the trunk's centre of mass,
      which is where the middle IMU sits and where <code>projected_gravity</code>
      and <code>base_ang_vel</code> are defined. Each rotation is named after the
      axis it turns about, and the curved arrow shows which way counts as
      positive. This is the standing pose from <code>robot.yaml</code>, the pose
      every task spawns the robot in.
    </div>
  </div>`;

/* An arrowhead as an SVG polygon: a triangle at `to`, pointing away from `from`. */
function head(from, to, size) {
  const dx = to[0] - from[0], dy = to[1] - from[1];
  const n = Math.hypot(dx, dy) || 1;
  const ux = dx / n, uy = dy / n, px = -uy, py = ux;
  const b = [to[0] - ux * size, to[1] - uy * size];
  return `${to[0]},${to[1]} ${b[0] + px * size * .42},${b[1] + py * size * .42} ` +
         `${b[0] - px * size * .42},${b[1] - py * size * .42}`;
}

function drawFrame(d) {
  const box = $("#hero");
  if (!box || !d.origin) return;
  const o = d.origin;
  const anchor = (p) => p[0] < o[0] ? "end" : "start";

  /* poser.project() returns null for a point behind the camera, so any of these
     can be missing at some viewing angles. An axis that cannot be placed is left
     off the drawing; the render underneath is still correct, and the key below
     still names all three. Reading [0] off the null took the whole tab down. */
  const at = (p) => Array.isArray(p) && p.length > 1 && p[0] != null;

  const arms = (d.axes || []).filter(a => at(a.tip) && at(a.far)).map(a => {
    const c = `var(${a.colour})`;
    const arc = (a.arc || []).filter(at);
    const turn = at(a.turn_at);
    return `
      <line x1="${o[0]}" y1="${o[1]}" x2="${a.tip[0]}" y2="${a.tip[1]}"
            stroke="${c}" stroke-width="2.6" stroke-linecap="round"/>
      <polygon points="${head(o, a.tip, 13)}" fill="${c}"/>
      <text x="${a.far[0]}" y="${a.far[1]}" fill="${c}"
            text-anchor="${anchor(a.far)}" dy=".32em">${esc(a.label)}</text>
      ${arc.length > 1 ? `<polyline points="${arc.map(p => p.join(",")).join(" ")}"
                 fill="none" stroke="${c}" stroke-width="2.2" opacity=".92"/>
               <polygon points="${head(arc[arc.length - 2], arc[arc.length - 1], 11)}"
                 fill="${c}"/>` : ""}
      ${turn ? `<text class="turn" x="${a.turn_at[0]}" y="${a.turn_at[1]}" fill="${c}"
            text-anchor="${anchor(a.turn_at)}" dy=".32em">${esc(a.turn)}</text>` : ""}`;
  }).join("");

  box.innerHTML = `
    <img src="data:image/png;base64,${d.png}"
         alt="Gray standing, with its X, Y and Z axes and its roll, pitch and yaw drawn on it">
    <svg viewBox="0 0 ${d.w} ${d.h}">
      ${arms}
      <circle cx="${o[0]}" cy="${o[1]}" r="4.5" fill="var(--ink)"
              stroke="rgba(6,7,10,.8)" stroke-width="1.5"/>
    </svg>`;

  const key = $("#herokey");
  if (key) key.innerHTML = (d.axes || []).map(a => `
    <span><i style="background:var(${a.colour})"></i>
      <span><b style="color:var(--ink)">${esc(a.label)}</b> &middot;
        <em>${esc(a.turn)}</em> ${esc(a.meaning)}</span></span>`).join("");
}

/* Fetched once per page load, then redrawn from FRAME on every later visit to
   this tab. A failure is said out loud rather than left as a spinner. */
function loadFrame() {
  if (FRAME) return drawFrame(FRAME);
  get("/api/robot/frame")
    .then(d => { FRAME = d; drawFrame(d); })
    .catch(e => {
      const box = $("#hero");
      if (box) box.innerHTML = empty("Could not draw the robot: " + e);
    });
  return undefined;
}

/* The Model tab, as a drawing sheet.

   It was six sections of the same shape: a heading, a lede, then two cards side
   by side - one holding a table and the other holding an essay ABOUT that table.
   Six tables and six essays, alternating, down one 1180px column.

   That shape is why the page read as long without saying much. A paragraph
   sitting beside a table is a paragraph nobody reads, because the table already
   answered the question; and it pushed the next table a screen further down. So
   each pair became one block: the table, and the one line of it that was worth
   keeping, as a `why` column or a single note underneath.

   The render leads, full width, because this is the page about the machine and
   that is the machine. /summary borrowed it; this is where it lives. */
const modelTab = () => {
  const s = S1;
  const m = s.model || {};
  const massTotal = (s.mass || {}).total;
  return `<div class="sheet">

  ${titleblock([
    { k: "sheet", v: "A digital Gray worth trusting" },
    { k: "subject", v: "stage 1 · the model everything trains against" },
    { k: "mass", v: massTotal ? `${massTotal} g` : "—" },
    { k: "joints", v: `${(s.limits || {}).rows ? s.limits.rows.length * 4 : 12} across 4 legs` },
    { k: "checks", v: m.total ? `${m.passed} of ${m.total} pass` : "—" },
    { k: "checked", html: `<span class="mono">every page load</span>` },
  ])}

  <p class="lede">${esc(s.lede)}</p>

  ${heroBlock()}

  ${facts(s.facts)}

  <div class="grid wide">
    ${blk("The model, checked live", m.total ? `${m.passed}/${m.total}` : null,
      `<div style="padding:11px">${modelBlock(m)}</div>`,
      `<span class="mono">tools/check_urdf.py</span>`)}

    ${blk("Where the mass came from", (s.mass.rows || []).length, `
      <table class="t">
        <tr><th>part</th><th class="n">mass</th><th>what is in it</th></tr>
        ${s.mass.rows.map(r => `<tr><td class="k">${esc(r.part)}</td>
          <td class="n">${r.g} g</td><td class="why">${esc(r.n)}</td></tr>`).join("")}
        <tr><td class="k"><b>total</b></td><td class="n"><b>${s.mass.total} g</b></td>
            <td class="why">estimated, not weighed</td></tr>
      </table>
      <details id="masswhy">
        <summary>why these numbers and not the CAD's<span class="grow"></span>
          <b>${s.mass.notes.length}</b> notes</summary>
        <div style="padding:0 11px 11px">
          ${s.mass.notes.map(n => `<p class="why">${esc(n)}</p>`).join("")}
        </div>
      </details>`, `<span class="mono">robot.yaml</span>`)}
  </div>

  <div class="note" style="margin:var(--sp-4) 0">${esc(s.mass.intro)}</div>

  <div class="grid wide">
    ${blk("How far each joint turns", (s.limits.rows || []).length, `
      <table class="t">
        <tr><th>joint</th><th class="n">travel</th><th>which way is positive</th></tr>
        ${s.limits.rows.map(r => `<tr><td class="k">${esc(r.joint)}</td>
          <td class="n">${esc(r.range)}</td>
          <td class="why">${esc(r.n)}</td></tr>`).join("")}
      </table>
      <div class="note key" style="margin:11px"><b>Measured, not stated.</b> A
        limit written into a file is a claim; turning the joint in the simulator
        and reading where it stopped is a measurement. They have disagreed - two
        legs once exported rotated 180 degrees, which makes every sign in that
        leg backwards while the file still looks right. Both numbers are recorded
        in the <b>Pose</b> tab, which is where the travel is measured.</div>`)}

    ${blk("The parts session", (s.parts.needed || []).length, `
      <table class="t">
        <tr><th>item</th><th>what is needed</th></tr>
        ${s.parts.needed.map(p => `<tr><td class="k">${esc(p.item)}</td>
          <td class="why">${esc(p.ask)}</td></tr>`).join("")}
      </table>
      <div class="note key" style="margin:11px"><b>Output:</b> ${esc(s.parts.output)}
        <br>${esc(s.parts.why_slicer)}</div>
      <div class="note bad" style="margin:11px"><b>What it cannot fix.</b>
        ${esc(s.parts.cannot_fix)}</div>`)}
  </div>

  <div class="grid wide" style="margin-top:var(--sp-4)">
    ${blk("What had to be fixed in the export", (s.fixed || []).length, `
      <table class="t">
        <tr><th>fault</th><th>what it did</th></tr>
        ${s.fixed.map(f => `<tr><td class="k">${esc(f.t)}</td>
          <td class="why">${esc(f.d)}</td></tr>`).join("")}
      </table>
      <div class="note" style="margin:11px">Each was found by a check failing or
        by the robot behaving impossibly. None of them announce themselves.</div>`)}

    ${blk("Still assumed", (s.open || []).length, `
      <table class="t">
        <tr><th>what is not known</th><th>what is done about it</th></tr>
        ${s.open.map(o => `<tr><td class="k">${esc(o.q)}</td>
          <td class="why">${esc(o.n)}</td></tr>`).join("")}
      </table>
      <div class="note" style="margin:11px">This is why stage 1 reads
        <i>provisional</i> rather than done. Three of these have no datasheet
        anywhere &mdash; only the physical robot can settle them, which is step
        3.3 on the <b>Hardware</b> tab. They are randomised rather than guessed,
        and a policy that survives the range survives whatever the truth is.</div>`)}
  </div>

  <div class="grid" style="margin-top:var(--sp-4)">
    ${s.story.map(p => `<div class="blk"><div class="why"
      style="padding:11px">${esc(p)}</div></div>`).join("")}
  </div>

  </div>`;
};

/* =============================================================== hardware === */

/* The Hardware tab. It was three grids of cards, and every card held one
   paragraph and nothing else - so the page was prose wearing boxes. Cards are
   for things with several fields; a list of sentences is a list.

   The steps ARE a sequence and they are numbered, so they are a numbered table.
   The rest is one column of rows. */
const hardwareTab = () => {
  const s = S3;
  return `<div class="sheet">

  ${titleblock([
    { k: "sheet", v: "Put it on the real Gray" },
    { k: "subject", v: "stage 3 · deploy" },
    { k: "steps", v: `${(s.steps || []).length}` },
    { k: "needs the robot", v: "yes, all of it" },
    { k: "can be written first", v: `${(s.software_first || []).length} things` },
    { k: "blocked on", html: `<a class="plain" href="#model">stage 1</a>, partly` },
  ])}

  <p class="lede">${esc(s.lede)}</p>

  <div class="grid wide">
    ${blk("The steps", (s.steps || []).length, `
      <table class="t">
        <tr><th class="n">#</th><th>step</th><th>what it involves</th></tr>
        ${s.steps.map(st => `<tr>
          <td class="n">${esc(st.n)}</td>
          <td class="k">${esc(st.name)}</td>
          <td class="why">${esc(st.d)}</td></tr>`).join("")}
      </table>
      <div class="note key" style="margin:11px">Step 3.3 points back at the
        <b>Model</b> tab on purpose. Measuring the real servos changes the model,
        and everything trained after that is more honest for it.</div>`)}

    ${blk("Worth writing before the hardware exists", (s.software_first || []).length, `
      <table class="t">
        <tr><th>what</th></tr>
        ${s.software_first.map(x => `<tr><td class="why">${esc(x)}</td></tr>`).join("")}
      </table>
      <div class="note" style="margin:11px">None of these need the robot, and all
        of them are cheaper now than on the day it is back together and something
        does not work.</div>`)}
  </div>

  <div class="grid" style="margin-top:var(--sp-4)">
    ${s.intro.map(p => `<div class="blk"><div class="why"
      style="padding:11px">${esc(p)}</div></div>`).join("")}
  </div>

  </div>`;
};

/* =================================================================== pose === */

/* The skeleton only. The dials cannot be drawn until /api/pose/config says how
   many legs and segments there are, and the tab may be drawn before that
   answers - so buildPose() fills #dials and #lims afterwards. */
const poseTab = () => `
  <div class="vwrap">
    <div>
      <div class="stage" id="stage">
        <img id="shot" alt="the robot in the current pose">
      </div>
      <div class="banner bad hidden" id="clash" style="margin-top:10px"></div>
      <div class="hidden" id="poseerr" style="margin-top:10px"></div>

      <div class="sech" style="margin-top:10px">
        <h2 class="tnum" id="camlab"></h2>
        <span class="note">drag to orbit &middot; scroll to zoom</span>
        <div class="grow"></div>
        <button class="btn tiny" data-view="125,-12">3/4</button>
        <button class="btn tiny" data-view="180,0">side</button>
        <button class="btn tiny" data-view="90,0">front</button>
        <button class="btn tiny" data-view="270,0">back</button>
        <button class="btn tiny" data-view="180,-89">top</button>
        <button class="btn tiny" data-view="180,45">below</button>
      </div>

      <div id="facts"></div>
      <div class="note small" id="ground"></div>
      <div class="note small" id="hint"></div>
    </div>

    <div>
      <div class="card">
        <div class="sech"><h2>Dials &mdash; degrees from sitting</h2>
          <div class="grow"></div>
          <button class="btn tiny" id="link">link legs</button>
          <button class="btn tiny" id="zeroall">reset</button></div>

        <div class="note small">The <b>&#8644;</b> button next to a dial reverses
          that joint. Use it when a limb moves the opposite way to the others
          &mdash; then save it, and the reversal goes into the model itself.</div>

        <div class="note key small">The saved standing pose is
          <b>hip 0, thigh +27, calf &minus;45</b> on every leg, in these same
          dials. It lives in <code>gray/config/robot.yaml</code> under
          <code>stance.angles_deg</code>, and
          <code>progress/stance/stance.yaml</code> is regenerated from it by
          <code>scripts/find_stance.py</code>. Nothing here writes it.</div>

        <div id="dials"></div>
        <button class="btn" id="savedirs" style="width:100%;margin-top:4px">
          Save reversals to robot.yaml</button>
        <div class="note small" id="dirnote"></div>
      </div>

      <div class="card" style="margin-top:14px">
        <div class="sech"><h2>Record the travel</h2></div>
        <div class="limrow faint"
             style="font-size:10.5px;text-transform:uppercase;letter-spacing:.08em">
          <span></span><span>min</span><span>max</span></div>
        <div id="lims"></div>
        <button class="btn go" id="save" style="width:100%;margin-top:10px">
          Save to robot.yaml</button>
        <div class="note small" id="savenote">
          Drag a joint until the leg hits the body &mdash; the bar under the
          picture turns red. That angle is the mechanical limit. Type it in, do
          the other two, then save.</div>
      </div>
    </div>
  </div>`;

/* Fetched once and kept. The angles survive a tab switch, which is the point -
   the owner leaves a pose set while reading the mass table. */
function poseConfig() {
  if (!CFGP) CFGP = get("/api/pose/config").then(c => {
    CFG = c;
    c.legs.forEach(l => c.segments.forEach(s => {
      if (ANG[key(l, s)] === undefined) ANG[key(l, s)] = 0;
    }));
    (c.invert || []).forEach(k => { INV[k] = true; });
    return c;
  });
  return CFGP;
}

function buildPose() {
  const hint = $("#hint");
  if (hint) hint.innerHTML =
    `<b>+ hip</b> ${esc(CFG.convention.hip.replace("+ ", ""))} &middot;
     <b>+ thigh</b> ${esc(CFG.convention.thigh.replace("+ ", ""))} &middot;
     <b>+ calf</b> ${esc(CFG.convention.calf.replace("+ ", ""))}.
     Every dial is degrees away from the sitting pose, where
     <b>zero = ${esc(CFG.zero)}</b>. The robot is dropped onto the floor each
     time, so <b>trunk height</b> is how tall it actually stands.`;

  $("#dials").innerHTML = CFG.legs.map(leg => `
    <div class="sech" style="margin-top:14px">
      <h2>${esc(LEGNAME[leg] || leg)}</h2></div>
    ${CFG.segments.map(seg => `
      <div class="row">
        <label class="small faint">${esc(seg)}</label>
        <button class="btn tiny ${INV[key(leg, seg)] ? "on" : ""}"
                data-flip="${key(leg, seg)}" title="reverse this joint">&#8644;</button>
        <input type="range" min="-135" max="135" step="0.5" value="0"
               data-leg="${leg}" data-seg="${seg}">
        <input class="filter" type="text" data-num="${key(leg, seg)}" value="0">
      </div>`).join("")}`).join("");

  $("#lims").innerHTML = CFG.segments.map(seg => `
    <div class="limrow"><span class="small faint">${esc(seg)}</span>
      <input class="filter" data-lim="${esc(seg)}" data-end="0" value="${CFG.current[seg][0]}">
      <input class="filter" data-lim="${esc(seg)}" data-end="1" value="${CFG.current[seg][1]}">
    </div>`).join("");

  const dials = $("#dials");
  dials.querySelectorAll("input[type=range]").forEach(el => {
    el.addEventListener("input",
      () => setAngle(el.dataset.leg, el.dataset.seg, +el.value));
  });
  dials.querySelectorAll("[data-flip]").forEach(el => {
    el.onclick = () => {
      const k = el.dataset.flip;
      INV[k] = !INV[k];
      el.classList.toggle("on", INV[k]);
      render();
    };
  });
  dials.querySelectorAll("input[data-num]").forEach(el => {
    el.addEventListener("change", () => {
      const [leg, seg] = el.dataset.num.split("_");
      const v = parseFloat(el.value);
      if (!isNaN(v)) setAngle(leg, seg, Math.max(-135, Math.min(135, v)));
    });
  });

  $("#link").classList.toggle("on", LINK);
  $("#link").onclick = () => { LINK = !LINK; $("#link").classList.toggle("on", LINK); };
  $("#zeroall").onclick = () => {
    Object.keys(ANG).forEach(k => { ANG[k] = 0; });
    syncInputs(); render();
  };
  document.querySelectorAll("[data-view]").forEach(b =>
    b.onclick = () => {
      const [a, e] = b.dataset.view.split(",").map(Number);
      AZ = a; EL = e; render();
    });

  $("#savedirs").onclick = saveDirections;
  $("#save").onclick = saveLimits;
  orbit();
  syncInputs();
}

function setAngle(leg, seg, v) {
  const targets = LINK ? CFG.legs : [leg];
  targets.forEach(l => { ANG[key(l, seg)] = v; });
  syncInputs();
  render();
}

function syncInputs() {
  const dials = $("#dials");
  if (!dials) return;
  dials.querySelectorAll("input[type=range]").forEach(el => {
    el.value = ANG[key(el.dataset.leg, el.dataset.seg)] ?? 0;
  });
  dials.querySelectorAll("input[data-num]").forEach(el => {
    el.value = (ANG[el.dataset.num] ?? 0).toFixed(1);
  });
}

/* Rendering happens server-side, so a drag coalesces into one request in flight
   at a time rather than queueing a hundred. Every lookup is guarded because the
   tab can be switched away mid-request, which takes the elements with it. */
function render() {
  const stage = $("#stage");
  if (!stage || !CFG) return;
  if (PENDING) { AGAIN = true; return; }
  PENDING = true;
  stage.classList.add("busy");
  const lab = $("#camlab");
  if (lab) lab.textContent = `az ${Math.round(AZ)}°  el ${Math.round(EL)}°`;
  const q = new URLSearchParams({ angles: JSON.stringify(ANG), invert: JSON.stringify(INV),
                                  az: AZ, el: EL, dist: ZOOM });
  fetch("/api/pose?" + q).then(r => r.json()).then(d => {
    /* A render that failed says so. Without this the image simply held its last
       good pose while every dial went on moving, which reads as "the model does
       not respond to the calf" rather than "the render is broken". */
    if (!d || d.error || !d.png) throw new Error((d && d.error) || "no render came back");
    const img = $("#shot");
    if (img) img.src = "data:image/png;base64," + d.png;
    poseFacts(d.facts);
    const say = $("#poseerr");
    if (say) say.className = "hidden";
  }).catch(e => {
    const say = $("#poseerr");
    if (say) { say.className = "banner bad"; say.textContent = `The render failed: ${e.message}`; }
  }).finally(() => {
    PENDING = false;
    const s = $("#stage");
    if (s) s.classList.remove("busy");
    if (AGAIN) { AGAIN = false; render(); }
  });
}

/* Named poseFacts, not facts: `facts` is page.js's builder and this page uses
   it, three lines down. */
function poseFacts(f) {
  const box = $("#facts");
  if (!box) return;
  box.innerHTML = facts([
    { k: "trunk height", html: `${f.trunk_mm}<span class="faint"
        style="font-size:13px"> mm</span>`, n: "how tall it actually stands" },
    { k: "stance, front-back", v: f.stance_x_mm, n: "mm" },
    { k: "stance, side-side", v: f.stance_y_mm, n: "mm" },
    { k: "legs on the floor",
      html: `<span style="color:var(${f.legs_down === 4 ? "--good" : "--warn"})">${
        f.legs_down}</span><span class="faint" style="font-size:13px"> / 4</span>`,
      n: `on toes: ${f.toes_down} / 4` },
    { k: "self-collision",
      html: `<span style="font-size:16px;color:var(${f.colliding ? "--crit" : "--good"})">${
        f.colliding ? "HITTING" : "clear"}</span>`,
      n: f.colliding ? f.clashes.join(", ") : "no part touching another" },
  ]);

  const g = $("#ground");
  if (g) g.innerHTML = `<b>Touching the ground:</b> ${
    f.on_ground.length ? f.on_ground.map(esc).join(" &middot; ") : "nothing"}.
    <b>Toe heights</b> ${Object.entries(f.toe_height_mm)
      .map(([k, v]) => `${esc(k)} ${v}`).join(" &middot; ")} mm.`;

  const bar = $("#clash");
  if (bar) {
    bar.classList.toggle("hidden", !f.colliding);
    if (f.colliding) bar.innerHTML =
      `<b>Hitting:</b> ${esc(f.clashes.join(", "))} &mdash; this is the mechanical limit`;
  }
}

/* Free orbit. Drag turns the camera round the robot and tilts it; the wheel
   pulls in and out. */
function orbit() {
  const stage = $("#stage");
  if (!stage) return;
  let dragging = false, lx = 0, ly = 0;
  stage.addEventListener("pointerdown", e => {
    dragging = true; lx = e.clientX; ly = e.clientY;
    stage.classList.add("drag"); stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener("pointermove", e => {
    if (!dragging) return;
    AZ = (AZ + (e.clientX - lx) * 0.45) % 360;
    EL = Math.max(-89, Math.min(89, EL + (e.clientY - ly) * 0.35));
    lx = e.clientX; ly = e.clientY;
    render();
  });
  const stop = e => {
    dragging = false; stage.classList.remove("drag");
    try { stage.releasePointerCapture(e.pointerId); } catch (_) { /* already gone */ }
  };
  stage.addEventListener("pointerup", stop);
  stage.addEventListener("pointercancel", stop);
  stage.addEventListener("wheel", e => {
    e.preventDefault();
    ZOOM = Math.max(0.45, Math.min(3.0, ZOOM * (e.deltaY > 0 ? 1.08 : 0.926)));
    render();
  }, { passive: false });
}

/* The two writes. Same endpoints, same bodies, same replies as before - these
   are the only things on this page that change a file on disk. */
function saveDirections() {
  const inv = Object.keys(INV).filter(k => INV[k]);
  fetch("/api/pose/directions", { method: "POST", body: JSON.stringify({ invert: inv }) })
    .then(r => r.json()).then(d => {
      /* The server answers a refusal with {error}, not with the list. Reading
         .length off that gave "Failed: TypeError" instead of the reason. */
      if (!Array.isArray(d)) throw new Error((d && d.error) || "the server sent no list back");
      $("#dirnote").innerHTML = d.length
        ? `<b style="color:var(--good)">Saved.</b> Reversed: ${d.map(esc).join(", ")}.
           Rebuild with <code>tools/prepare_model.py</code> to apply.`
        : `<b style="color:var(--good)">Saved.</b> No joints reversed.`;
    })
    .catch(e => { $("#dirnote").innerHTML =
      `<b style="color:var(--crit)">Failed:</b> ${esc(e)}`; });
}

function saveLimits() {
  const out = {};
  CFG.segments.forEach(seg => {
    const a = document.querySelector(`[data-lim="${seg}"][data-end="0"]`).value;
    const b = document.querySelector(`[data-lim="${seg}"][data-end="1"]`).value;
    out[seg] = [parseFloat(a), parseFloat(b)];
  });
  fetch("/api/pose/limits", { method: "POST", body: JSON.stringify(out) })
    .then(r => r.json()).then(d => {
      /* Same as saveDirections: {error} is a legal reply and it has no .hip. */
      if (!d || d.error || !d.hip) throw new Error((d && d.error) || "the server saved nothing");
      $("#savenote").innerHTML = `<b style="color:var(--good)">Saved.</b> hip
        ${d.hip[0]} to ${d.hip[1]}, thigh ${d.thigh[0]} to ${d.thigh[1]}, calf
        ${d.calf[0]} to ${d.calf[1]}. Rebuild the model with
        <code>tools/prepare_model.py</code> to apply them.`;
    })
    .catch(e => { $("#savenote").innerHTML =
      `<b style="color:var(--crit)">Failed:</b> ${esc(e)}`; });
}

/* ==================================================================== go === */

Promise.all([get("/api/stage/1"), get("/api/stage/3")]).then(([a, b]) => {
  S1 = a; S3 = b;
  mountNav("/robot", navState(S1 && S1.nav));

  const m = S1.model || {};
  tabbed("#body", [
    { id: "model", label: "Model", html: modelTab,
      count: m.total ? `${m.passed}/${m.total}` : null },
    { id: "pose", label: "Pose", html: poseTab },
    { id: "hardware", label: "Hardware", html: hardwareTab,
      count: S3.steps.length },
  ], {
    onDraw: (id) => {
      if (id === "model") return loadFrame();
      if (id !== "pose") return;
      poseConfig().then(() => { buildPose(); render(); })
        .catch(e => { $("#dials").innerHTML = empty("Could not load the pose editor: " + e); });
    },
  });
}).catch(e => { mountNav("/robot", ""); fail(e); });
</script>

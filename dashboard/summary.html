<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gray &mdash; summary</title>
<link rel="stylesheet" href="/page.css">
<style>
/* ---------------------------------------------------------------------------
   THE DRAWING VOCABULARY. This is the only page that draws block diagrams, so
   this is the only page that carries these rules.

   The subject is a control system explained to the engineer who built the
   machine, and the native vernacular for that is the drawing: boxes, labelled
   wires, a controller, a plant. So the identity is DRAWN rather than written -
   the diagrams carry the argument and the prose annotates them. Six drawings:
   the signal chain, the reward tables, the file split, the sampled command box,
   the sim|real mirror, and the criteria gauges.

   Nothing here sets a size. Every length below is a token from page.css. This
   block used to hold its own type scale - a 50px display headline, 64px section
   padding, a 1120px column - which is why this page ignored the shared scale
   entirely and stayed twice the size of every other page after that scale
   shrank. A page's own stylesheet may say what a thing LOOKS like. It may not
   say how big the page is.

   Three names were renamed on the way: `.blk` collided with the shared block
   component, `.track` with the shared distance-to-bar axis, and `.pnum` and
   `.callout` were second spellings of `.secnum` and `.note`. Each collision is
   the same fault the header of page.css is about.

   Two rules hold the drawings together. Blue (--s1) is reserved for a LIVE
   SIGNAL and appears nowhere else, so a blue line always means numbers are
   moving along it. And every label ON a diagram is monospaced while every
   sentence ABOUT one is not, which is how a real drawing separates the thing
   from the note about the thing.
   --------------------------------------------------------------------------- */

/* ---------- the sheet header: the machine, and the contract that defines it --

   THE THESIS, and the one place on this page that spends any size.

   Everything below explains a control system, and the page never showed either
   half of it: not the machine, and not the contract. So: the robot on the left,
   standing in the pose it trains in, rendered from the same model the simulator
   runs. And on the right the whole of what gets deployed - 45 numbers in, 12
   joint angles out, every 20 ms. One file. That sentence is the project.

   The render is the SAME image the /robot page leads with, from the same cached
   call, so the two pages cannot show two different robots. If MuJoCo is not
   installed the frame simply does not arrive and the panel stays empty, which
   is the honest failure: no drawing rather than a drawing of nothing. */
/* Three columns: the machine, the contract it runs, and the machine's own
   numbers. It was two, and the contract is six lines against a render three
   times its height - so the panel had a hole in it however the lines were
   spaced. The hole was not a spacing problem; the header was missing a column.

   The third one earns its place: this page explains the software at length and
   never said what the hardware IS. Mass, joints, ride height, torque margin,
   and the 50 Hz that the servo PWM period fixes and no amount of software can
   move. Read from /api/stage/1, which is the same source the Robot page uses. */
.sheethead { display:grid; gap:var(--sp-4); align-items:stretch;
  margin-bottom:var(--sp-4);
  grid-template-columns:minmax(200px,.85fr) minmax(0,1.15fr) minmax(190px,.7fr); }
@media (max-width:1100px) { .sheethead { grid-template-columns:1fr 1fr; }
  .sheethead .spec { grid-column:span 2; } }
@media (max-width:820px) { .sheethead { grid-template-columns:1fr; }
  .sheethead .spec { grid-column:auto; } }

/* The spec column. A drawing's parts list: name, value, and the one line that
   says where the value came from. */
.spec { border:1px solid var(--line); border-radius:var(--r);
  background:var(--surface); overflow:hidden; display:flex; flex-direction:column; }
.spec .cap { font-family:var(--mono); font-size:var(--t-cap); letter-spacing:.12em;
  text-transform:uppercase; color:var(--muted); padding:var(--sp-2) 11px;
  border-bottom:1px solid var(--line); background:var(--surface2); }
.spec .row { padding:var(--sp-2) 11px; border-top:1px solid var(--grid); flex:1;
  display:flex; flex-direction:column; justify-content:center; }
.spec .row:first-of-type { border-top:0; }
.spec .row .k { font-size:var(--t-cap); text-transform:uppercase;
  letter-spacing:.08em; color:var(--muted); }
.spec .row .v { font-family:var(--mono); font-size:var(--t-body);
  font-weight:var(--w-bold); color:var(--ink); margin-top:1px; }
.spec .row .n { font-size:var(--t-mark); color:var(--muted); line-height:1.35;
  margin-top:1px; }
/* A plate, not a portrait: the render is nearly square, so it is cropped to fill
   whatever the row's height turns out to be.

   NO `aspect-ratio` here, and that is load-bearing. On a stretched grid item
   aspect-ratio resolves the OTHER way - it took the row height, which the spec
   column sets, and computed a width from it. The panel came out 736px wide in a
   470px column and drew straight over the contract beside it. Height comes from
   the row; the image covers it; the column decides the width. */
.sheethead > * { min-width:0; }
.sheethead .shot { border:1px solid var(--line); border-radius:var(--r);
  background:var(--surface); overflow:hidden; position:relative; min-height:200px; }
.sheethead .shot img { display:block; width:100%; height:100%;
  object-fit:cover; object-position:center 45%; }
/* The corner tick. A drawing sheet is registered by its corners, and this says
   the panel is a drawing field rather than a photograph. */
.sheethead .shot::after { content:""; position:absolute; right:9px; bottom:9px;
  width:14px; height:14px; border-right:1px solid var(--muted);
  border-bottom:1px solid var(--muted); opacity:.55; }
.sheethead .shot .cap { position:absolute; left:9px; top:9px; font-family:var(--mono);
  font-size:var(--t-cap); letter-spacing:.12em; text-transform:uppercase;
  color:var(--muted); }

/* space-between, not center. Centred, the six lines floated in the middle of a
   frame the height of the render beside them, with equal dead space above and
   below - which reads as a panel that has not been filled in. Pushed apart, the
   caption sits at the head of the panel and the prose at its foot, which is
   where a drawing puts them. */
.contract { border:1px solid var(--line); border-radius:var(--r);
  background:var(--surface); padding:var(--sp-5); display:flex;
  flex-direction:column; justify-content:center; gap:var(--sp-3); }
.contract .k { font-family:var(--mono); font-size:var(--t-cap); letter-spacing:.12em;
  text-transform:uppercase; color:var(--muted); }
.contract .big { font-family:var(--mono); font-size:var(--t-hero); line-height:1;
  font-weight:var(--w-bold); letter-spacing:-.03em; margin:var(--sp-3) 0 var(--sp-2);
  display:flex; align-items:baseline; gap:var(--sp-3); flex-wrap:wrap; }
.contract .big .arrow { color:var(--s1); font-weight:400; }
.contract .big .hz { font-size:var(--t-head); color:var(--ink2); font-weight:400;
  letter-spacing:0; }
/* The two halves of the contract, labelled under the numbers they belong to -
   a leader line without the line. */
.contract .legs { display:flex; gap:var(--sp-5); font-size:var(--t-mark);
  color:var(--muted); font-family:var(--mono); }
.contract .rule { border-top:1px solid var(--line); margin:var(--sp-4) 0; }
.contract .says { font-size:var(--t-body); color:var(--ink2); line-height:1.5; }
.contract .says b { color:var(--ink); }

/* The dimension line moved into page.css: /dials draws them too, and a
   component written twice is a component that ends up looking two ways. */

/* ---------- plates: one numbered drawing sheet per section ---------- */
.plate { margin:0; padding:var(--sp-6) 0; border-bottom:1px solid var(--line); }
.plate:last-child { border-bottom:0; }
.plate > header { display:grid; grid-template-columns:auto 1fr; gap:var(--sp-3);
  align-items:start; margin-bottom:var(--sp-5); }
.plate h2 { margin:0 0 3px; max-width:44ch; }
.plate header p { font-size:var(--t-body); line-height:1.55; color:var(--ink2);
  max-width:80ch; margin:0; }
.plate .prose { max-width:78ch; }
.plate .prose p { font-size:var(--t-body); line-height:1.55; margin:0 0 var(--sp-3); }
.plate .prose p:last-child { margin-bottom:0; }
.plate .prose b { color:var(--ink); }

/* a drawing beside its annotation */
.split { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:var(--sp-5); align-items:start; }
@media (max-width:900px) { .split { grid-template-columns:1fr; gap:var(--sp-4); } }

/* ---------- the drawing field ---------- */
.dwg { background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:var(--sp-4); overflow-x:auto; }
.dwg .cap { font-family:var(--mono); font-size:var(--t-cap); letter-spacing:.12em;
  text-transform:uppercase; color:var(--muted); margin-bottom:var(--sp-4); }
.dwg .foot { font-size:var(--t-data); color:var(--ink2); margin-top:var(--sp-4);
  line-height:1.5; }

/* -- 1. the signal chain: sensors -> policy -> joints --
   `.node`, not `.blk`: page.css owns `.blk` as the panel component every page
   builds, and this is a box in a diagram. Two meanings for one name is what the
   header of page.css exists to stop. */
.chain { display:grid; grid-template-columns:1fr auto 1fr auto 1fr; gap:0;
  align-items:center; min-width:620px; }
.node { border:1px solid var(--line); border-radius:var(--r);
  background:var(--surface2); padding:var(--sp-3) 11px; }
.node.core { border-color:var(--s1); border-width:2px; padding:var(--sp-4) 11px; }
.node h4 { font-family:var(--mono); font-size:var(--t-cap); letter-spacing:.12em;
  text-transform:uppercase; color:var(--muted); margin:0 0 var(--sp-2);
  font-weight:var(--w-bold); }
.node .big { font-size:var(--t-lead); font-weight:var(--w-bold); letter-spacing:-.02em;
  line-height:1; font-family:var(--mono); }
.node .big small { font-size:var(--t-mark); font-weight:400; color:var(--ink2);
  letter-spacing:0; margin-left:var(--sp-1); font-family:var(--sans); }
.io { list-style:none; margin:0; padding:0; font-family:var(--mono);
  font-size:var(--t-data); }
.io li { display:flex; gap:var(--sp-3); padding:2px 0; color:var(--ink2); }
.io li b { color:var(--ink); width:26px; text-align:right; flex:0 0 auto; }
.io li.sum { border-top:1px solid var(--line); margin-top:var(--sp-2);
  padding-top:var(--sp-2); color:var(--ink); font-weight:var(--w-bold); }

/* A wire carries numbers. Blue, and only ever blue. */
.wire { position:relative; height:2px; background:var(--s1); min-width:44px; }
.wire::after { content:""; position:absolute; right:-1px; top:-4px;
  border-left:9px solid var(--s1); border-top:5px solid transparent;
  border-bottom:5px solid transparent; }
.wire em { position:absolute; top:-22px; left:50%; transform:translateX(-50%);
  font-family:var(--mono); font-size:var(--t-cap); letter-spacing:.1em;
  text-transform:uppercase; color:var(--s1); font-style:normal; white-space:nowrap; }

/* Decided, not yet fitted. Dashed and unlit on purpose: blue means a live signal
   on this page, so drawing a solid wire to a sensor nobody has soldered would be
   a lie in the page's own language. */
.planned { margin-top:var(--sp-4); border:1px dashed var(--line);
  border-radius:var(--r); padding:var(--sp-3) 11px; }
.planned .io li { color:var(--muted); }
.planned .io li b { color:var(--ink2); }
.planned .tot { display:flex; justify-content:space-between; align-items:baseline;
  gap:var(--sp-3); border-top:1px solid var(--line); margin-top:var(--sp-3);
  padding-top:var(--sp-3); font-family:var(--mono); font-size:var(--t-mark);
  color:var(--muted); }
.planned .tot b { font-size:var(--t-head); font-weight:var(--w-bold); color:var(--ink);
  letter-spacing:-.02em; }

/* -- 2. the reward tables: sign, term, weight -- */
table.pts td { padding:3px 11px 3px 0; }
table.pts .s { font-family:var(--mono); width:14px; font-weight:var(--w-bold); }
table.pts .w { text-align:right; font-family:var(--mono); color:var(--muted);
  white-space:nowrap; }

/* -- 3. the file split, and the kinds that are not files -- */
.files { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:var(--sp-3); }
.file { border:1px solid var(--line); border-radius:var(--r);
  padding:var(--sp-3) 11px; background:var(--surface2); }
.file .id { font-family:var(--mono); font-size:var(--t-data);
  font-weight:var(--w-bold); color:var(--s1); }
.file h4 { margin:3px 0 2px; font-size:var(--t-body); letter-spacing:-.01em; }
.file p { font-size:var(--t-data); color:var(--ink2); margin:0 0 var(--sp-2);
  line-height:1.45; }

.notfiles { list-style:none; margin:var(--sp-3) 0 0; padding:0; }
.notfiles li { display:grid; grid-template-columns:46px 1fr; gap:var(--sp-3);
  padding:var(--sp-2) 0; border-top:1px solid var(--line); font-size:var(--t-data); }
.notfiles li .k { font-family:var(--mono); font-size:var(--t-mark);
  color:var(--muted); padding-top:1px; }
.notfiles li span { color:var(--ink2); }
.notfiles li b { color:var(--ink); }

/* -- 4. the sampled command box: one dimension line per axis --
   `.axtrack`, not `.track`: page.css owns `.track` as the log-scale
   distance-to-bar axis used on three pages. This is a linear interval on a
   ruled ground, which is a different drawing making a different claim. */
.axis { margin-bottom:var(--sp-5); }
.axis:last-child { margin-bottom:0; }
.axis .hd { display:flex; align-items:baseline; gap:var(--sp-3);
  margin-bottom:var(--sp-2); }
.axis .hd b { font-size:var(--t-body); }
.axis .hd span { font-family:var(--mono); font-size:var(--t-mark); color:var(--muted); }
.axtrack { position:relative; height:22px; border-radius:var(--r-sm);
  background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 9px);
  border:1px solid var(--line); }
.axtrack .span { position:absolute; top:-1px; bottom:-1px; border-radius:var(--r-sm);
  background:color-mix(in srgb,var(--s1) 26%,transparent); border:1px solid var(--s1); }
.axtrack .zero { position:absolute; top:-4px; bottom:-4px; width:1px;
  background:var(--muted); }
.axtrack .pin { position:absolute; top:50%; width:9px; height:9px; margin:-5px 0 0 -5px;
  border-radius:50%; background:var(--crit); box-shadow:0 0 0 3px var(--surface); }
.axis .ends { display:flex; justify-content:space-between; margin-top:var(--sp-1);
  font-family:var(--mono); font-size:var(--t-mark); color:var(--muted); }

/* -- 5. sim | real, one file spanning the divide -- */
.mirror { position:relative; display:grid; grid-template-columns:1fr 1fr; gap:0;
  border:1px solid var(--line); border-radius:var(--r); overflow:hidden;
  min-width:560px; }
.mirror > div { padding:var(--sp-4) 11px 62px; }
.mirror > div + div { border-left:1px dashed var(--line); }
.mirror h4 { font-family:var(--mono); font-size:var(--t-cap); letter-spacing:.12em;
  text-transform:uppercase; margin:0 0 var(--sp-3); font-weight:var(--w-bold); }
.mirror .l { color:var(--muted); }
.mirror .bridge { position:absolute; left:50%; bottom:var(--sp-3);
  transform:translateX(-50%); background:var(--surface2); border:2px solid var(--s1);
  border-radius:var(--r); padding:var(--sp-2) var(--sp-5); text-align:center;
  white-space:nowrap; }
.mirror .bridge b { display:block; font-size:var(--t-body); letter-spacing:-.01em; }
.mirror .bridge span { font-family:var(--mono); font-size:var(--t-cap);
  color:var(--s1); letter-spacing:.1em; text-transform:uppercase; }

/* -- 6. a criterion against its bar.
   `.gauge` and not `.bar`: page.css owns `.bar` as a 6px progress pill, and the
   two collided - a 6px `overflow:hidden` wrapper clipped the whole drawing. -- */
.gauge { margin-bottom:var(--sp-3); }
.gauge:last-child { margin-bottom:0; }
.gauge .hd { display:flex; align-items:baseline; gap:var(--sp-2); margin-bottom:var(--sp-1); }
.gauge .hd b { font-size:var(--t-body); flex:1; }
.gauge .hd .v { font-family:var(--mono); font-size:var(--t-data);
  font-weight:var(--w-bold); }
.gauge .rail { height:7px; border-radius:var(--r-pill); background:var(--line);
  overflow:hidden; }
.gauge .rail i { display:block; height:100%; border-radius:var(--r-pill); }
.gauge .miss { font-size:var(--t-mark); color:var(--muted); margin-top:3px; }
</style>
</head><body>
<div id="nav"></div>
<main class="sheet" id="sheet"><p class="muted" style="padding:60px 0">Loading&hellip;</p></main>

<script src="/page.js"></script>
<script>
get("/api/state").then(s => {

mountNav("/summary", navState(s.nav));

const obs   = s.observation || {};
const axes  = (s.sampling || {}).axes || [];
const cmds  = ((s.sampling || {}).headline || {}).commands || "â€”";
const envs  = ((s.sampling || {}).headline || {}).envs || "â€”";
const lib   = s.library || {};
const drive = s.driven || {};
const batch = s.batch || {};
const walk  = ((s.rewards || {}).tasks || []).find(t => t.key === "walk") || {terms: []};
const status = s.status || {};
const head  = status.headline || {};
const r1    = (status.tasks || []).find(t => t.id === "R1");

/* How many training runs there are. R3 is filed `parked` now, so this is 2 and
   not 3 - which is why no sentence on this page writes the number itself. */
const files = (lib.runs || []).length;

/* A page that white-screens because one field is missing is worse than a page
   with a gap in it. This one is served by summary_state(), and server.py is NOT
   in the dashboard's hot-reload list - so an older server process answers with
   an older shape and every new plate reads undefined. Say that, rather than
   throwing. */
const stale = !s.observation || !s.status || !s.sampling;

/* ------------------------------------------------------------------ 1 ---- */
const chain = () => `
  <div class="dwg">
    <div class="cap">the policy &middot; one file</div>
    <div class="chain">
      <div class="node">
        <h4>what it senses</h4>
        <ul class="io">
          ${(obs.terms || []).map(t =>
            `<li><b>${t.n}</b> ${esc(t.note)}</li>`).join("")}
          <li class="sum"><b>${obs.total || 0}</b> numbers in</li>
        </ul>
      </div>
      <div class="wire"><em>in</em></div>
      <div class="node core">
        <h4>the policy</h4>
        <div class="big">${obs.total || 0} &rarr; 12</div>
        <p class="mono" style="font-size:11.5px;color:var(--ink2);margin:10px 0 0">
          ~300 KB of numbers.<br>No motion library.<br>No inverse kinematics.</p>
      </div>
      <div class="wire"><em>out</em></div>
      <div class="node">
        <h4>what it moves</h4>
        <div class="big">12<small>joint angles</small></div>
        <p class="mono" style="font-size:11.5px;color:var(--ink2);margin:10px 0 0">
          one set every 20 ms.<br>The servo PWM period<br>sets that limit.</p>
      </div>
    </div>
    ${batch.added ? `<div class="planned">
      <div class="cap">decided, not yet fitted &middot; gray/config/sensors.yaml</div>
      <ul class="io">
        ${(batch.rows || []).map(r =>
          `<li><b>+${r.adds}</b> ${esc(r.name)}</li>`).join("")}
      </ul>
      <div class="tot">
        <span>${obs.total || 0} now &nbsp;+&nbsp; ${batch.added} from
          ${batch.sensors} sensors &nbsp;=</span>
        <b>${batch.after} inputs</b></div>
    </div>
    <div class="foot">The dashed block is not in any trained policy. Adding it
      changes how many inputs the file takes, which makes it a different file,
      so all ${batch.sensors} go in together in one retrain rather than one at a
      time. <a class="plain" href="/train#sensors">The full sensor list
      &rarr;</a></div>` : ""}
    <div class="foot">These exact inputs have not occurred before. Section 4
      covers why that still works.</div>
  </div>`;

/* ------------------------------------------------------------------ 2 ---- */
const earn = walk.terms.filter(t => t.sign === "+");
const lose = walk.terms.filter(t => t.sign === "-");
const ptrow = (t) => `<tr>
  <td class="s" style="color:${t.sign === "+" ? "var(--good)" : "var(--crit)"}">${t.sign}</td>
  <td><b>${esc(t.label)}</b></td>
  <td class="w">${t.weight}</td></tr>`;

/* ------------------------------------------------------------------ 4 ---- */
const track = (a) => {
  // Domain is symmetric and wider than the sampled span, so an axis that never
  // goes negative LOOKS like one. That asymmetry is the finding, and a dimension
  // line is what shows it: the extent is drawn where it sits on the scale, not
  // filled from zero.
  const dom = Math.max(Math.abs(a.lo), Math.abs(a.hi)) * 1.6;
  const pc  = (v) => 50 + 50 * v / dom;
  const lo = pc(a.lo), hi = pc(a.hi);
  const asked = drive.cases ? drive.cases
    .filter(c => c.went_nowhere && a.axis === "forward")
    .map(c => c.commanded.vx) : [];
  const spans = a.lo <= 0 && a.hi >= 0;
  return `<div class="axis">
    <div class="hd"><b>${esc(a.axis)}</b>
      <span>${esc(a.const)} = (${a.lo}, ${a.hi}) ${esc(a.unit)}</span>
      ${spans ? "" : `<span style="color:var(--warn)">does not contain zero</span>`}</div>
    <div class="dim">
      <div class="ground"></div>
      <div class="zero" style="left:50%"><b>0</b></div>
      <div class="wit" style="left:${lo.toFixed(2)}%"></div>
      <div class="wit" style="left:${hi.toFixed(2)}%"></div>
      <div class="ext" style="left:${lo.toFixed(2)}%;width:${(hi - lo).toFixed(2)}%"></div>
      <div class="val" style="left:${((lo + hi) / 2).toFixed(2)}%">${a.lo} to ${a.hi} ${esc(a.unit)}</div>
      ${asked.map(v => `<div class="pin" style="left:${pc(v).toFixed(2)}%"
        title="asked for ${v} ${esc(a.unit)}, and it stood still"></div>`).join("")}
      <div class="ends"><span>${(-dom).toFixed(2)}</span><span>+${dom.toFixed(2)}</span></div>
    </div>
  </div>`;
};

/* ------------------------------------------------------------------ 6 ---- */
/* Counted from the data, never typed. This paragraph said "walking fails on one
   of six criteria" for as long as there had been eleven of them - the five for
   crabbing and turning arrived on 4 Aug 2026 and the sentence did not move. A
   count in prose is a count that goes stale in silence. */
const r1Judged = r1 ? r1.criteria.filter(c => c.best != null && c.bar != null).length : 0;
const r1Met = r1 ? r1.criteria.filter(c => c.best != null && c.bar != null &&
  (c.better === "lower" ? c.best <= c.bar : c.best >= c.bar)).length : 0;
/* Worst first. The reading order of "which one is furthest away" is the answer
   to it, so the sort IS part of the answer. */
const r1Sorted = r1 ? [...r1.criteria].sort((a, b) => {
  const r = (c) => c.bar == null || c.best == null ? Infinity
    : (c.better === "lower" ? (c.best ? c.bar / c.best : Infinity)
                            : (c.bar ? c.best / c.bar : Infinity));
  return r(a) - r(b);
}) : [];
/* The criterion nearest its bar, read off the sorted list rather than named in a
   sentence. The paragraph under this panel used to say "round 0 finished about
   20 degrees off the line, the bar is 4 degrees" - true when it was written, and
   still on the page beside a table that now reads 2.6 degrees and `met`. A page
   that argues with itself is worse than a page that says less. */
const worst = r1Sorted.find(c => c.best != null && c.bar != null) || null;
/* The measured spread on a straight-ahead command, read off plan.driven() rather
   than typed. It said "-7 to +18 degrees" beside the live case table it was
   describing, and the two could disagree without either looking wrong. The
   sentence simply drops its second half when the run has not been driven. */
const spread = (drive.cases || []).find(c =>
  c.lo_deg != null && c.hi_deg != null &&
  c.commanded && !c.commanded.vy && !c.commanded.wz) || null;

/* ONE instrument, not eleven meters.

   Each criterion used to get its own 0-100% rail. Eleven rails, eleven scales,
   and no two of them comparable: a rail 80% full for uprightness and a rail 80%
   full for drift say nothing about each other, because each was normalised
   against its own bar. So the panel could not answer the question it existed
   for - which one is furthest away.

   This is `.track` from page.css, the same log axis the Now page and the Runs
   page use: 0.1x to 100x with the bar fixed a third across. Every row is on the
   SAME scale, so the column of markers reads as a single picture, and a
   criterion fourteen times over its bar sits fourteen times further out instead
   of pinning a rail to empty.

   Sorted worst first, because that is the reading order of the question. */
const barRow = (c) => {
  const better = c.better === "lower";
  const best = c.best;
  if (best == null || c.bar == null) return "";
  // The same ratio progress.py computes: 1.0 at the bar, above 1.0 passing, in
  // both directions. `trackPos` turns it into a position on the log axis.
  const ratio = better ? (best ? c.bar / best : null) : (c.bar ? best / c.bar : null);
  const met = better ? best <= c.bar : best >= c.bar;
  const at = trackPos(ratio);
  return `<tr>
    <td><b>${esc(c.name)}</b></td>
    <td class="n">${value(best, c.unit)}</td>
    <td class="n faint">${better ? "≤" : "≥"} ${value(c.bar, c.unit)}</td>
    <td style="min-width:160px">${at === null
      ? `<span class="faint">no scale</span>`
      : `<div class="track"><div class="ax"></div>
           <div class="tick" style="left:33.3%"></div>
           <span class="dot ${met ? "ok" : "bad"}" style="left:${at}%"></span></div>`}</td>
    <td class="n ${met ? "" : "small"}" style="color:${met ? "var(--good)" : "var(--crit)"}">${
      met ? "met" : ratio ? `${(1 / ratio).toFixed(1)}× over` : "failing"}</td>
  </tr>`;
};

/* ------------------------------------------------------------------------ */
document.getElementById("sheet").innerHTML = `

${stale ? `<div class="note bad" style="max-width:none;margin:26px 0 0">

    <span class="mono">run.bat</span></p></div>` : ""}

${titleblock([

  { k: "in / out", v: `${obs.total || 0} → 12 at 50 Hz` },
  { k: "library", v: `${lib.total || 0} rows${

<div class="sheethead">

    <div class="legs"><span>numbers in</span><span>joint angles out</span>
      <span>50 Hz, and the servos set that</span></div>
    <div class="rule"></div>
    <div class="says">No motion library. No inverse kinematics. No keyframes.

  </div>
  <div class="spec" id="hero-spec"><div class="cap">the machine, measured</div></div>
</div>

<header class="plate" style="padding-top:0;border-bottom:0">
  <p class="lede">${esc(s.goal.one_line)} Six plates: what gets deployed, how it

</header>

<section class="plate">
  <header><div class="secnum">01</div><div>

  </div></header>
  ${chain()}
  <div class="note key"><b>It is not a stored motion.</b>
    <p>No library of movements, no keyframes, no inverse kinematics at runtime.

</section>

<section class="plate">
  <header><div class="secnum">02</div><div>
    <h2>How it is trained</h2>
    <p>Joint angles cannot be written by hand for every situation. Instead the
      <b>reward</b> is written by hand: ${walk.terms.length} terms, each scoring
      one thing about the step just taken. They are added up.</p>
  </div></header>
  <div class="split">
    <div class="dwg">
      <div class="cap">R1 reward &middot; read from gray/tasks/</div>
      <div class="split" style="gap:22px">

      </div>

    </div>
    <div class="prose">
      <p>${envs} robots run at once, each with its own random command and its own

      <p>All ${envs} robots feed one update to one function.</p>
      <div class="note bad"><b>Training does not change the reward.</b>
        <p>The reward is an input. It changes when someone edits the file and at

    </div>
  </div>
</section>

<section class="plate">
  <header><div class="secnum">03</div><div>
    <h2>Why there are ${files} files</h2>
    <p>Two skills share a file if they share a reward function. Walking sideways

  <div class="split">

<section class="plate">
  <header><div class="secnum">05</div><div>
    <h2>Running on the real robot</h2>

      ${obs.total || 0} inputs come from sensors instead of the simulator.</p>
  </div></header>
  <div class="dwg">
    <div class="cap">same file, both sides</div>
    <div class="mirror">
      <div>
        <h4 class="l">in simulation</h4>
        <ul class="io">
          <li><b>&rarr;</b> MuJoCo computes the physics</li>
          <li><b>&rarr;</b> perfect joint angles, perfect gravity</li>
          <li><b>&rarr;</b> ${envs} robots at once</li>
          <li><b>&larr;</b> twelve angles go to simulated joints</li>

        <h4 style="color:var(--good)">on the real robot</h4>

          <li><b>&rarr;</b> three IMUs on the trunk</li>
          <li><b>&rarr;</b> twelve potentiometers through an ADC</li>

<section class="plate">

          <th class="n">bar</th>

              <span>100&times;</span></div></th><th class="n"></th></tr>

        : `<p class="muted">Not measured yet.</p>`}

      <p>Driven with a held command over 64 robots, the average obeys: left when

`;

/* The machine, fetched after the sheet is drawn rather than with it.

   It is a MuJoCo render, and the /robot page pays for it once - poser caches the

   renderer to say anything, and so a machine with no MuJoCo still gets the whole

   honest answer: no drawing, rather than a drawing of nothing. */
get("/api/robot/frame").then(d => {
  const box = document.getElementById("hero-shot");
  if (!box || !d || !d.png) return;
  box.insertAdjacentHTML("beforeend",
    `<img src="data:image/png;base64,${d.png}"
          alt="Gray standing in the pose every task starts from">`);
}).catch(() => { /* no render available; the caption already says what is missing */ });

/* The machine's own numbers, from the same endpoint the Robot page reads. Every
   one of them is measured off the model or stated in gray/config/robot.yaml, so
   nothing here is typed into this page - including the 50 Hz, which is not a
   choice anybody made but the servo PWM period, 20 ms, seen from the other end. */
get("/api/stage/1").then(d => {
  const box = document.getElementById("hero-spec");
  if (!box || !d || !(d.facts || []).length) return;
  box.insertAdjacentHTML("beforeend", d.facts.map(f => `

      <div class="v">${esc(f.v)}</div>
      <div class="n">${esc(f.n || "")}</div></div>`).join(""));
}).catch(() => { /* the caption stands alone rather than showing invented numbers */ });

}).catch(fail);
</script>

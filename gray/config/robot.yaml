# ---------------------------------------------------------------------------
# HARDWARE NOTES  (from build photos in Overview/, confirmed 2026-08-01)
# ---------------------------------------------------------------------------
transmission:
  # The knee is NOT direct-drive. A DS3218 mounted on the THIGH drives the shank
  # through a ball-jointed metal pushrod (visible in Overview/photo_2022-09-18_
  # 12-46-38.jpg and RObot_from_angle.JPG). Consequences:
  #
  #  SIM  - harmless. The kinematic tree is still hip -> thigh -> shank with
  #         revolute joints, which is what sim/models/gray.xml encodes. A four-bar
  #         linkage driving a hinge still produces a hinge.
  #  REAL - matters a lot. Servo angle != knee angle; the mapping is nonlinear in
  #         the linkage geometry, and the linkage changes effective torque and
  #         speed at the knee versus the servo's rated 1.96 N.m / 6.54 rad/s.
  #
  # ACTION (Phase 4): measure the linkage geometry on the real robot and fit
  # servo_angle -> joint_angle per leg. Until then the sim assumes 1:1, which is
  # fine for developing the gait and training, but MUST be corrected before any
  # policy is deployed or the robot will not reach commanded joint angles.
  knee: pushrod_linkage
  hip_pitch: pushrod_linkage   # verify - photos suggest the same arrangement
  abduction: direct            # body-mounted, appears direct-coupled
  calibrated: false

servo_placement:
  # Confirmed against build photos - matches the assumption in estimate_masses.py.
  base_link: 4    # abduction, body-mounted
  hip: 4          # hip pitch, at the shoulder
  thigh: 4        # knee, mid-thigh, driving the pushrod
  shank: 0        # no actuator on the shank - good for swing inertia

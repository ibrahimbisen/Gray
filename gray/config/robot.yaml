# Gray - the numbers that describe the real robot.
#
# This file exists because the SolidWorks URDF exporter cannot be trusted with
# mass. It ignores a component's overridden mass and writes the part's volume in
# cm3 instead, which is the same as assuming everything is made of water. Every
# mass in a raw export is wrong by whatever the real density is.
#
# tools/prepare_model.py reads this and corrects the export.

mass:
  # Built up from known part weights, 3 Aug 2026. NOT scale readings - see
  # `measured: false`. Replace each line with a real number during reassembly.
  #
  # Why the CAD numbers were dropped. The exported meshes were measured against
  # the CAD masses and two separate faults showed up, pulling opposite ways:
  #
  #   part       mesh volume   CAD mass   implied density   separate shells
  #   thigh        73.91 cm3    75.51 g      1.022 g/cm3           1
  #   calf         46.36 cm3    47.43 g      1.023 g/cm3           3
  #   hip          96.47 cm3   172.07 g      1.784 g/cm3          85
  #   base_link   799.94 cm3  1198.66 g      1.498 g/cm3         551
  #
  # 1. Thigh and calf come out at almost exactly 1.0 g/cm3 - water. That is the
  #    SolidWorks exporter writing volume in cm3 into the mass field, so those
  #    two numbers are not masses at all.
  # 2. Hip and base_link are denser than water and split into 85 and 551 closed
  #    bodies, so those DO contain servos and fasteners as real geometry. But
  #    their printed plastic is still costed at solid density, and a part printed
  #    at 20-25% infill weighs roughly 45% of solid.
  #
  # WHERE THE SERVOS ARE - stated by the owner, 3 Aug 2026. Not inferred.
  #
  #   4 embedded in the body      - one per leg, these swing the hip out and in
  #   2 in each hip module (x4=8) - one drives the thigh, one drives the calf
  #   0 in the thigh              - it carries only the threaded pushrod and its
  #                                 ball joints, which run its full length
  #   0 in the calf
  #
  # So the calf is driven from the hip module through a rod that spans the whole
  # thigh. That is the pushrod linkage in CLAUDE.md, and it is why the calf can
  # be light while the hip is heavy.
  #
  # This split matters more than the total does. Two earlier versions of this
  # file got it wrong in opposite directions - one put a knee servo on each
  # thigh (legs came out 67% of the robot), one read the photos as 8 servos in
  # the body (42%). The truth is 55%. Leg mass is what a swing costs and what a
  # shove has to arrest, so a wrong split is worse than a wrong total.
  units: g
  measured: false
  # 1984 = 914 original + 840 net payload + 230 margin. See `payload_g` below.
  # Rounded UP to a 3100 g total on the owner's instruction: it is far easier to
  # shave mass off a model later than to discover the real robot is heavier than
  # everything was trained against. Being 200 g pessimistic costs a little
  # performance; being 200 g optimistic costs a retrain.
  trunk: 1984.0      # base_link, holds 4 of the 12 servos AND the whole payload
  hip: 165.0         # 4 off, TWO servos each - thigh drive and calf drive
  thigh: 65.0        # 4 off, no servo - printed arm plus a pushrod
  calf: 49.0         # 4 off, no servo
  total_expected: 3100.0

  # Every line above, itemised. These are the numbers to argue with.
  breakdown:
    plastic:
      material: PLA
      density_g_cm3: 1.24
      infill_pct: 22
      # Fraction of solid weight an FDM part actually comes out at, once
      # perimeters and solid top/bottom layers are counted. Infill alone would
      # say 0.22; perimeters dominate on parts this size.
      solid_fraction: 0.45
    known_parts_g:
      servo_ds3218mg: 60      # x12 = 720 g. Datasheet, and the single biggest item.
      raspberry_pi_4: 46
      pca9685: 10
      imu_mpu6050: 3          # x3 = 9 g, front / middle / back
      adc_ads1115: 5          # x3 = 15 g, 12 channels of pot
      pot_rotary: 8           # x8 = 64 g
      pot_linear: 15          # x4 = 60 g
      wiring_and_connectors: 120
      fasteners_bearings_pushrods: 140

    # THE PAYLOAD. Owner's spec, 3 Aug 2026. None of it is in the CAD yet, so it
    # is added to the trunk as a single lump - the owner's instruction was
    # explicitly "just add the weight to the main body, I will distribute it when
    # I design it". That is honest for now and wrong later: a battery under the
    # trunk and a Jetson on top are not the same as 840 g at the trunk's centre,
    # and the difference shows up in roll inertia. Redistribute when the mounts
    # are modelled.
    #
    # Why the total is not simply +1040: the original 914 g trunk already carried
    # a 200 g 3S LiPo, and the 18650 pack replaces it rather than joining it.
    payload_g:
      cell_18650_2000mah: 45       # x12 in 3S4P = 540 g. 89 Wh, about 1.5 h walking.
      jetson_orin_nano_devkit: 250  # dev kit, so carrier board and cooling included
      cameras: 50                   # 5 small modules plus ribbon
      unallocated: 200              # the owner's "couple of other things"
      gross_added: 1040
      lipo_removed: -200            # battery_3s_lipo, superseded by the 18650 pack
      margin: 230                   # owner's call: round the total up to 3100 g
      net_added_to_trunk: 1070

    # What the payload costs, so it is not a surprise later:
    #   total          2030 g -> 3100 g, +53%
    #   worst joint    0.47 -> 0.72 N-m of 1.96 available
    #   torque margin  4.18x -> 2.73x. Still holds itself up comfortably.
    #   leg fraction   55% -> 36%. This is the good news: every gram lands on the
    #                  trunk, so legs get RELATIVELY lighter, and leg mass is what
    #                  a swing costs and what a shove has to arrest.
    # The cost lands on dynamics and servo speed under load, not on standing up.
    #
    # Training randomises mass around this, so the exact figure matters less than
    # the band containing the truth. Pessimistic-and-wide is the safe direction.
    per_link:
      calf:  "26 printed + 15 linear pot + 8 rod end = 49"
      thigh: "41 printed + 18 pushrod and ball joints + 6 fasteners = 65"
      hip:   "17 printed (hex lattice, light) + 120 two servos + 16 two rotary pots + 12 fasteners = 165"
      trunk: "234 printed + 240 four servos + 46 Pi + 10 PCA9685 + 9 IMUs + 15 ADCs + 120 wiring + 40 fasteners = 714 structural, + 1040 payload + 230 margin = 1984"

    # Cross-check, against the PRE-PAYLOAD trunk of 914 g (714 structural plus the
    # 200 g LiPo that was in the budget then). The payload is not in the CAD, so
    # it cannot appear in a CAD cross-check.
    # SolidWorks reported the trunk at
    # 1198.66 g with its plastic costed at solid density. Our trunk frame is
    # ~520 cm3 of solid PLA = 645 g solid, but 234 g printed at 22% infill - a
    # difference of 286 g. 914 + 286 = 1200 g, against the CAD's 1198.66. The
    # hip lands at 165 g against the CAD's 172.07. Two independent routes to the
    # same numbers, so the remaining disagreement is the infill correction and
    # nothing else.

  # What would settle this, in order of how much it is worth:
  #   1. Weigh one calf, one thigh, one hip. Checks the split, which is what leg
  #      inertia depends on - and the split is the part that has already been
  #      wrong once.
  #   2. Weigh the whole assembled robot. One number, checks the total.
  #   3. Weigh the trunk with electronics and battery in it.
  # Anything measured replaces the estimate and `measured` goes true.

servo:
  # 12x DS3218MG on a PCA9685 over I2C.
  model: DS3218MG
  count: 12
  stall_torque_nm: 1.96      # 20 kg-cm at 6.8 V
  no_load_speed_rad_s: 6.54  # 0.16 s per 60 degrees at 6.8 V
  travel_deg: 270
  control_hz: 50             # hard ceiling: the PWM period is 20 ms

  # How hard the servo pulls toward the angle it was told to hold, and how much
  # it resists being moved. A hobby servo's internal controller is sealed and
  # these numbers are not published, so they are a starting point, not a
  # measurement. Everything the robot learns depends on them, so they get checked
  # against the real servo before any policy goes near hardware.
  #
  # kp is set so the joint carrying the most weight at ride height - 0.55 N-m -
  # sags about 1.5 degrees under load, which is roughly what these servos do.
  kp: 21.0                   # N-m per radian of error
  kv: 0.6                    # N-m per rad/s, the damping
  armature: 0.003            # the gear train's own inertia, seen at the joint
  frictionloss: 0.01         # stiction in the gearbox
  damping: 0.05              # viscous drag in the joint itself
  gains_measured: false      # replace kp/kv once the real servo can be tested

feedback:
  # Potentiometers the owner is fitting - rotary on the rotating joints, linear
  # on the knee pushrod. Analog, so the Raspberry Pi needs an external ADC.
  type: potentiometer
  channels: 12
  calibrated: false          # raw ADC counts -> radians, per joint, not yet measured

stance:
  # THE STANDING POSE. Chosen by the owner in the pose editor, 3 Aug 2026, and
  # written down here by hand. Everything starts from it: every task spawns the
  # robot in this pose, `ride_height` scores the trunk against the height it
  # produces, and `posture` scores the joints against these angles.
  #
  # It is stated rather than solved. find_stance.py used to solve for a pose that
  # put each foot straight under its own hip; that pose is still worked out and
  # printed for comparison, but it is no longer what the robot trains in.
  #
  # Why the owner's pose won. The solved pose planted the feet directly below the
  # hips, and the centre of mass does not sit above the hips - it is 35 mm
  # forward of the middle of the footprint. So the robot stood on a square its own
  # weight was not centred in, with 106 mm of lean available forwards and 175 mm
  # backwards. Sliding the feet forward and outward moves the square under the
  # weight and widens it:
  #
  #                          solved pose      this pose
  #   worst lean margin         94.6 mm        106.0 mm      + 12%
  #   tip angle                   26.4 deg       28.4 deg
  #   footprint, side-side     189.4 mm        217.6 mm      + 28 mm
  #   trunk height             194.3 mm        202.4 mm
  #
  # The lean margin is how far the centre of mass can travel before it leaves the
  # square the four feet make. That is what "stands still without working at it"
  # means, and the owner's pose is better at it in every direction at once.
  #
  # WHAT IT COSTS, stated plainly. The legs are raked forward, so the lever from
  # each foot back to its knee is longer and the knee has to hold more:
  #
  #   worst holding torque      0.72 N-m       1.08 N-m
  #   margin to the 1.96 N-m stall   2.74x        1.82x
  #
  # 1.82x still holds the robot up with room to spare, but the knee servos now
  # sit at 55% of stall just standing there, and a servo held at 55% of stall gets
  # hot. If they cook during a long stand, the first thing to try is thigh +20
  # instead of +27: it keeps the footprint and drops the worst joint to 0.98 N-m.
  #
  # Degrees away from the sitting pose, in the pose editor's convention:
  #   hip   + swings the leg OUT      thigh + swings it FORWARD    calf + lifts the foot
  angles_deg:
    fr_hip:  0.0
    fr_thigh: 27.0
    fr_calf: -45.0
    fl_hip:  0.0
    fl_thigh: 27.0
    fl_calf: -45.0
    br_hip:  0.0
    br_thigh: 27.0
    br_calf: -45.0
    bl_hip:  0.0
    bl_thigh: 27.0
    bl_calf: -45.0
  chosen_by: owner, in the pose editor, 3 Aug 2026

  # The owner drove the model to its tallest standing pose in the pose editor on
  # 2 Aug 2026 and read 273.8 mm off it.
  max_height_m: 0.2738

  # Inputs to the solved pose only, kept so the comparison above can be
  # reproduced. They do not affect what the robot trains in.
  ride_drop: 0.30            # ride at 70% of full height -> 191.7 mm
  foot_outboard_mm: 34.0     # each foot this far outboard of its own hip

joint_limits:
  measured: true
  source: measured in the pose editor against the CAD
  units: deg
  convention:
    hip: + swings the leg OUT, away from the body
    thigh: + swings the leg FORWARD, towards the nose
    calf: + lifts the foot UP
  hip:
  - -65.0
  - 40.0
  thigh:
  - -35.0
  - 45.0
  calf:
  - -85.0
  - 1.0
  notes:
    knee_pose_exceeds_stop_by_deg: 3
    hip_inward_self_collision_deg: -28

# Gray - the numbers that describe the real robot.
#
# This file exists because the SolidWorks URDF exporter cannot be trusted with
# mass. It ignores a component's overridden mass and writes the part's volume in
# cm3 instead, which is the same as assuming everything is made of water. Every
# mass in a raw export is wrong by whatever the real density is.
#
# tools/prepare_model.py reads this and corrects the export.

mass:
  # Source: SolidWorks mass properties, 2 Aug 2026, taken per component.
  # These four add up to 2378.70 g, which is exactly what SolidWorks reports for
  # the whole assembly - so nothing is missing and nothing is counted twice.
  #
  # They are still CAD numbers, not scale readings. Weigh the real parts during
  # reassembly and replace them.
  units: g
  trunk: 1198.66     # Main Body Assembly, includes electronics and battery
  hip: 172.07        # "right hip" and "HIp Part", 4 off
  thigh: 75.51       # Left_Thigh and Right_Thigh, 4 off
  calf: 47.43        # "calves", 4 off
  total_expected: 2378.70

servo:
  # 12x DS3218MG on a PCA9685 over I2C.
  model: DS3218MG
  count: 12
  stall_torque_nm: 1.96      # 20 kg-cm at 6.8 V
  no_load_speed_rad_s: 6.54  # 0.16 s per 60 degrees at 6.8 V
  travel_deg: 270
  control_hz: 50             # hard ceiling: the PWM period is 20 ms

feedback:
  # Potentiometers the owner is fitting - rotary on the rotating joints, linear
  # on the knee pushrod. Analog, so the Raspberry Pi needs an external ADC.
  type: potentiometer
  channels: 12
  calibrated: false          # raw ADC counts -> radians, per joint, not yet measured

joint_limits:
  # Where the assembled machine physically runs out of travel. Stated by the owner
  # on 2 Aug 2026 from knowledge of the real robot, recovered from the previous
  # attempt (git tag archive/attempt-1, reference/POSES.md).
  #
  # These are HARDWARE stops and cannot be derived from the CAD. Against the
  # DS3218MG's own 270 degrees they use 64%, 37% and 29% - so a model given the
  # servo's full sweep, as the last one was, lets the legs go places the robot
  # cannot.
  #
  # The signs are PHYSICAL, not raw joint angles. The legs are mirrored, so the
  # same physical motion is a positive rotation on one leg and a negative one on
  # its opposite number. tools/prepare_model.py works out the per-joint sign from
  # the model's own geometry and writes the twelve raw ranges.
  measured: true
  source: "owner, 2 Aug 2026, from the assembled machine"
  units: deg
  convention:
    hip: "+ swings the leg OUT, away from the body"
    thigh: "+ swings the leg FORWARD, towards the nose"
    calf: "+ lifts the foot UP"
  hip: [-82, 92]     # 174 deg of travel
  thigh: [-35, 65]   # 100 deg
  calf: [-40, 39]    #  79 deg

  # Two things the owner recorded rather than quietly resolved:
  #
  # 1. The "standing, max height" pose uses a knee of -43, three degrees past the
  #    stated -40 stop. Honouring -40 costs 5 mm of trunk height.
  # 2. The hip limit is not one number. Swinging the hips inward with the legs
  #    hanging straight, the two front feet collide at -28 - long before -82.
  #    Reaching -82 needs the legs folded out of each other's way. Outward is
  #    clear all the way past +92, so +92 is the hardware, not the geometry.
  notes:
    knee_pose_exceeds_stop_by_deg: 3
    hip_inward_self_collision_deg: -28

# What Gray can be given to sense, and what each addition actually costs.
#
# Written 3 Aug 2026, after the owner's question: "we are adding cameras and
# sensors, so why is anything blocked?"
#
# ---------------------------------------------------------------------------
# THE RULE THAT ORDERS THIS WHOLE FILE
#
# A sensor is only useful to a trained policy if the SIMULATOR can produce a
# believable fake of it. The policy learns entirely in simulation. If the sim
# cannot generate the reading, the policy never sees it during training, and a
# reading it has never seen is noise on the real robot - worse than nothing,
# because it displaces a number that meant something.
#
# So every sensor here is judged on three separate costs, and they are not the
# same cost:
#
#   1. FIT IT      - money, mass, wiring, a board. Usually the smallest cost.
#   2. FAKE IT     - what the simulator has to compute, for every robot, every
#                    step, 4500 x 50 times a second. This is where a camera
#                    becomes expensive and a contact switch stays free.
#   3. TRUST IT    - how far the fake is from the real thing. A perfect
#                    simulated heightmap against a noisy 30 Hz depth camera
#                    full of holes is the hardest gap in the field.
#
# And one more, which applies to every row without exception:
#
#   4. ANY sensor added to the observation changes the length of the policy's
#      input list. That makes it a different policy. Every existing policy
#      file becomes unreadable and every run restarts from zero. So sensors
#      are added in BATCHES, at a deliberate moment - never one at a time.
#
# ---------------------------------------------------------------------------
# HONESTY NOTE ON PART NUMBERS
#
# Part numbers below are examples of the CLASS of device, chosen because they
# are common and cheap. Their specs are approximate and have NOT been checked
# against a datasheet. Confirm mass, current draw and update rate against the
# part actually bought. `spec_checked: false` marks every one of these.
# ---------------------------------------------------------------------------

# What the policy reads today. 45 numbers, and nothing else reaches it.
# Source: gray/tasks/stand_env_cfg.py, the "policy" observation group.
observation_now:
  total: 45
  terms:
    - {name: projected_gravity, n: 3,  from: IMU,
       note: "which way is down, in the trunk's own frame"}
    - {name: base_ang_vel,      n: 3,  from: IMU,
       note: "how fast the trunk is rotating"}
    - {name: joint_pos,         n: 12, from: potentiometers,
       note: "where each joint actually is"}
    - {name: joint_vel,         n: 12, from: potentiometers,
       note: "differentiated from joint_pos"}
    - {name: last_action,       n: 12, from: software,
       note: "the twelve targets it sent last step"}
    - {name: command,           n: 3,  from: operator,
       note: "forward, sideways, turn"}

# ---------------------------------------------------------------------------
# The sensors, ordered by value for what they cost. Best first.
#
#   status:   fitted | committed | candidate | not_recommended
#   unblocks: which BLOCKED_NEEDS keys in dashboard/skills.py this clears, and
#             roughly how many library rows that is. "-" means it unblocks no
#             library row but is still worth fitting, and says why.
# ---------------------------------------------------------------------------

sensors:

  # --- already decided ----------------------------------------------------

  - key: imu_trunk
    name: Trunk IMU, three of them
    part: "9-DOF, front / exact middle / back"
    status: committed
    spec_checked: false
    measures: >-
      Which way is down, and how fast the trunk is turning. Being 9-DOF they also
      contain magnetometers, which are therefore ALREADY FITTED - see the
      magnetometer row, which is only about whether to read them.
    adds: 0
    already_in_observation: true
    unblocks: {}
    why_anyway: >-
      Not an accuracy improvement. The policy reads two IMU signals every single
      step, so without one no trained policy can run on the real robot at all.
      The middle unit is the one the simulation models, because it sits nearest
      the trunk's centre of mass. The front and back pair are worth more than
      spares: differencing them measures pitch directly, and averaging all three
      cuts the vibration noise a single unit would feed straight into the policy.
    fake_it: "Exact and free. The simulator knows the trunk's true orientation."
    trust_it: >-
      Good, provided the sim adds the noise and bias the real part has. Vibration
      from twelve servos is the thing that bites, and three units averaged is the
      answer to it.
    mass_g: 5

  - key: joint_pots
    name: Joint potentiometers
    part: "rotary on the rotating joints, linear on the knee pushrod, 12 channels"
    status: committed
    spec_checked: false
    measures: "Where every joint actually is."
    adds: 0
    already_in_observation: true
    unblocks: {}
    why_anyway: >-
      24 of the 45 numbers the policy reads are joint_pos and joint_vel. Without
      these they have no source on the real robot and the policy cannot run. The
      linear pot on the pushrod also measures the true knee angle directly, which
      removes the servo-angle-is-not-joint-angle problem the linkage creates.
    fake_it: "Exact and free."
    trust_it: >-
      Depends entirely on calibration - raw ADC counts to radians, per joint, in
      a file. The model is only as good as that mapping. Also needs an external
      ADC: the potentiometers are analog and the Pi has no analog inputs.
    mass_g: 60

  # --- cheap, high value, not yet planned ---------------------------------

  - key: foot_contact
    name: Foot contact switches
    part: "microswitch or FSR under each foot, 4 off"
    status: committed
    count: 4
    spec_checked: false
    measures: "Which feet are on the ground."
    adds: 4
    unblocks: {}
    why_anyway: >-
      The best value on this list. The simulator ALREADY computes perfect foot
      contact and the reward already leans on it heavily - foot_clearance,
      stepping, dragging, ground_covered and landing_speed are all gated on it.
      But contact is used only while TRAINING; the policy itself is never told
      which feet are down, so on the real robot it is guessing. Four switches and
      four numbers close that gap, and the simulator side is already built.
    fake_it: "Free. It is already computed every step for the reward terms."
    trust_it: >-
      Good. A switch is binary and a foot either touches or it does not. The
      failure mode is a switch that sticks or a foot that lands on its edge.
    mass_g: 12

  - key: foot_force
    name: Foot load cells
    part: "thin-film force sensor or a small load cell per foot, 4 off"
    status: committed
    count: 4
    spec_checked: false
    measures: "How hard each foot is pressing, not just whether it is."
    adds: 4
    unblocks: {}
    why_anyway: >-
      The graded version of foot_contact. Turns the landing_speed reward from
      'did it slam' into a measured number, and is the natural signal for the
      smoother-arrival behaviour already added to the walk reward. Also the
      honest way to detect an imminent slip.
    fake_it: "Free. The simulator already has the contact force."
    trust_it: "Medium. Thin-film sensors drift with temperature and wear."
    mass_g: 20

  - key: current_sense
    name: Per-servo current sensing
    part: "INA219 / INA226, one per servo"
    status: committed
    count: 12
    spec_checked: false
    measures: "How hard each individual servo is actually working."
    adds: 12
    unblocks: {}
    why_anyway: >-
      Per-servo rather than one shunt on the rail, which is the owner's call and
      the right one: a rail reading is the sum of twelve servos and only says
      'something is loaded', never which. Twelve channels say which leg is stuck,
      which servo is weakening, and which joint is carrying the robot.
      .
      It is also the closest thing to a torque sensor Gray will have, which makes
      it the measurement that replaces the guessed servo gains kp = 21 and
      kv = 0.6 with real ones. That is the stage 3.3 job, and it is currently one
      of only three numbers in the whole model with no datasheet anywhere.
    fake_it: >-
      Available - the simulator knows the force each actuator applied. Turning
      that into amps needs a torque-per-amp constant, which is one more number to
      measure rather than a modelling problem.
    trust_it: >-
      Good for detecting load, rough as an absolute torque. A hobby servo's
      internal controller sits between the current and the joint, so the mapping
      is not exact - but the shape is right, and the shape is what matters.
    mass_g: 24

  - key: battery
    name: Battery voltage and current
    part: "on the same INA-class shunt, or the BMS if the pack has one"
    status: committed
    spec_checked: false
    measures: "Pack voltage under load, and what is left."
    adds: 2
    unblocks: {}
    why_anyway: >-
      Several library rows are 'same quality at low battery'. Right now those are
      a scene dial with nothing behind them, because a sagging pack means weaker
      servos and the simulator has no battery in it at all.
    fake_it: >-
      Needs a battery model that does not exist - voltage sag against current
      draw. Not hard, but it has to be written.
    trust_it: "Good. Voltage is voltage."
    mass_g: 8

  # --- the cheap answer to "knowing where it is" --------------------------

  - key: optical_flow
    name: Downward optical flow, five of them
    part: "PMW3901 or similar - front, back, centre, left side, right side"
    status: committed
    count: 5
    spec_checked: false
    measures: "How fast the robot is actually sliding over the ground."
    adds: 3
    unblocks: {}
    why_anyway: >-
      The single most valuable addition on this list, and NOT for the reason it
      was first listed. Position was the wrong argument - the owner is the pilot,
      so nothing needs to know where it is. VELOCITY is the argument.
      .
      The policy cannot currently measure its own speed. base_lin_vel exists in
      the simulator but sits in the CRITIC observation group - the half that is
      thrown away after training - precisely because the real robot has no way to
      measure it. So the policy infers its speed from joint motion and the
      gravity vector, while the single largest term in its reward, track_speed,
      scores exactly that quantity. Optical flow measures it directly. R1's speed
      error is currently 0.071 m/s against a 0.05 bar.
      .
      Five units rather than one, and they are not redundant copies. Each reads
      its own velocity, and a unit offset from the centre sees v + omega x r - so
      differencing front against back, and left against right, recovers the yaw
      rate ABOUT THE GROUND. Compare that against the IMU's yaw rate about the
      BODY and the difference is slip: the feet are sliding. Nothing else on this
      list can see a slip. Five also survives two of them sitting over a patch of
      floor with no texture.
    feed_as: >-
      Fused, not raw. Three numbers - vx, vy and ground yaw rate - plus a health
      flag if wanted. Ten raw readings would make the simulator model five
      mounting positions to produce numbers the policy has to re-fuse itself.
    fake_it: >-
      Cheap. The simulator already computes the true trunk velocity for the
      critic; each unit is that value offset by omega x r, with noise and a scale
      error on top.
    trust_it: >-
      Medium, and the failure modes are known. Needs texture on the floor and a
      height reference to turn angle into distance, so it pairs with the downward
      range finder. Dead reckoning drifts without bound - but drift only matters
      if the number is INTEGRATED into a position, and it is not: it is used as a
      rate, which is where this class of sensor is honest.
    mass_g: 15
    pairs_with: [downward_tof]

  - key: downward_tof
    name: Downward range finder
    part: "VL53L1X or similar, one under the trunk"
    status: committed
    spec_checked: false
    measures: "Height of the trunk above the floor."
    adds: 1
    unblocks: {}
    why_anyway: >-
      The owner's read is that this is redundant, and it nearly is - ride height
      can be inferred from joint angles. It stays for one reason: optical flow
      does not work without it. A flow sensor measures an ANGULAR rate, and the
      only way to turn that into metres per second is to know how far the floor
      is. Without a height reference the five flow units have an unknown scale
      factor that changes every time the robot crouches.
      .
      Second-order value on top of that: it measures ride height instead of
      inferring it from a flat-floor assumption, and it sees a step down or a
      hole directly beneath the robot.
    fake_it: "Cheap - a single downward raycast."
    trust_it: >-
      Medium. Fails on dark carpet, glass and polished floors, and reads the top
      of an obstacle rather than the floor when one passes underneath.
    mass_g: 2

  # --- seeing ahead: the cheap way and the expensive way ------------------

  - key: tof_array
    name: Forward and side range finders
    part: "VL53L5CX multi-zone, 8x8 zones each - 3 forward, 1 each side, 1 back"
    status: committed
    count: 6
    spec_checked: false
    measures: "Distance to whatever is around it, in a coarse grid."
    adds: 24
    layout: >-
      Six units. Three across the front, because one 45-degree cone ahead leaves
      the robot blind to anything it is about to clip with a shoulder, and the
      three together cover the full width of the body plus a stride either side.
      One each side, aimed slightly down and forward, which is what sees a wall
      to brace against or a doorway edge. One at the back, because reversing
      blind is how a robot backs into something - and reversing is a command that
      already exists. More than six starts to cost I2C bandwidth and gains
      little; fewer than three across the front leaves a gap the robot walks into.
    feed_as: >-
      Not 64 zones per unit - 384 raw numbers is a heightmap, and a heightmap is
      the depth-camera problem this row exists to avoid. Reduce each unit to four
      numbers: nearest distance, and the height of the nearest return, in each
      half of its field. Twenty-four numbers total, and the simulator produces
      them with a handful of raycasts.
    unblocks: {need: camera, extent: partly}
    why_anyway: >-
      The cheap alternative to a depth camera, and it should be considered before
      one. A ring of these gives 'there is something 300 mm ahead and 40 mm tall'
      - which is most of what obstacle ANTICIPATION needs, and anticipation is
      the only thing a camera buys that touch does not. Reacting to an obstacle
      is already blind and already covered: step, feel the contact, correct.
    fake_it: >-
      Cheap. It is a raycast per zone, which the simulator does natively. Nothing
      has to be rendered. This is the whole reason it beats a camera.
    trust_it: >-
      Good, by the standards of this list. Low resolution, but low resolution
      that matches between sim and reality beats high resolution that does not.
      Fails on dark and glossy surfaces like any ToF.
    mass_g: 6

  - key: depth_camera
    name: Depth camera
    part: "RealSense D435i, OAK-D, or an Arducam ToF"
    status: candidate
    spec_checked: false
    measures: "A height map of the ground ahead."
    adds: "hundreds - a heightmap patch, typically 10x16 or larger"
    unblocks: {need: camera, extent: fully}
    why_anyway: >-
      The full answer to seeing. Finds stairs from a metre away, follows a path,
      picks a foothold. Nothing else on this list does those.
    fake_it: >-
      EXPENSIVE, and this is the real cost - not the camera. The simulator has to
      produce a heightmap for every robot every step: 4500 robots at 50 Hz. That
      is a different class of computation from a raycast and it will cut the
      number of robots that fit on the card.
    trust_it: >-
      The worst on this list, and it is not close. In simulation the heightmap is
      perfect, complete and free. On the robot it is a noisy 30 Hz depth image
      full of holes, with a different field of view, mounted somewhere slightly
      different from where the sim thinks it is. This is the hardest sim-to-real
      gap in the whole field. Its own project, after the robot walks.
    decided: >-
      Accepted as its own project on 3 Aug 2026 and left parked. Note that this
      is NOT the camera the owner drives Gray by - that one is a video feed to a
      human and costs the policy nothing, because the pilot does the seeing. This
      row is only about a camera the POLICY reads, which is what makes it
      expensive. Fit the range finders first and find out how much of this is
      still wanted.
    mass_g: 75

  # --- heading, and absolute position -------------------------------------

  - key: magnetometer
    name: Magnetometer
    part: "already inside the three 9-DOF trunk IMUs"
    status: committed
    count: 3
    spec_checked: false
    measures: "Absolute heading, against the earth's field."
    adds: 0
    unblocks: {}
    why_anyway: >-
      The owner's point stands and settles this row: the IMUs are 9-DOF, so three
      magnetometers are ALREADY FITTED. Nothing needs buying and nothing needs
      mounting. The only open question is whether to put the reading into the
      observation, and the answer for now is no - which is why `adds` is 0.
      .
      What it would buy: the IMU measures how fast the trunk is TURNING, not
      which way it is POINTING. Heading has to be integrated from that rate, and
      an integrated rate drifts without bound. But with a human on the sticks,
      heading drift is something the pilot corrects without noticing, the way
      nobody notices steering a car. Revisit only if a policy is ever asked to
      hold a heading on its own.
      .
      Note also: R1's current drift failure is a TRAINING problem, not a sensing
      one. In simulation the heading is exact and always was.
    fake_it: "Trivially exact - the simulator knows the true heading."
    trust_it: >-
      Poor, which is the other half of why it stays out of the observation.
      Twelve servos, their currents and any steel in the frame distort the local
      field badly - a magnetometer bolted near a motor reads the motor. Three
      units at different distances from the servos would at least make the
      distortion visible. Needs hard-iron calibration and may still be unusable.
    mass_g: 0

  - key: uwb_anchors
    name: Ultra-wideband anchors
    part: "DW1000-class tags, three or more anchors around the room"
    status: not_recommended
    spec_checked: false
    measures: "True absolute position, to a few centimetres."
    adds: 3
    unblocks: {}
    why_anyway: >-
      Was the honest answer to 'knowing where it is'. Dropped on 3 Aug 2026 with
      the whole question: the owner flies Gray with a camera and a controller, so
      a human supplies the position and the robot never needs it. The seven rows
      this would have unblocked are now marked 'the pilot does it' rather than
      blocked.
      .
      Kept in the file rather than deleted so the decision is recorded. Un-park
      it only if Gray is ever asked to do something with nobody on the sticks.
    fake_it: "Free. The simulator knows the true position exactly."
    trust_it: >-
      Good where it works, and that is the catch: the ROOM has to be
      instrumented. The robot knows where it is inside the volume the anchors
      cover and nowhere else.
    mass_g: 15

  - key: gps
    name: GNSS
    part: "any u-blox module"
    status: not_recommended
    spec_checked: false
    measures: "Absolute position, outdoors, to metres."
    adds: 2
    unblocks: {}
    why_anyway: >-
      The owner is willing to fit one but does not see the point, and is right
      not to. Metre-level accuracy against a robot whose drift bar is 100 mm is
      two orders of magnitude too coarse, it does not work indoors, and the
      position question it answers has just been handed to the pilot anyway. It
      would occupy slots in the observation to tell the policy something less
      precise than the thing it is already failing to hold.
      .
      Recommendation: do not fit it. Listed so the option is closed rather than
      forgotten.
    fake_it: "Trivial."
    trust_it: "Irrelevant - the resolution is wrong for the job."
    mass_g: 5

  # --- safety, not skills -------------------------------------------------

  - key: servo_temp
    name: Servo temperature
    part: "thermistor or an IR spot on each servo case"
    status: not_recommended
    spec_checked: false
    measures: "How hot each servo is getting."
    adds: 0
    unblocks: {}
    why_anyway: >-
      Dropped on the owner's call: Gray will not run long enough in one sitting
      to cook a servo, so twelve thermistors and twelve more ADC channels buy
      nothing. Per-servo current sensing is already going in, and a servo that is
      about to overheat is a servo drawing too much current for too long - so the
      warning is available from a channel that is being fitted anyway.
    fake_it: "Would need a thermal model. Nothing has one and nothing needs one."
    trust_it: "Fine - it is a threshold, not a control input."
    mass_g: 12

# ---------------------------------------------------------------------------
# Actuators. Not a sensor, but the owner's question came in the same breath and
# the answer is the same shape: the obvious upgrade is not free, and the cost is
# not money.
# ---------------------------------------------------------------------------

actuators:
  now:
    model: DS3218MG
    torque_kgcm: 20
    torque_nm: 1.96
    speed_s_per_60deg: 0.16
    mass_g: 60
    note: "12 off. Torque margin today is 2.73x - the worst-loaded joint needs
           0.72 of 1.96 N-m at ride height."

  # The point of this table is the MASS column, not the torque column.
  options:
    - {torque_kgcm: 25, case: "standard 20 mm", mass_g: 60,  verdict: "near-free"}
    - {torque_kgcm: 35, case: "standard 20 mm", mass_g: 65,  verdict: "still cheap"}
    - {torque_kgcm: 45, case: "oversize",       mass_g: 150, verdict: "expensive in mass"}
    - {torque_kgcm: 60, case: "oversize",       mass_g: 165, verdict: "expensive in mass"}
  options_spec_checked: false

  the_catch: >-
    There is a cliff between about 35 kg-cm and about 45 kg-cm. Up to roughly
    35 the servo stays in the standard 20 mm case and the mass barely moves, so
    it is close to a free upgrade. Past that the case grows and each servo goes
    from about 60 g to about 150 g. Twelve of those is about +1080 g, which puts
    Gray near 4.2 kg - and the extra torque was needed because of mass in the
    first place.

  the_worse_catch: >-
    Eight of the twelve servos live in the hip modules, on the legs. Adding 90 g
    each puts about 720 g INTO THE LEGS. Leg mass is already 36% of the robot,
    and leg inertia is what limits how fast a leg can be swung and how hard a
    stumble is to arrest. Heavier servos make the legs harder to move, which
    eats part of the torque they just bought. Body-mounted servos - the four hip
    abductors - do not have this problem and could be upgraded on their own.

  and_the_real_point: >-
    Torque is not what blocks jumping. SPEED is. Rough arithmetic puts a push-off
    at roughly 60 degrees of knee travel in about 0.13 s, against the DS3218's
    0.16 s per 60 degrees no-load - already marginal before any load is applied.
    And higher torque in a hobby servo usually comes from MORE gear reduction,
    which makes it SLOWER. So a 45 kg-cm servo can easily be worse for jumping
    than the 20 kg-cm one it replaced. Read the speed line of the datasheet, not
    the torque line, and measure it under load in stage 3.3 before buying.
